openapi: 3.1.0
info:
  title: Seller management - Transactions
  version: 1.0.0
  description: API for merchant transactions operations
  contact:
    name: API Support
    url: https://developers.pismo.io/support
  license:
    name: Copyright Pismo
servers:
  - url: https://sandbox.pismolabs.io/sellers
    description: Sandbox API server for testing
security:
  - bearerAuth: []
tags:
  - name: Split requests
    description: Endpoints for managing split requests
  - name: Balance
    description: Balance endpoints
  - name: Merchant transactions
    description: Endpoint for managing merchant transactions
  - name: Status authorization
    description: Status authorization endpoint
  - name: Transaction totals
    description: Endpoints for merchant transaction totals and period summaries
components:
  parameters:
    AuthorizationHeader:
      in: header
      name: Authorization
      description: Authorization token
      required: true
      schema:
        type: string
      example: <your_token>
    authorizationIdQuery:
      in: query
      name: authorizationId
      description: >-
        Authorization ID filter. When provided, the maximum date range is 365
        days.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 987654
    balanceDateQuery:
      in: query
      name: date
      description: >
        Target date to compose the balance amount. The date format used is ISO
        8601.

        minLength: 10

        maxLength: 10


        The date must be the current or a future date. If not provided, it
        defaults to the current date of the target merchant timezone.
      schema:
        type: string
        format: date
      example: '2025-04-20T00:00:00.000Z'
    endDateQuery:
      in: query
      name: endDate
      description: |
        The end date of the split requests. The date format used is ISO 8601.
        minLength: 10
        maxLength: 10
      schema:
        type: string
        format: date
      example: '2023-10-30T00:00:00.000Z'
    endPaymentDateQuery:
      in: query
      name: endPaymentDate
      description: >
        End of the payment-date range, as YYYY-MM-DD (ISO 8601). Must be on or
        after `startPaymentDate`, and the range cannot exceed 1 year.
      required: true
      schema:
        type: string
        format: date
      example: '2026-01-31'
    groupByQuery:
      in: query
      name: groupBy
      description: >
        Dimension used to aggregate the totals. Allowed values are `status`,
        `date`, and `date_and_status`. The `date` and `date_and_status` values
        honor the `order` parameter; `status` ignores it.
      required: false
      schema:
        type: string
        enum:
          - status
          - date
          - date_and_status
        default: status
      example: status
    marketplaceIdPath:
      in: path
      name: marketplaceId
      required: true
      description: Marketplace ID
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    marketplaceIdQuery:
      in: query
      name: marketplaceId
      description: Optional marketplace filter applied to the aggregation.
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    merchantIdPath:
      in: path
      name: merchantId
      required: true
      description: Merchant ID
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    merchantTransactionIdPath:
      in: path
      name: merchantTransactionId
      description: Merchant transaction ID
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    nextCursorQuery:
      in: query
      name: nextCursor
      description: >-
        Opaque pagination token returned in the `next_cursor` field of the
        previous response. Do not build or change it.
      required: false
      schema:
        type: string
      example: eyJldmVudF9zdGFydCI6Li4ufQ
    orderQuery:
      in: query
      name: order
      description: >
        Sort direction for the aggregated items. Applies only when groupBy
        includes date; ignored for groupBy status.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      example: desc
    pageQuery:
      in: query
      name: page
      description: |
        Page number of the returned split request list.
        When this value is not provided, it defaults to 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      example: 1
    parentAuthorizationIdQuery:
      in: query
      name: parentAuthorizationId
      description: >-
        Parent authorization ID filter. When provided, the maximum date range is
        365 days.
      required: false
      schema:
        type: string
        maxLength: 52
      example: '987654'
    parentIdPath:
      in: path
      name: parentId
      description: Parent split request ID
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    perPageQuery:
      in: query
      name: perPage
      description: |
        Number of rows per page.
        When this value is not provided, it defaults to 10.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      example: 1
    processingCodeQuery:
      in: query
      name: processingCode
      description: >
        Processing code filter.

        For more information, refer to [Processing
        codes](doc:processing-codes-and-transaction-types).
      required: false
      schema:
        type: string
        maxLength: 10
      example: '003000'
    splitIdPath:
      in: path
      name: splitId
      description: Split request ID
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    startDateQuery:
      in: query
      name: startDate
      description: |
        The start date of the split requests. Format is ISO 8601.
        minLength: 10
        maxLength: 10
      schema:
        type: string
        format: date
      example: '2023-10-05T00:00:00.000Z'
    startPaymentDateQuery:
      in: query
      name: startPaymentDate
      description: >
        Start of the payment-date range, as YYYY-MM-DD (ISO 8601). The range
        between `startPaymentDate` and `endPaymentDate` cannot exceed 1 year.
      required: true
      schema:
        type: string
        format: date
      example: '2026-01-01'
    transactionIdPath:
      in: path
      name: transactionId
      description: Merchant transaction ID
      required: true
      schema:
        type: integer
        format: uint64
        minimum: 1
        maximum: 18446744073709552000
      example: 1
    transactionListEndEventDateQuery:
      in: query
      name: endEventDate
      description: >
        End of the event-date range, in ISO 8601 date-time format (UTC). Must be
        on or after `startEventDate`.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-07-31T23:59:59Z'
    transactionListEndPaymentDateQuery:
      in: query
      name: endPaymentDate
      description: >
        End of the scheduled payment-date range, as YYYY-MM-DD (ISO 8601). Must
        be on or after `startPaymentDate`.
      required: false
      schema:
        type: string
        format: date
      example: '2026-07-31'
    transactionListOrderQuery:
      in: query
      name: order
      description: >
        Sort direction by event date. When this value is not provided, it
        defaults to `asc`.
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
      example: asc
    transactionListPerPageQuery:
      in: query
      name: perPage
      description: >
        Number of items per page, from 1 to 100. When this value is not
        provided, it defaults to 10. It can change between pages.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    transactionListStartEventDateQuery:
      in: query
      name: startEventDate
      description: >
        Start of the event-date range, in ISO 8601 date-time format (UTC).
        Required with `endEventDate` when no payment-date range is provided.
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-07-13T00:00:00Z'
    transactionListStartPaymentDateQuery:
      in: query
      name: startPaymentDate
      description: >
        Start of the scheduled payment-date range, as YYYY-MM-DD (ISO 8601).
        Required with `endPaymentDate` when no event-date range is provided.
      required: false
      schema:
        type: string
        format: date
      example: '2026-07-13'
    transactionStatusQuery:
      in: query
      name: status
      description: Optional transaction-status filter applied to the aggregation.
      required: false
      schema:
        $ref: '#/components/schemas/MerchantTransactionTotalStatus'
      example: SETTLED
  schemas:
    AdvancementRequestId:
      type: integer
      format: int64
      nullable: true
      description: Advancement Requested id
    AuthorizationId:
      type: number
      format: int64
      nullable: true
      description: Authorization identifier
    BalanceRequestGetResponse:
      type: object
      properties:
        currency_code:
          $ref: '#/components/schemas/OptionalCurrencyCodeResponse'
        current_available_amount:
          $ref: '#/components/schemas/CurrentAvailableAmount'
        date:
          $ref: '#/components/schemas/TargetDate_date'
        estimated_available_amount:
          $ref: '#/components/schemas/EstimatedAvailableAmount'
        scheduled_amount:
          $ref: '#/components/schemas/ScheduledAmount'
    CreditorId:
      type: integer
      format: int64
      nullable: true
      description: Creditor identifier
    CurrencyCode:
      description: >
        Represents the currency with an ISO-4217 alphabetic or numeric (3
        characters) string. For example, you represent Brazilian real with
        either BRL or 986.

        If you don't provide this code, the system uses the currency from the
        merchant program.
      type: string
      examples:
        - BRL
        - '986'
    CurrencyCodeResponse:
      description: |
        ISO-4217 alphabetic (3 characters) currency code
      type: string
      example: BRL
    CurrentAvailableAmount:
      type: number
      format: float
      description: >-
        Amount available in the merchant account. It is always the exact amount
        in that account, regardless of the target date
    DefaultErrorResponse:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        details:
          $ref: '#/components/schemas/ErrorDetails'
        message:
          $ref: '#/components/schemas/ErrorMessage'
    DiscountAmount:
      description: Total discount amount applied to the transaction
      type: number
      format: float
      example: 1.99
    DiscountDetail:
      description: >-
        The `amount` represents the fee applied - that is, the amount discounted
        before settlement.
      type: object
      properties:
        amount:
          description: Total discount amount
          type: number
          format: float
          example: 10
        name:
          description: Discount name
          type: string
          example: EMISSION_FEE
    ErrorCode:
      type: string
      description: Pismo internal error code
    ErrorDetails:
      type: object
      description: If necessary, this field shows which fields failed validation
      properties:
        payload:
          type: array
          description: List of fields with error
          items:
            type: object
            description: A field that failed validation
            properties:
              field:
                $ref: '#/components/schemas/ErrorField'
              message:
                $ref: '#/components/schemas/ErrorFieldMessage'
    ErrorField:
      type: string
      description: Name of field with error
    ErrorFieldMessage:
      type: string
      description: Error Message referring to the field
    ErrorMessage:
      type: string
      description: Error message
    EstimatedAvailableAmount:
      type: number
      format: float
      description: >-
        Estimated available amount in the merchant account on the target date.
        This includes all scheduled amounts that are projected to be settled and
        available in the merchant account by that date.
    EventDate:
      type: string
      format: datetime
      description: Event datetime. The datetime format follows the ISO 8601 format (UTC).
      example: '2023-01-01T12:00:00Z'
    Fee:
      type: number
      format: float
      description: Merchant transaction fee
    Installment:
      type: integer
      format: int32
      description: Current instalment
      minimum: 1
      maximum: 2147483647
      example: 1
    Installments:
      type: integer
      format: int32
      description: Number of installments
      minimum: 1
      maximum: 2147483647
      example: 1
    InternalServerErrorMessage:
      type: string
      description: Internal server error
    InternalServerErrorResponse:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/InternalServerErrorMessage'
    MarketplaceId:
      type: integer
      format: uint64
      description: Marketplace ID
      minimum: 1
      maximum: 18446744073709552000
      example: 1
    MdrAmount:
      type: number
      format: float
      description: Merchant transaction MDR amount
    MdrTax:
      type: number
      format: float
      description: Merchant transaction MDR amount of marketplace
    MdrWithoutFee:
      type: number
      format: float
      description: Merchant transaction MDR amount without fee
    MerchantId:
      type: integer
      format: uint64
      description: Merchant ID
      minimum: 1
      maximum: 18446744073709552000
      example: 1
    MerchantTransactionAdvancedAmount:
      type: number
      format: float
      description: Merchant transaction amount already advanced
      example: 0
    MerchantTransactionAmount:
      type: number
      format: float
      nullable: false
      description: Merchant transaction amount
    MerchantTransactionAuthorizationRequest:
      type: object
      required:
        - id
        - parent_id
      properties:
        id:
          type: integer
          format: int64
          description: Authorization identifier
          example: 12345
        parent_id:
          type: integer
          format: int64
          description: Parent authorization identifier from the original transaction
          example: 12345
    MerchantTransactionCancelPostRequest:
      type: object
      required:
        - event_date
        - amount
        - authorization
        - processing_code
      properties:
        amount:
          $ref: '#/components/schemas/MerchantTransactionAmount'
        authorization:
          $ref: '#/components/schemas/MerchantTransactionAuthorizationRequest'
        event_date:
          $ref: '#/components/schemas/EventDate'
        processing_code:
          $ref: '#/components/schemas/ProcessingCode'
    MerchantTransactionGetByIdResponse:
      type: object
      properties:
        advanced_amount:
          $ref: '#/components/schemas/MerchantTransactionAdvancedAmount'
        advancement_request_id:
          $ref: '#/components/schemas/AdvancementRequestId'
        amount:
          $ref: '#/components/schemas/MerchantTransactionAmount'
        authorization_id:
          $ref: '#/components/schemas/AuthorizationId'
        currency_code:
          $ref: '#/components/schemas/OptionalCurrencyCodeResponse'
        discount_amount:
          $ref: '#/components/schemas/DiscountAmount'
        discount_details:
          type: array
          description: List of discounts applied to the transaction
          items:
            $ref: '#/components/schemas/DiscountDetail'
        event_date:
          $ref: '#/components/schemas/EventDate'
        fee:
          $ref: '#/components/schemas/Fee'
        id:
          $ref: '#/components/schemas/MerchTransId'
        installment:
          $ref: '#/components/schemas/Installment'
        marketplace_id:
          $ref: '#/components/schemas/MarketplaceId'
        mdr_amount:
          $ref: '#/components/schemas/MdrAmount'
        mdr_tax:
          $ref: '#/components/schemas/MdrTax'
        mdr_without_fee:
          $ref: '#/components/schemas/MdrWithoutFee'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        net_amount:
          $ref: '#/components/schemas/MerchantTransactionNetAmount'
        number_of_installments:
          $ref: '#/components/schemas/NumberOfInstallments'
        org_operation_id:
          $ref: '#/components/schemas/OrgOperationId'
        origin_merchant_transaction_id:
          $ref: '#/components/schemas/OriginMerchTransId'
        parent_authorization_id:
          $ref: '#/components/schemas/MerchantTransactionParentAuthorizationId'
        processing_code:
          $ref: '#/components/schemas/MerchTransProcessingCode'
        scheduled_payment_date:
          $ref: '#/components/schemas/ScheduledPaymentDate'
        status:
          $ref: '#/components/schemas/MerchTransactionStatus'
        type:
          $ref: '#/components/schemas/MerchTransactionType'
    MerchantTransactionListItemResponse:
      type: object
      properties:
        advanced_amount:
          $ref: '#/components/schemas/MerchantTransactionAdvancedAmount'
        advancement_request_id:
          $ref: '#/components/schemas/AdvancementRequestId'
        amount:
          $ref: '#/components/schemas/MerchantTransactionAmount'
        authorization_id:
          $ref: '#/components/schemas/AuthorizationId'
        currency_code:
          $ref: '#/components/schemas/OptionalCurrencyCodeResponse'
        discount_amount:
          $ref: '#/components/schemas/DiscountAmount'
        event_date:
          $ref: '#/components/schemas/EventDate'
        fee:
          $ref: '#/components/schemas/Fee'
        id:
          $ref: '#/components/schemas/MerchTransId'
        installment:
          $ref: '#/components/schemas/Installment'
        marketplace_id:
          $ref: '#/components/schemas/MarketplaceId'
        mdr_amount:
          $ref: '#/components/schemas/MdrAmount'
        mdr_tax:
          $ref: '#/components/schemas/MdrTax'
        mdr_without_fee:
          $ref: '#/components/schemas/MdrWithoutFee'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        net_amount:
          $ref: '#/components/schemas/MerchantTransactionNetAmount'
        number_of_installments:
          $ref: '#/components/schemas/NumberOfInstallments'
        org_operation_id:
          $ref: '#/components/schemas/OrgOperationId'
        origin_merchant_transaction_id:
          $ref: '#/components/schemas/OriginMerchTransId'
        parent_authorization_id:
          $ref: '#/components/schemas/MerchantTransactionParentAuthorizationId'
        processing_code:
          $ref: '#/components/schemas/MerchTransProcessingCode'
        scheduled_payment_date:
          $ref: '#/components/schemas/ScheduledPaymentDate'
        status:
          $ref: '#/components/schemas/MerchTransactionStatus'
        type:
          $ref: '#/components/schemas/MerchTransactionType'
    MerchantTransactionNetAmount:
      type: number
      format: float
      description: Net amount of the transaction, computed as amount minus discount_amount.
      example: 149.6
    MerchantTransactionPaginatedListResponse:
      type: object
      required:
        - has_next
        - items
        - next_cursor
        - per_page
      properties:
        has_next:
          type: boolean
          description: Is there a next page?
          example: true
        items:
          type: array
          description: >-
            List of merchant transactions for the page. It is empty when no
            transaction matches the filters.
          items:
            $ref: '#/components/schemas/MerchantTransactionListItemResponse'
        next_cursor:
          type: string
          nullable: true
          description: >-
            Opaque token to send in the nextCursor parameter to get the next
            page. `null` on the last page.
          example: eyJldmVudF9zdGFydCI6Li4ufQ
        per_page:
          type: integer
          format: int32
          description: Number of items per page.
          example: 10
    MerchantTransactionParentAuthorizationId:
      type: string
      nullable: true
      description: Parent authorization identifier
      example: '987654'
    MerchantTransactionPatchStatus:
      type: string
      enum:
        - PENDING
        - SCHEDULED
        - CANCELED
      description: New status for the merchant transaction.
      example: CANCELED
    MerchantTransactionPatchStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/MerchantTransactionPatchStatus'
        reason:
          $ref: '#/components/schemas/MerchantTransactionStatusReason'
    MerchantTransactionResponse:
      type: object
      properties:
        advanced_amount:
          $ref: '#/components/schemas/MerchTransId'
        advancement_request_id:
          $ref: '#/components/schemas/AdvancementRequestId'
        amount:
          $ref: '#/components/schemas/MerchantTransactionAmount'
        authorization_id:
          $ref: '#/components/schemas/AuthorizationId'
        creditor_id:
          $ref: '#/components/schemas/CreditorId'
        currency_code:
          $ref: '#/components/schemas/CurrencyCodeResponse'
        discount_amount:
          $ref: '#/components/schemas/DiscountAmount'
        discount_details:
          type: array
          description: List of discounts applied to the transaction
          items:
            $ref: '#/components/schemas/DiscountDetail'
        event_date:
          $ref: '#/components/schemas/EventDate'
        fee:
          $ref: '#/components/schemas/Fee'
        id:
          $ref: '#/components/schemas/MerchTransId'
        installment:
          $ref: '#/components/schemas/Installment'
        marketplace_id:
          $ref: '#/components/schemas/MarketplaceId'
        mdr_amount:
          $ref: '#/components/schemas/MdrAmount'
        mdr_tax:
          $ref: '#/components/schemas/MdrTax'
        mdr_without_fee:
          $ref: '#/components/schemas/MdrWithoutFee'
        merchant_id:
          $ref: '#/components/schemas/MerchantId'
        net_amount:
          $ref: '#/components/schemas/MerchantTransactionNetAmount'
        number_of_installments:
          $ref: '#/components/schemas/NumberOfInstallments'
        org_operation_id:
          $ref: '#/components/schemas/OrgOperationId'
        origin_merchant_transaction_id:
          $ref: '#/components/schemas/OriginMerchTransId'
        parent_authorization_id:
          $ref: '#/components/schemas/ParentAuthorizationId'
        processing_code:
          $ref: '#/components/schemas/MerchTransProcessingCode'
        scheduled_payment_date:
          $ref: '#/components/schemas/ScheduledPaymentDate'
        status:
          $ref: '#/components/schemas/MerchTransactionStatus'
        type:
          $ref: '#/components/schemas/MerchTransactionType'
    MerchantTransactionSalePostRequest:
      type: object
      required:
        - event_date
        - amount
        - installments
        - processing_code
      properties:
        amount:
          $ref: '#/components/schemas/MerchantTransactionAmount'
        event_date:
          $ref: '#/components/schemas/EventDate'
        installments:
          $ref: '#/components/schemas/Installments'
        processing_code:
          $ref: '#/components/schemas/ProcessingCode'
        authorization_id:
          $ref: '#/components/schemas/AuthorizationId'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        transaction_status:
          $ref: '#/components/schemas/MerchTransactionRequestStatus'
    MerchantTransactionsResponseList:
      type: object
      properties:
        items:
          type: array
          description: List of merchant transactions
          items:
            $ref: '#/components/schemas/MerchantTransactionResponse'
    MerchantTransactionStatusReason:
      type: string
      maxLength: 200
      description: Free-text reason for the status change.
      example: customer requested cancellation
    MerchantTransactionSummaryResponse:
      type: object
      required:
        - discount_amount
        - gross_amount
        - net_amount
      properties:
        discount_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalDiscountAmount'
        gross_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalGrossAmount'
        net_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalNetAmount'
    MerchantTransactionTotalDiscountAmount:
      type: number
      format: float
      description: Total discount amount aggregated for the period.
      example: 75.35
    MerchantTransactionTotalGrossAmount:
      type: number
      format: float
      description: Total gross amount aggregated for the period.
      example: 1500.75
    MerchantTransactionTotalItem:
      type: object
      required:
        - discount_amount
        - gross_amount
        - net_amount
      properties:
        discount_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalDiscountAmount'
        gross_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalGrossAmount'
        net_amount:
          $ref: '#/components/schemas/MerchantTransactionTotalNetAmount'
        scheduled_payment_date:
          $ref: '#/components/schemas/MerchantTransactionTotalPaymentDate'
        status:
          $ref: '#/components/schemas/MerchantTransactionTotalStatus'
    MerchantTransactionTotalNetAmount:
      type: number
      format: float
      description: >-
        Net amount for the period, computed as gross_amount minus
        discount_amount.
      example: 1425.4
    MerchantTransactionTotalPaymentDate:
      type: string
      format: date
      description: Scheduled payment date of the aggregated group, as YYYY-MM-DD.
      example: '2024-09-27'
    MerchantTransactionTotalsListResponse:
      type: object
      properties:
        has_next:
          type: boolean
          description: Is there a next page?
          example: false
        items:
          type: array
          description: List of aggregated transaction totals for the page.
          items:
            $ref: '#/components/schemas/MerchantTransactionTotalItem'
        page:
          type: integer
          format: int64
          description: Current page number.
          example: 1
        per_page:
          type: integer
          format: int64
          description: Number of items per page.
          example: 100
    MerchantTransactionTotalStatus:
      type: string
      enum:
        - PENDING
        - SCHEDULED
        - SETTLED
        - CANCELED
        - WAITING_SPLIT
        - SPLITTED
      description: Merchant transaction status used as an aggregation key and filter.
      example: SETTLED
    MerchTransactionRequestStatus:
      type: string
      nullable: true
      description: >
        Defines the status of the merchant transaction request.


        - The default value is `SCHEDULED` for merchant schedulers, or
        `WAITING_SPLIT` for marketplace schedulers.

        - The `WAITING_SPLIT` status should only be used when the transaction
        needs to wait for split request processing,

        and only if the `merchant_id` provided is the `schedule_id`.

        - The `schedule_id` can be obtained through the [marketplace query
        API](https://developers.pismo.io/pismo-docs/reference/getmarketplacebyidv2).
      enum:
        - PENDING
        - SCHEDULED
        - SETTLED
        - CANCELED
        - WAITING_SPLIT
    MerchTransactionStatus:
      type: string
      nullable: false
      description: Merchant transaction status
    MerchTransactionType:
      type: string
      nullable: false
      description: Merchant transaction type
    MerchTransId:
