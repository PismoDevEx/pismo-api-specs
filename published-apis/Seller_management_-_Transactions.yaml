paths:
  /v1/transactions/{merchantTransactionId}/split:
    post:
      summary: Create split request
      description: >
        Create a new split request for a merchant transaction.<br>

        Managing financial transactions often requires dividing a single
        transaction into multiple parts for accurate record-keeping and
        reporting. The split transaction feature addresses this need by allowing
        you to split a transaction into different categories or assign portions
        to various accounts. This functionality is particularly useful for
        handling shared expenses, allocating costs across different budget
        categories, or separating business and personal expenses.

        When a split request is created, it's created with a `PENDING` status.
        Before you request a split, make sure the merchant transaction is
        already in the `WAITING_SPLIT` status.<br>

        This endpoint generates a [Merchant transaction
        created](https://developers.pismo.io/events/docs/merchants-merchant-transaction-created-1)
        event.
      tags:
        - Split requests
      operationId: post-split-request
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantTransactionIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequestPostSaleRequest'
            examples:
              split-request-post:
                $ref: '#/components/examples/SplitRequestPostSaleRequest'
      responses:
        '202':
          $ref: '#/components/responses/202CreateSplitRequestAccepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/transactions/{merchantTransactionId}/split/cancel:
    post:
      summary: Cancel split request
      description: >
        Cancel a merchant transaction split request.<br>

        This endpoint generates a [Merchant transaction
        created](https://developers.pismo.io/events/docs/merchants-merchant-transaction-created-1)
        event.
      tags:
        - Split requests
      operationId: cancel-split-request
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantTransactionIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequestPostCancelRequest'
            examples:
              split-request-post:
                $ref: '#/components/examples/SplitRequestPostCancelRequest'
      responses:
        '202':
          $ref: '#/components/responses/202CancelSplitRequestAccepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/split-requests:
    get:
      summary: List split requests
      description: List split requests for a given marketplace.
      tags:
        - Split requests
      operationId: get-split-requests
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/marketplaceIdPath'
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/perPageQuery'
        - $ref: '#/components/parameters/startDateQuery'
        - $ref: '#/components/parameters/endDateQuery'
      responses:
        '200':
          $ref: '#/components/responses/200SplitRequestListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/split-requests/{splitId}:
    get:
      summary: Get split request details
      description: Get the details of a specific split request in a marketplace.
      tags:
        - Split requests
      operationId: get-split-details
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/splitIdPath'
        - $ref: '#/components/parameters/marketplaceIdPath'
      responses:
        '200':
          $ref: '#/components/responses/200SplitRequestGetDetails'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/split-requests/{parentId}/totals:
    get:
      summary: Get split request totals
      description: >
        Get the total amount for a specific split request in a marketplace.<br>

        This endpoint returns the gross amount for a specific parent split
        request with the `PROCESSED` status. It also return the gross amount for
        each participating merchant, as well as marketplace merchants.
      tags:
        - Split requests
      operationId: get-sale-split-request-totals
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/parentIdPath'
        - $ref: '#/components/parameters/marketplaceIdPath'
      responses:
        '200':
          $ref: '#/components/responses/200SplitRequestGetTotalsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/merchants/{merchantId}/balance:
    get:
      summary: Get merchant balance
      description: >
        The merchant balance endpoint provides an estimate of the available
        funds in the merchant account on a specified target date. It takes into
        account the scheduled merchant transactions in the specified marketplace
        to calculate the estimated values.


        `estimated_available_amount` represents the forecasted amount that might
        be available to the merchant on the target date, based on the current
        scheduled transactions. This estimate is subject to change due to
        cancellations, new transactions, and advancements made by the merchant
        until the target date arrives.


        If the merchant's scheduled balance is negative, the amount accumulates
        in the `scheduled_amount` field until it becomes positive and is
        available for settlement. Therefore, a negative `scheduled_amount` is
        not considered for settlement until it turns positive.
      tags:
        - Balance
      operationId: get-merchant-balance
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/marketplaceIdPath'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/balanceDateQuery'
      responses:
        '200':
          $ref: '#/components/responses/200GetMerchantBalanceResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/merchants/{merchantId}/transactions:
    post:
      summary: Create merchant transaction
      description: >
        Create a new merchant transaction (sale) for a specific merchant
        associated with a marketplace.


        This endpoint allows for the creation of merchant sale transactions with
        installment support, MDR calculations, and scheduled payment dates. The
        default status is `SCHEDULED`. However, if the merchant is a marketplace
        scheduler, the transaction will automatically be set to `WAITING_SPLIT`
        status.


        This endpoint generates a [Merchant transaction
        created](https://developers.pismo.io/events/docs/merchants-merchant-transaction-created-1)
        event.
      tags:
        - Merchant transactions
      operationId: post-merchant-transaction-sale
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/marketplaceIdPath'
        - $ref: '#/components/parameters/merchantIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantTransactionSalePostRequest'
            examples:
              merchant-transaction-sale-post:
                $ref: '#/components/examples/MerchantTransactionSalePostRequest'
      responses:
        '201':
          $ref: '#/components/responses/201MerchantTransactionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}/merchants/{merchantId}/transactions/cancel:
    post:
      summary: Cancel merchant transaction
      description: >
        Cancel a previously created merchant transaction.


        This endpoint allows for the creation of cancellation transactions that
        reverse the financial impact of original sale transactions.

        Cancellation transactions maintain negative amounts of all financial
        values (amount, MDR, fees) and reference the original transaction via
        origin_merchant_transaction_id.


        When the original transaction was split, the cancellation status is
        automatically set to `WAITING_SPLIT`, otherwise it follows the default
        status (`SCHEDULED`).


        This endpoint generates a [Merchant transaction
        created](https://developers.pismo.io/events/docs/merchants-merchant-transaction-created-1)
        event.
      tags:
        - Merchant transactions
      operationId: post-merchant-transaction-cancel
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/marketplaceIdPath'
        - $ref: '#/components/parameters/merchantIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantTransactionCancelPostRequest'
            examples:
              merchant-transaction-cancel-post:
                $ref: '#/components/examples/MerchantTransactionCancelPostRequest'
      responses:
        '201':
          $ref: '#/components/responses/201MerchantTransactionListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v4/merchants/{merchantId}/transactions:
    get:
      summary: List merchant transactions
      description: >
        List a merchant's transactions for a date range, using cursor-based
        pagination.


        A complete date range is required: either `startEventDate` and
        `endEventDate`, or `startPaymentDate` and `endPaymentDate`. The range
        can span up to 62 days. When you also filter by `authorizationId` or
        `parentAuthorizationId`, the range can span up to 365 days. These
        filters raise the limit but never replace the date range.


        Results are always sorted by event date and then by merchant transaction
        ID, in the direction set by `order`. A payment-date range only filters
        the results and does not change the sort.


        To get the next page, send the `next_cursor` value from the previous
        response in the `nextCursor` parameter. The cursor keeps the filters and
        sort order of the first request. On continuation requests, only
        `perPage` can change. Any filter or `order` value that differs from the
        cursor returns a `400` error. On the last page, `has_next` is `false`
        and `next_cursor` is `null`.
      tags:
        - Merchant transactions
      operationId: get-merchant-transactions
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/transactionListStartEventDateQuery'
        - $ref: '#/components/parameters/transactionListEndEventDateQuery'
        - $ref: '#/components/parameters/transactionListStartPaymentDateQuery'
        - $ref: '#/components/parameters/transactionListEndPaymentDateQuery'
        - $ref: '#/components/parameters/authorizationIdQuery'
        - $ref: '#/components/parameters/parentAuthorizationIdQuery'
        - $ref: '#/components/parameters/processingCodeQuery'
        - $ref: '#/components/parameters/transactionListOrderQuery'
        - $ref: '#/components/parameters/transactionListPerPageQuery'
        - $ref: '#/components/parameters/nextCursorQuery'
      responses:
        '200':
          $ref: '#/components/responses/200MerchantTransactionPaginatedListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v3/merchants/{merchantId}/transactions/{merchantTransactionId}:
    get:
      summary: Get merchant transaction
      description: >
        Get a merchant transaction by ID.


        The transaction must belong to the merchant in the path. A transaction
        that exists but belongs to another merchant returns a `404` error.
      tags:
        - Merchant transactions
      operationId: get-merchant-transaction
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/merchantTransactionIdPath'
      responses:
        '200':
          $ref: '#/components/responses/200MerchantTransactionGetByIdResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/merchants/{merchantId}/transactions/{transactionId}:
    patch:
      summary: Update merchant transaction status
      description: >
        Update the status of a merchant transaction.


        You can set the status to `PENDING`, `SCHEDULED`, or `CANCELED`.
        Transactions whose current status is `SETTLED`, `WAITING_SPLIT`, or
        `SPLITTED` can't be updated, and the request returns a `400` error.
        Sending the transaction's current status also returns `400`, since there
        is nothing to change.


        You can send an optional `reason`, up to 200 characters, to explain the
        change.


        A successful update returns `204 No Content`.
      tags:
        - Merchant transactions
      operationId: patch-merchant-transaction-status
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/transactionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantTransactionPatchStatusRequest'
            examples:
              merchant-transaction-patch-status:
                $ref: '#/components/examples/MerchantTransactionPatchStatusRequest'
      responses:
        '204':
          description: Merchant transaction status updated
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v3/merchants/{merchantId}/transactions/totals:
    get:
      summary: List merchant transaction totals
      description: >
        List a merchant's aggregated transaction totals (gross, discount, and
        net amounts) for a payment-date range, grouped by `groupBy` and
        paginated. The date range is limited to one year.
      tags:
        - Transaction totals
      operationId: get-merchant-transaction-totals
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/startPaymentDateQuery'
        - $ref: '#/components/parameters/endPaymentDateQuery'
        - $ref: '#/components/parameters/groupByQuery'
        - $ref: '#/components/parameters/transactionStatusQuery'
        - $ref: '#/components/parameters/marketplaceIdQuery'
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/perPageQuery'
        - $ref: '#/components/parameters/orderQuery'
      responses:
        '200':
          $ref: '#/components/responses/200MerchantTransactionTotalsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v3/merchants/{merchantId}/transactions/summary:
    get:
      summary: Get merchant transaction summary
      description: >
        Get a merchant's aggregated transaction totals (gross, discount, and net
        amounts) as a single object for a payment-date range. The date range is
        limited to one year.
      tags:
        - Transaction totals
      operationId: get-merchant-transaction-summary
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/merchantIdPath'
        - $ref: '#/components/parameters/startPaymentDateQuery'
        - $ref: '#/components/parameters/endPaymentDateQuery'
        - $ref: '#/components/parameters/transactionStatusQuery'
        - $ref: '#/components/parameters/marketplaceIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/200MerchantTransactionSummaryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
