        external_hierarchy_id:
          $ref: '#/components/schemas/ExternalHierarchyId'
        name:
          $ref: '#/components/schemas/HierarchyName'
    HierarchyId:
      type: string
      format: uuid
      description: Pismo-generated hierarchy ID
      example: 9bb95e15-c0e6-4c84-b644-350c76a83358
    HierarchyLevel:
      type: object
      required:
        - hierarchy_level_id
        - index
      properties:
        hierarchy_level_id:
          $ref: '#/components/schemas/HierarchyLevelId'
        index:
          $ref: '#/components/schemas/HierarchyLevelIndex'
        description:
          $ref: '#/components/schemas/HierarchyLevelDescription'
        external_hierarchy_level_id:
          $ref: '#/components/schemas/ExternalHierarchyLevelId'
