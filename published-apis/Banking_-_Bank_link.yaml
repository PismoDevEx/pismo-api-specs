    patch:
      tags:
        - Deposit products
      summary: Update deposit product [beta]
      description: >
        Update a deposit product identified by an external product ID. Only the
        fields sent change, and the response is the deposit product after the
        update. You can update only `status`, `reason`, `min_amount`, `notices`
        and `accrue_during_grace_period`, and must send at least one of
        `status`, `min_amount`, `notices` and `accrue_during_grace_period`.
        Passing any other field, including `product_id`, `external_product_id`
        or `name`, returns `400`.


        On success, the Pismo platform generates a [Deposit product
        updated](https://developers.pismo.io/events/docs/deposit-product-update-1)
        event.


        Notes:


        * `status` requires `reason`.

        * `min_amount` must be greater than `0`. It applies from the update on,
        and accounts already opened aren't revalidated.

        * `notices` replaces the current notices, and an empty array removes
        them.

        * Sending the same update again succeeds.
      operationId: apex-v1-update-deposit-product
      parameters:
