    CreateProcessingCodeRequest:
      type: object
      required:
        - processing_code
        - balance_impact
        - description
        - reversal_processing_code
      properties:
        processing_code:
          type: string
          minLength: 1
          maxLength: 6
          pattern: ^[a-zA-Z0-9]+$
          description: |
            Processing code ID

            The following applies to this field:
              * It must have between 1 and 6 characters.
              * Only letters and numbers are allowed.
              * Must be unique and not already exist in the org's database
              * Cannot start with the prefix “PSM”, this is reserved for Pismo platform processing codes.
          example: I87654
        balance_impact:
          allOf:
            - $ref: '#/components/schemas/ProcessingCodeBalanceImpact'
          writeOnly: true
        description:
          $ref: '#/components/schemas/ProcessingCodePcDescription'
        reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodeReversalProcessingCode'
        reversal_description:
          $ref: '#/components/schemas/ProcessingCodeReversalDescription'
        partial_reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodePartialReversalProcessingCode'
        partial_reversal_description:
          $ref: '#/components/schemas/ProcessingCodePartialReversalDescription'
        tags:
          $ref: '#/components/schemas/ProcessingCodeTags'
        translations:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingCodeCreateTranslation'
    CreateProcessingCodeResponse:
      type: object
      required:
        - partial_reversal_processing_code
        - processing_code
        - reversal_processing_code
        - status
      properties:
        partial_reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodePartialReversalProcessingCode'
        processing_code:
          $ref: '#/components/schemas/ProcessingCode'
        reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodeReversalProcessingCode'
        status:
          $ref: '#/components/schemas/ProcessingCodeStatus'
