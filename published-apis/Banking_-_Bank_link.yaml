                  status: ACTIVE
                  reason: Product approved
      responses:
        '200':
          description: Deposit product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositProduct'
        '400':
          description: >
            * `WAPX0000`: the request breaks the spec, like an empty body or a
            field that can't be updated

            * `WAPX0020`: the Pismo platform rejected the update with a code
            Apex doesn't map yet, like none of `status`, `min_amount`, `notices`
            and `accrue_during_grace_period` sent, `status` without `reason`, a
            `min_amount` that isn't greater than `0`, or `notices` that repeat a
            `days_before_maturity`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0070`: no deposit product has the external product ID in the
            path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DepositProductUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
