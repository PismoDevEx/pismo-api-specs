openapi: 3.1.0
info:
  title: Banking - Bank link [beta]
  version: 1.0.0
  description: Bank link API
  contact:
    name: API Support
    url: https://developers.pismo.io/support/
  license:
    name: Copyright Pismo
servers:
  - url: https://sandbox.pismolabs.io
    description: Sandbox API server for testing
security:
  - BearerAuth: []
tags:
  - name: Programs
    description: >-
      Endpoints for managing programs by external program ID and their
      configurations at the program level
    x-go-package: programs
  - name: Processing codes
    description: Endpoints for managing processing codes
    x-go-package: processingcodes
  - name: Fee models
    description: Endpoints for managing fee models by external fee model ID
    x-go-package: feemodels
  - name: Hierarchies
    description: Endpoints for managing hierarchies by external hierarchy ID
    x-go-package: hierarchies
  - name: Divisions
    description: Endpoints for managing divisions
    x-go-package: divisions
  - name: Interest plans
    description: Endpoints for managing interest plans by external interest plan ID
    x-go-package: interestplans
  - name: Deposit products
    description: Endpoints for managing deposit products by external product ID
    x-go-package: depositproducts
  - name: Accounting scripts
    description: Endpoints for managing accounting scripts by external accounting script ID
    x-go-package: accountingscripts
  - name: Account - Lifecycle
    description: Endpoints for managing the account lifecycle
    x-go-package: account/lifecycle
  - name: Account - Update
    description: Endpoints used to update account details
    x-go-package: account/update
  - name: Account inquiry - Configuration
    description: Endpoints for retrieving products configuration and attachment information
    x-go-package: inquiry/configuration
  - name: Account inquiry - Usage
    description: Endpoints that provide account usage and activity insights
    x-go-package: inquiry/usage
  - name: Account - Savings-specific configuration
    description: Endpoints for managing savings account configuration
    x-go-package: account/savings
  - name: Account - Configuration
    description: Endpoints for managing account configuration settings
    x-go-package: account/configuration
  - name: Account - Deposit-specific configuration
    description: Endpoints for managing deposit account configuration
    x-go-package: account/deposit
  - name: Account inquiry - Simulation & calculation
    description: >-
      Endpoints that simulate penalties and calculate average balances for an
      account
    x-go-package: inquiry/simulation
  - name: Account - Information
    description: Endpoints for retrieving account information
    x-go-package: account/information
components:
  parameters:
    accountingScriptExternalEntryTypeIdQuery:
      name: external_entry_type_id
      in: query
      description: External entry type ID filter
      schema:
        $ref: '#/components/schemas/ExternalEntryTypeId'
      example: PSM-ENTRY-TYPE-01
    accountingScriptExternalEventTypeIdQuery:
      name: external_event_type_id
      in: query
      description: External event type ID filter
      schema:
        $ref: '#/components/schemas/ExternalEventTypeId'
      example: PSM-EVENT-TYPE-01
    accountingScriptExternalProgramIdQuery:
      name: external_program_id
      in: query
      description: External program ID filter
      schema:
        $ref: '#/components/schemas/ExternalId'
      example: PSM-PROGRAM-01
    accountingScriptsPageOffsetQuery:
      name: page_offset
      in: query
      description: >-
        Page to return, starting from `0`, so `2` returns the third page.
        Default = `0`. Maximum = `10000`.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
      example: 2
    accountingScriptsPageSizeQuery:
      name: page_size
      in: query
      description: Maximum number of items per page. Default = `10`. Maximum = `100`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    corporateCursorQuery:
      name: cursor
      in: query
      description: >-
        Cursor of the page to return, taken from the previous page's
        `pagination.cursor`. Omit it for the first page.
      schema:
        type: string
      example: eyJJRCI6IjliYjk1ZTE1LWMwZTYtNGM4NC1iNjQ0LTM1MGM3NmE4MzM1OCIsIk9yZ0lEIjoiVE4tMSJ9
    corporateLimitQuery:
      name: limit
      in: query
      description: Maximum number of items per page. Default = `10`. Maximum = `100`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    creditAccountingAccountQuery:
      name: credit_accounting_account
      in: query
      description: >-
        Credit accounting account number filter. Matches the accounting scripts
        whose `credit_accounting.account` is this value.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: 123123133-x
    cursorQuery:
      name: cursor
      in: query
      description: >-
        Cursor of the page to return, taken from the previous page's
        `next_cursor`. Omit it for the first page.
      schema:
        type: string
      example: eyJQSyI6IlROLTEjV0YwMDAxIn0=
    debitAccountingAccountQuery:
      name: debit_accounting_account
      in: query
      description: >-
        Debit accounting account number filter. Matches the accounting scripts
        whose `debit_accounting.account` is this value.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: 123123132-x
    depositProductNameQuery:
      name: name
      in: query
      description: >-
        Deposit product name filter. Matches the deposit products whose name
        contains this value, regardless of letter case.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: CD
    depositProductsAfterIdQuery:
      name: after_id
      in: query
      description: >-
        Returns the deposit products after this one, taken from the previous
        page's `last_id`. Omit it for the first page.
      schema:
        type: integer
        format: int64
      example: 1706027185000000000
    depositProductsBeginDateQuery:
      name: begin_date
      in: query
      description: >-
        Returns the deposit products created on or after this day, in UTC. It
        can be sent without `end_date`.
      schema:
        type: string
        format: date
      example: '2026-01-01'
    depositProductsEndDateQuery:
      name: end_date
      in: query
      description: >-
        Returns the deposit products created on or before this day, in UTC. It
        can be sent without `begin_date`.
      schema:
        type: string
        format: date
      example: '2026-12-31'
    depositProductsOrderQuery:
      name: order
      in: query
      description: Order by creation date and time. Default = `DESC`.
      schema:
        type: string
        enum:
          - ASC
          - DESC
      example: ASC
    depositProductsPerPageQuery:
      name: per_page
      in: query
      description: Maximum number of items per page. Default = `20`. Maximum = `100`.
      schema:
        type: integer
        format: int32
        maximum: 100
      example: 20
    depositProductStatusQuery:
      name: status
      in: query
      description: Deposit product status filter
      schema:
        $ref: '#/components/schemas/DepositProductStatus'
      example: ACTIVE
    divisionCodePath:
      name: divisionCode
      in: path
      description: Division code
      schema:
        $ref: '#/components/schemas/DivisionCode'
      required: true
      example: PSM-DIVISION-01
    divisionCodeQuery:
      name: division_code
      in: query
      description: Division code filter
      schema:
        $ref: '#/components/schemas/DivisionCode'
      example: PSM-DIVISION-01
    externalAccountIdHeader:
      name: x-external-account-id
      in: header
      description: >-
        External account ID of the transaction banking account the operation
        applies to. It is sent only in this header, never in the path, query, or
        request body.
      schema:
        type: string
        minLength: 1
        maxLength: 60
      required: true
      example: a4070788-bbe3-4127-8abc-12345
    externalAccountingScriptIdPath:
      name: externalAccountingScriptId
      in: path
      description: External accounting script ID
      schema:
        $ref: '#/components/schemas/ExternalAccountingScriptId'
      required: true
      example: PSM-ACCOUNTING-SCRIPT-01
    externalAccountingScriptIdQuery:
      name: external_accounting_script_id
      in: query
      description: External accounting script ID filter
      schema:
        $ref: '#/components/schemas/ExternalAccountingScriptId'
      example: PSM-ACCOUNTING-SCRIPT-01
    externalFeeModelIdPath:
      name: externalFeeModelId
      in: path
      description: External fee model ID
      schema:
        $ref: '#/components/schemas/ExternalFeeModelId'
      required: true
      example: PSM-FEE-MODEL-01
    externalFeeModelIdQuery:
      name: external_fee_model_id
      in: query
      description: External fee model ID filter
      schema:
        $ref: '#/components/schemas/ExternalFeeModelId'
      example: PSM-FEE-MODEL-01
    externalHierarchyIdPath:
      name: externalHierarchyId
      in: path
      description: External hierarchy ID
      schema:
        $ref: '#/components/schemas/ExternalHierarchyId'
      required: true
      example: PSM-HIERARCHY-01
    externalHierarchyIdQuery:
      name: external_hierarchy_id
      in: query
      description: External hierarchy ID filter
      schema:
        $ref: '#/components/schemas/ExternalHierarchyId'
      example: PSM-HIERARCHY-01
    externalHierarchyLevelIdQuery:
      name: external_hierarchy_level_id
      in: query
      description: External hierarchy level ID filter
      schema:
        $ref: '#/components/schemas/ExternalHierarchyLevelId'
      example: PSM-HIERARCHY-LEVEL-01
    externalInterestPlanIdPath:
      name: externalInterestPlanId
      in: path
      description: External interest plan ID
      schema:
        $ref: '#/components/schemas/ExternalInterestPlanId'
      required: true
      example: PSM-INTEREST-PLAN-01
    externalProductIdPath:
      name: externalProductId
      in: path
      description: External product ID
      schema:
        $ref: '#/components/schemas/ExternalProductId'
      required: true
      example: PSM-DEPOSIT-PRODUCT-01
    externalProductIdQuery:
      name: external_product_id
      in: query
      description: External product ID filter
      schema:
        $ref: '#/components/schemas/ExternalProductId'
      example: PSM-DEPOSIT-PRODUCT-01
    externalProgramIdPath:
      name: externalProgramId
      in: path
      description: External program ID
      schema:
        $ref: '#/components/schemas/ExternalId'
      required: true
      example: PSM-PROGRAM-01
    externalProgramIdQuery:
      name: external_program_id
      in: query
      description: External program ID filter
      schema:
        $ref: '#/components/schemas/ExternalId'
      example: PSM-PROGRAM-01
    feeModelsPerPageQuery:
      name: per_page
      in: query
      description: Maximum number of items per page. Default = `10`. Maximum = `100`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    idempotencyHeader:
      name: idempotency
      in: header
      description: |
        A unique identifier for the request. If you need to retry a request, use
        the same idempotency key to avoid creating duplicate resources.
      required: true
      example: 123e4567-e89b-12d3-a456-426614174000
      schema:
        type: string
    interestPlansPerPageQuery:
      name: per_page
      in: query
      description: Maximum number of items per page. Default = `10`. Maximum = `100`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    limitQuery:
      name: limit
      in: query
      description: Maximum number of items per page. Default = `100`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      example: 20
    pageQuery:
      name: page
      in: query
      description: Page number. Default = `1`.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 2
    perPageQuery:
      name: per_page
      in: query
      description: Maximum number of items per page. Default = `10`.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 20
    processingCodePath:
      name: processingCode
      in: path
      description: Processing code
      schema:
        $ref: '#/components/schemas/ProcessingCode'
      required: true
      example: WF0001
    processingCodeQuery:
      name: processing_code
      in: query
      description: Processing code filter
      schema:
        $ref: '#/components/schemas/ProcessingCode'
      example: WF0001
    programNameQuery:
      name: name
      in: query
      description: Program name filter
      schema:
        $ref: '#/components/schemas/ProgramName'
      example: Certificate of deposit program
    programTypeQuery:
      name: type
      in: query
      description: Program type filter
      schema:
        $ref: '#/components/schemas/ProgramType'
      example: CURRENT ACCOUNTS
    showChildrenQuery:
      name: showChildren
      in: query
      description: >-
        Should the response list up to 3 levels of descendant account IDs
        (children, grandchildren, and great-grandchildren) in the `children`
        array? Default = `false`.
      schema:
        type: boolean
      example: true
    versionDateQuery:
      name: version_date
      in: query
      description: >-
        Date of the version to return. The endpoint returns the version with the
        latest `start_date` on or before this date. Default = today (UTC).
      schema:
        type: string
        format: date
      example: '2027-01-01'
  schemas:
    Account:
      type: object
      description: Account registration information and financial data
      required:
        - acquisition_id
        - document_number
        - entity_type
        - name
        - email
        - org
        - program_name
        - program_type
        - program_id
        - status
        - collections_status
        - current_balance
        - available_withdrawal_credit
        - available_monthly_credit
        - available_total_installment_credit
        - withdrawal_credit_limit
        - monthly_credit_limit
        - total_installment_credit_limit
        - total_credit_limit
        - max_credit_limit
        - available_limit
        - blocked_amount
        - postal_address_type
        - social_name
        - exchange_mode
        - customer_id
        - external_id
        - creation_date
        - account_id
        - account_status_datetime
        - parent_account_id
        - custom_fields
      properties:
        account_id:
          type: integer
          format: int64
          description: Account ID
          example: 1001
        account_type:
          type: string
          enum:
            - PHYSICAL
            - VIRTUAL
          description: >
            Account type:

            * `PHYSICAL` — Default. Represents an actual client entity (person
            or company) and supports full operations. A parent account is always
            physical.

            * `VIRTUAL` — Always a child account, used for segmentation and
            routing. The balance lives at the parent account.
          example: PHYSICAL
        account_name:
          type: string
          minLength: 1
          maxLength: 60
          description: Account name
          example: Expenses account
        creation_date:
          type: string
          format: date
          description: Account creation date, in ISO 8601 format (`yyyy-mm-dd`)
          example: '2021-10-21'
        is_centralizer:
          type: boolean
          default: false
          description: >-
            Is this is a centralizer account, the account responsible for
            invoice billing within the account hierarchy?
          example: false
        external_id:
          type: string
          maxLength: 60
          description: >-
            Client-created ID from an external system or application.
            **REQUIRED** set for `VIRTUAL` accounts.
          example: 8c8a4dd7-e48f-4c15-85b7-9d12f401057f
        administrative_division_id:
          type: integer
          format: int64
          description: Account's administrative division ID
          example: 2856813
        customer_id:
          type: integer
          format: int64
          description: Customer ID
          example: 100211299
        parent_account_id:
          type: integer
          format: int64
          description: Parent account ID. **REQUIRED** for `VIRTUAL` accounts.
          example: 8675309
        children:
          type: array
          description: >-
            Up to 3 levels of descendant account IDs (children, grandchildren,
            and great-grandchildren), as indicated in `showChildren`.
          items:
            type: integer
            format: int64
          example:
            - 121
            - 122
            - 123
        status:
          type: string
          maxLength: 200
          description: >-
            Account status. The pre-defined statuses are `DEBIT_ONLY`, `NORMAL`,
            `BLOCKED`, and `CANCELLED`.
          example: NORMAL
        status_reason_id:
          type: integer
          format: int64
          minimum: 1
          description: ID of the reason why the account is in its current status
          example: 123
        status_reason_description:
          type: string
          maxLength: 80
          description: Description of why the account is in its current status
          example: Registration restriction
        account_status_datetime:
          type: string
          format: date-time
          description: Account status date and time
          example: '2021-10-21T18:41:26+00:00'
        program_name:
          $ref: '#/components/schemas/ProgramName'
        program_type:
          $ref: '#/components/schemas/ProgramType'
        program_id:
          $ref: '#/components/schemas/ProgramId'
        org:
          type: string
          description: Organization ID
          example: TN-34778262-f4f0-464d-b4c6-a14e2dc6f4be
        entity_type:
          type: string
          enum:
            - INDIVIDUAL
            - COMPANY
          maxLength: 10
          description: Entity type
          example: INDIVIDUAL
        name:
          type: string
          description: Person or company name
          example: Hyman Roth
        social_name:
          type: string
          maxLength: 64
          description: Social name
          example: Jack
        email:
          type: string
          format: email
          maxLength: 100
          description: Email address
          example: jenna.flect@email.com
        document_number:
          type: string
          maxLength: 15
          description: Document number, such as a government tax ID
          example: '31457828046'
        postal_address_type:
          type: integer
          format: int64
          description: ID of the mailing address registered for this account
          example: 1
        acquisition_id:
          type: integer
          format: int64
          minimum: 1
          description: ID of the application form that originated the account
          example: 1234
        currency_numeric_code:
          $ref: '#/components/schemas/CurrencyNumericCode'
        collections_status:
          type: string
          enum:
            - NORMAL
            - OVERDUE
          description: Account's financial status for credit programs
          example: NORMAL
        open_due_date:
          type: string
          format: date
          description: Due date of the currently open statement, in `yyyy-mm-dd` format
          example: '2022-07-03'
        current_cicle:
          type: integer
          format: int32
          description: >-
            Current statement cycle. Cycles are numbered sequentially, starting
            at `1` when the account is opened.
          example: 3
        current_balance:
          type: number
          format: double
          description: Current balance = previous balance + credits - debits
          example: 100.43
        available_withdrawal_credit:
          type: number
          format: double
          description: Amount available for withdrawal in credit programs
          example: 100.43
        available_monthly_credit:
          type: number
          format: double
          deprecated: true
          description: >-
            Monthly amount available in credit programs. This field is
            **DEPRECATED**.
          example: 100.43
        available_total_installment_credit:
          type: number
          format: double
          description: Amount available for installments in credit programs
          example: 100.43
        withdrawal_credit_limit:
          type: number
          format: double
          description: Amount limit for withdrawal in credit programs
          example: 100.43
        monthly_credit_limit:
          type: number
          format: double
          deprecated: true
          description: >-
            Monthly credit limit for credit programs. This field is
            **DEPRECATED**.
          example: 100.43
        total_installment_credit_limit:
          type: number
          format: double
          description: Amount limit for installments in credit programs
          example: 100.43
        total_credit_limit:
          type: number
          format: double
          description: User-set total credit limit, up to `max_credit_limit`
          example: 100.43
        max_credit_limit:
          type: number
          format: double
          description: Maximum credit amount approved for this account
          example: 100.43
        available_limit:
          type: number
          format: double
          description: Amount available for this account
          example: 100.43
        blocked_amount:
          type: number
          format: double
          description: Amount blocked in this account
          example: 100.43
        exchange_mode:
          type: string
          enum:
            - SAME_DAY
            - CLOSING
          description: >
            When the exchange rate is charged for a foreign transaction. Valid
            for credit programs only.

            * `SAME_DAY` — Day the transaction occurred

            * `CLOSING` — Statement closing date
          example: SAME_DAY
        program_due_date_id:
          type: integer
          format: int64
          description: Program due date ID
          example: 1234
        custom_fields:
          type: string
          description: Key/value field for custom information, limited to 1014 bytes
          example: '{"field_01": "value01", "field_02": "value02"}'
    AccountAttachment:
      type: object
      properties:
        accrual_model:
          type: string
          description: Accrual model inherited from the attached product
          enum:
            - DEPOSIT_BASIS
            - BALANCE_BASIS
          default: DEPOSIT_BASIS
          example: DEPOSIT_BASIS
        attached_datetime:
          type: string
          format: date-time
          description: Date and time the attachment was requested, in RFC 3339 format
          example: '2024-01-23T13:26:25.000Z'
        balance_type:
          type: string
          description: >-
            Balance type inherited from the attached product. Only meaningful
            when accrual_model is `BALANCE_BASIS`.
          enum:
            - VALUE_DATED_BALANCE
            - LEDGER_BALANCE
          default: VALUE_DATED_BALANCE
          example: VALUE_DATED_BALANCE
        effective_date:
          type: string
          format: date
          description: Effective date of the attachment, in `YYYY-MM-DD` format
          example: '2025-12-15'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        external_fee_model_id:
          allOf:
            - $ref: '#/components/schemas/ExternalFeeModelId'
          description: >-
            External fee model ID, if a fee model applies. Omitted when the fee
            model was created outside of the bank link workflow.
        external_interest_plan_id:
          allOf:
            - $ref: '#/components/schemas/ExternalInterestPlanId'
          description: >-
            External interest plan ID of the product's interest plan. Omitted
            when the interest plan was created outside of the bank link
            workflow.
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: >-
            External product ID of the attached deposit product. Omitted for
            savings products and for deposit products created outside of the
            bank link workflow.
        fee_model_id:
          type: string
          description: Fee model identifier, if applicable
          example: fee-model-123
        interest_capitalization_mode:
          type: string
          enum:
            - PAYOUT
            - REINVEST
          description: >-
            Present only when this account attachment explicitly defines
            `interest_capitalization_mode`. When missing, the effective value is
            `REINVEST`.
          example: REINVEST
        interest_plan_id:
          type: string
          description: Interest rate plan ID
          example: 263d509a-d5d0-4b3a-b909-ce1b9174beff
        maturity_period:
          $ref: '#/components/schemas/DepositMaturityPeriod'
        overrides:
          allOf:
            - $ref: '#/components/schemas/DepositAttachmentOverridesSnapshot'
          description: >-
            Optional. Only returned when at least one override is configured for
            the attachment.
        payout_account:
          $ref: '#/components/schemas/PayoutAccount'
        product_id:
          type: string
          description: Product ID
          example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
        product_type:
          type: string
          description: Product type
          enum:
            - deposit
            - savings-account
          example: deposit
    AccountInfo:
      type: object
      description: Transaction banking account information
      required:
        - account_id
        - account_creation_datetime
        - division_code
        - division_id
        - program_id
        - future_dated_credits_balance
        - future_dated_debits_balance
      properties:
        account_id:
          type: integer
          format: int64
          minimum: 1
          description: Account ID
          example: 102778
        account_creation_datetime:
          type: string
          format: date-time
          description: Date and time the account was created in the Pismo platform
          example: '2024-02-22T16:51:49+00:00'
        division_code:
          type: string
          maxLength: 36
          description: >-
            Client-provided code that identifies the division within the
            organization. Contains only letters, numbers, and hyphens.
          example: US
        division_id:
          type: string
          format: uuid
          description: Division ID generated by the Pismo platform. It cannot be changed.
          example: 6f8a456a-8b1a-4022-a2f8-7612595330b5
        program_id:
          $ref: '#/components/schemas/ProgramId'
        future_dated_credits_balance:
          type: number
          format: double
          description: >-
            Balance scheduled to settle on a future date, after the original
            posting date. The account's `book_balance` is credited when the
            settlement occurs. Always a positive value.
          example: 70
        future_dated_debits_balance:
          type: number
          format: double
          description: >-
            Balance scheduled to settle on a future date, after the original
            posting date. The account's `book_balance` is debited when the
            settlement occurs. Always a positive value.
          example: 70
        parent_account_id:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Parent account ID. The account retrieved is a child of this account,
            which can be in another program or division.
          example: 123
        available_balance:
          type: number
          format: double
          description: >-
            Available balance, calculated as `credit_balance` - `debit_balance`
            + `overdraft_limit`.
          example: 123.45
        earmarked_balance:
          type: number
          format: double
          minimum: 0
          description: >-
            Earmark balance. Initially equal to the earmarked amount, it
            decreases as the reserved funds are used up or decreased, and
            increases with an increase operation.
          example: 123.45
        overdraft_limit:
          type: number
          format: double
          minimum: 0
          description: Account overdraft limit.
          example: 123.45
        ledger_balance:
          type: number
          format: double
          description: Ledger balance, calculated as `book_balance` + `uncleared_funds`.
          example: 270.35
        book_balance:
          type: number
          format: double
          description: >-
            Book balance, calculated as `credit_balance` - `debit_balance` +
            `earmarked_balance`.
          example: 146.9
        value_dated_balance:
          type: number
          format: double
          description: >-
            Credit or debit balance recalculated based on the back value date.
            Defaults to the book balance.
          example: 123.45
        uncleared_funds:
          type: number
          format: double
          description: Uncleared funds amount.
          example: 123.45
        uncleared_checks_balance:
          type: number
          format: double
          description: >-
            Total value of the checks posted to the account that have not
            cleared yet.
          example: 0
        restricted_funds:
          type: number
          format: double
          minimum: 0
          description: >-
            Portion of the balance held under regulatory or operational
            restrictions and not available for transactions.
          example: 0
        legal_holds:
          type: number
          format: double
          minimum: 0
          description: >-
            Portion of the balance held under legal holds, such as court-ordered
            restrictions, and not available for transactions.
          example: 0
        held_funds:
          type: number
          format: double
          minimum: 0
          description: >-
            Total earmarked or otherwise restricted balance, temporarily
            unavailable for transactions due to regulatory or operational
            requirements.
          example: 0
        held_checks_balance:
          type: number
          format: double
          minimum: 0
          description: >-
            Balance from checks that the bank considers available but holds to
            earn interest. It increases when check holds are applied and
            decreases when they are released or canceled.
          example: 0
        remunerative_interest_accrued:
          type: number
          format: double
          minimum: 0
          description: >-
            Total interest pending capitalization. It increases as interest
            accrues and decreases when the accrued interest is added to the
            principal balance.
          example: 1.23
        children:
          type: array
          description: Child account IDs.
          items:
            type: integer
            format: int64
            minimum: 1
          example:
            - 10983
        status:
          type: string
          minLength: 1
          maxLength: 200
          description: Account status.
          example: DORMANT
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        currency_numeric_code:
          $ref: '#/components/schemas/CurrencyNumericCode'
        currency_alphabetic_code:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) alphabetic
            currency code.
          example: USD
        document_number:
          type: string
          minLength: 1
          maxLength: 15
          description: Entity's government document number.
          example: '1122334455'
        status_reason_id:
          type: integer
          format: int64
          minimum: 1
          description: Account status reason ID.
          example: 1438
        status_reason_description:
          type: string
          minLength: 1
          maxLength: 500
          description: Account status reason description.
          example: Credit only
        reason_external_id:
          type: string
          minLength: 1
          maxLength: 120
          description: External reason ID specifying account restrictions.
          example: CREDIT_ONLY
    AccountingScript:
      type: object
      description: >-
        External IDs are omitted for what was created outside of the bank link
        workflow: the accounting script, its program, event type, entry type or
        accounting accounts.
      required:
        - accounting_script_id
        - program_id
        - event_type_id
        - entry_type_id
        - entry_name
        - debit_accounting
        - credit_accounting
      properties:
        accounting_script_id:
          $ref: '#/components/schemas/AccountingScriptId'
        credit_accounting:
          $ref: '#/components/schemas/AccountingScriptAccountingAccount'
        debit_accounting:
          $ref: '#/components/schemas/AccountingScriptAccountingAccount'
        entry_name:
          type: string
          description: >-
            Amount of the event that the accounting script posts, one of the
            `AccountingScriptEntryName` values. Accounting scripts created with
            version 2 of the accounting API have `NEW_FLOW`.
          example: AMOUNT
        entry_type_id:
          type: integer
          format: int64
          description: Pismo ID of the entry type
          example: 101
        event_type_id:
          type: integer
          format: int64
          description: Pismo ID of the event type
          example: 1
        program_id:
          $ref: '#/components/schemas/ProgramId'
        cost_center:
          $ref: '#/components/schemas/AccountingScriptCostCenter'
        external_accounting_script_id:
          $ref: '#/components/schemas/ExternalAccountingScriptId'
        external_entry_type_id:
          $ref: '#/components/schemas/ExternalEntryTypeId'
        external_event_type_id:
          $ref: '#/components/schemas/ExternalEventTypeId'
        external_program_id:
          $ref: '#/components/schemas/ExternalId'
        processing_code:
          type: string
          maxLength: 6
          description: >-
            Processing code. Omitted if the accounting script isn't based on a
            processing code.
          example: '009797'
    AccountingScriptAccountingAccount:
      type: object
      properties:
        account:
          type: string
          maxLength: 50
          description: >-
            Number of the accounting account in the organization's chart of
            accounts, the account the accounting entries post to
          example: 123123132-x
        created_datetime:
          type: string
          format: date-time
          description: Date and time the accounting account was created, in RFC 3339 format
          example: '2026-11-13T10:10:00+00:00'
        deactivated_datetime:
          type: string
          format: date-time
          description: >-
            Date and time the accounting account was deactivated, in RFC 3339
            format. Omitted if it's active.
          example: '2026-11-14T10:10:00+00:00'
        description:
          type: string
          maxLength: 100
          description: Description of the accounting account
          example: SAMPLE DEBIT ACCOUNT
        external_accounting_account_id:
          $ref: '#/components/schemas/ExternalAccountingAccountId'
        external_program_id:
          $ref: '#/components/schemas/ExternalId'
        id:
          type: integer
          format: int64
          description: Pismo ID of the accounting account
          example: 1001
        program_id:
          type: integer
          format: int64
          description: Pismo ID of the accounting account's program
          example: 12345
    AccountingScriptCostCenter:
      type: object
      description: Cost centers of the debit and credit accounting accounts
      properties:
        debit_org:
          type: string
          maxLength: 50
          description: Number of your Org’s debit accounting account
        credit_org:
          type: string
          maxLength: 50
          description: Number of your Org’s credit accounting account
        debit_cost:
          type: string
          maxLength: 50
          description: Number of the cost center of the debit accounting account
        credit_cost:
          type: string
          maxLength: 50
          description: Number of the cost center of the credit accounting account
    AccountingScriptEntryName:
      type: string
      description: >-
        Amount of the event that the accounting script posts. Default =
        `AMOUNT`. For what each value posts, see the [Accounting
        script](doc:create-an-accounting-script) guide.
      enum:
        - AMOUNT
        - AMOUNT_DUE_DATE
        - INTEREST
        - IOF
        - DAILY_INTEREST
        - AMOUNT_ADVANCEMENT_SHIFT
        - AMOUNT_ADVANCEMENT_SHIFT_DUE_DATE
        - INTEREST_DUE_DATE
        - AMOUNT_CANCELMENT_ANTICIPATION
        - AMOUNT_DUE_DATE_CANCELMENT
        - AMOUNT_ADVANCEMENT
        - INTEREST_ADVANCEMENT
        - AMOUNT_ADVANCEMENT_DUE_DATE
        - INTEREST_ADVANCEMENT_DUE_DATE
        - OVERDUE
        - IOF_DUE_DATE
        - INTEREST_NOT_APPROPRIATED
        - AMOUNT_CLEARING
        - AMOUNT_IOF_INTEREST
        - AMOUNT_INTEREST
        - AMOUNT_PURCHASE_POSTPONEMENT
        - AMOUNT_ADVANCEMENT_SHIFT_CANCELMENT
        - AMOUNT_MIGRATION
        - AMOUNT_INTEREST_DUE_DATE
        - AMOUNT_INTEREST_IOF
        - AMOUNT_INTEREST_IOF_DUE_DATE
        - INTEREST_ADVANCEMENT_SHIFT
        - INTEREST_ADVANCEMENT_SHIFT_DUE_DATE
        - AMOUNT_CLEARING_WITHOUT_MATCH
        - AMOUNT_INTEREST_ADVANCEMENT
        - AMOUNT_INTEREST_ADVANCEMENT_DUE_DATE
        - INTEREST_REVERSAL_NOT_APPROPRIATED_CURRENT_STATEMENT
        - FINE
        - INTEREST_PARTIAL
        - AMOUNT_PRINCIPAL
        - AMOUNT_DUE_DATE_IN_OVERDUE
      default: AMOUNT
      example: AMOUNT
    AccountingScriptId:
      type: integer
      format: int64
      description: Pismo-generated accounting script ID
      example: 393028
    AccountingScriptPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of accounting scripts on the current page
          items:
            $ref: '#/components/schemas/AccountingScript'
        has_next:
          type: boolean
          description: Is there a next page?
          example: false
    AttachProgramFeeModelRequest:
      type: object
      required:
        - external_fee_model_id
      properties:
        external_fee_model_id:
          $ref: '#/components/schemas/ExternalFeeModelId'
    CalculateAverageBalanceRequest:
      type: object
      properties:
        begin_date_datetime:
          type: string
          format: date-time
          description: >
            The specified datetime when the average balance calculation begins.
            The datetime is displayed in the RFC 3339 format; for example:
            `2024-01-28T10:33:01Z`.
          example: '2024-01-28T10:33:01.000Z'
        end_date_datetime:
          type: string
          format: date-time
          description: >
            The specified datetime when the average balance calculation ends.
            The datetime is displayed in the RFC 3339 format; for example:
            `2024-01-29T10:33:01Z`.
          example: '2024-01-30T10:33:01.000Z'
        balance_types_to_calculate:
          type: array
          items:
            type: string
            enum:
              - available
              - savings
              - held_funds
          description: >
            Choose a balance to calculate its average balance, you can select
            multiple balance types to calculate their average balances
            simultaneously. The balance types are:<br>

            * `available`

            * `savings`

            * `held_funds`
          example:
            - available
            - savings
            - held_funds
    CalculateAverageBalanceResponse:
      type: object
      properties:
        external_account_id:
          type: string
          description: External account ID resolved from the account context.
          example: ext-acct-001
        idempotency_key:
          type: string
          description: Idempotency key.
          example: 123e4567-e89b-12d3-a456-xyz
        status:
          type: string
          description: Status of the average balance calculation request.
          enum:
            - PROCESSING
            - COMPLETE
        message:
          type: string
          description: Message.
          example: Request is under progress
    CorporatePagination:
      type: object
