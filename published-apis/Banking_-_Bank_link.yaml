                - BALANCE_BASIS
              default: DEPOSIT_BASIS
              example: DEPOSIT_BASIS
            balance_type:
              type: string
              description: >-
                Balance type inherited from the attached product. Only
                meaningful when `accrual_model` is `BALANCE_BASIS`.
              enum:
                - VALUE_DATED_BALANCE
                - LEDGER_BALANCE
              default: VALUE_DATED_BALANCE
              example: VALUE_DATED_BALANCE
            interest_capitalization_mode:
              type: string
              enum:
                - PAYOUT
                - REINVEST
              description: >
                Present only when the request included
                `interest_capitalization_mode`. Reflects the value stored on the
                attachment.
              example: REINVEST
            maturity_period:
              $ref: '#/components/schemas/DepositMaturityPeriod'
            overrides:
              $ref: '#/components/schemas/DepositAttachmentOverridesSnapshot'
        effective_date:
          type: string
          format: date
          description: >
            The effective value date of the attachment. Format is `YYYY-MM-DD`.

            This is the date when the attachment becomes valid. Maturity is
            calculated from this date.
          example: '2025-12-15'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: External product ID of the attached deposit product
        product_id:
          type: string
          description: Product ID
          example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
    DepositAttachmentOverridesRequest:
      type: object
      description: >
        Per-attachment overrides applied on top of the product defaults. All
        sub-fields are optional.

        This object contains the per‑attachment overrides that supplement the
        product defaults. All sub‑fields are optional. Omitting a section causes
        the Pismo platform to follow the normal fallback sequence, moving from
        the account level to the program and then to the product defaults. Each
        penalty type provides waived as a required field, optional type‑specific
        fields, and an optional `valid_until_datetime` used by Amazon
        EventBridge to schedule the revert.
      properties:
        maturity_instructions:
          $ref: '#/components/schemas/DepositMaturityInstructionsOverrideRequest'
        renewal_term:
          $ref: '#/components/schemas/DepositRenewalTermOverrideRequest'
        penalties:
          $ref: '#/components/schemas/DepositPenaltiesOverrideRequest'
    DepositAttachmentOverridesSnapshot:
      type: object
      description: >
        Representation of the persisted overrides, present only when the request
        defined at least one override. Sub-fields are included only when set.
        The `renewal_term` retains the structure provided by the client
        (calendar form or `unit`+`value`), mirroring the behavior of
        `maturity_period`.
      properties:
        maturity_instructions:
          $ref: '#/components/schemas/DepositMaturityInstructionsOverrideRequest'
        renewal_term:
          $ref: '#/components/schemas/DepositRenewalTermResponse'
        penalties:
          $ref: '#/components/schemas/DepositPenaltiesOverrideSnapshot'
    DepositAttachRequest:
      type: object
      required:
        - external_product_id
      properties:
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: External product ID of the deposit product to attach
        deposit_configs:
          $ref: '#/components/schemas/DepositConfigs'
        effective_date:
          type: string
          format: date
          description: >
            Backdated effective date for the attachment in `YYYY-MM-DD` format.
            This is the date starting from which the attachment is considered
            valid.

            - If omitted, it defaults to the current date

            - Must be less than or equal to the current date (cannot be in the
            future)

            - Cannot be more than `ATTACHMENT_MAX_BACKDATING_DAYS` (default: 90
            days) in the past

            - Maturity date is calculated from this date, not from the date when
            you call the API.

            - No retroactive interest accrual, capitalization, or postings are
            triggered
          example: '2025-12-15'
        metadata:
          type: object
          description: >
            The metadata object contains user-defined key-value pairs that
            provide additional context or custom information.<br>

            The platform has no control over its content, but rather controlled
            by the user.<br>


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only. For sensitive data, use
            the specific parameters designed for that purpose. For more
            information, refer to [Get started with Pismo
            APIs](ref:get-started-with-pismo-apis#metadata).
          example:
            key: value
    DepositCalendarMaturityDate:
      type: string
      format: date
      description: >
        Maturity date. Format is `YYYY-MM-DD`. The date must be a future date.


        This date cannot coincide with `unit`/`value`, sending both in the same
        request returns a `400` validation error.
      example: '2027-06-15'
    DepositConfigs:
      type: object
      properties:
        maturity_period:
          $ref: '#/components/schemas/DepositMaturityPeriod'
        payout_account:
          $ref: '#/components/schemas/PayoutAccount'
        overrides:
          $ref: '#/components/schemas/DepositAttachmentOverridesRequest'
    DepositDetachRequest:
      type: object
      required:
        - external_product_id
      properties:
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: External product ID of the deposit product to detach
        metadata:
          type: object
          description: >
            The metadata object contains user-defined key-value pairs that offer
            additional context or custom information.<br>

            The platform has no control over its content, but rather controlled
            by the user.<br>


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only. For sensitive data, use
            the specific parameters designed for that purpose. For more
            information, refer to [Get started with Pismo
            APIs](ref:get-started-with-pismo-apis#metadata).
          example:
            key: value
    DepositEarlyWithdrawalAfterOpeningOverrideRequest:
      type: object
      description: Override for early withdrawal after account opening.
      required:
        - waived
      properties:
        waived:
          type: boolean
        applicable_within_days:
          type: integer
          format: int32
          minimum: 0
        penalty_interest_days:
          type: integer
          format: int32
          minimum: 0
        valid_until_datetime:
          type: string
          format: date-time
    DepositGracePeriodOverrideRequest:
      type: object
      description: >-
        Grace period override. Type-specific fields are optional pointers, when
        omitted, the Pismo platform follows the normal fallback sequence, moving
        from the account level to the program and then to the product defaults.
      required:
        - waived
      properties:
        waived:
          type: boolean
          description: >-
            `true` = fully exempt; `false` = penalty active (customize via the
            fields below).
        duration_days:
          type: integer
          format: int32
          minimum: 0
        penalty_interest_days:
          type: integer
          format: int32
          minimum: 0
        valid_until_datetime:
          type: string
          format: date-time
          description: >-
            Schedules the revert of this override via EventBridge. This value
            must be a future date and follows the ISO 8601 standard.
    DepositMaturityInstructionsOverrideRequest:
      type: object
      description: >-
        Overrides the deposit’s behavior at maturity. If a field is omitted, the
        Pismo platform uses the value defined at the higher‑level configuration
        that governs this deposit.
      properties:
        principal:
          type: string
          enum:
            - ROLLOVER
            - PAY
          description: Specifies how the principal is handled once the deposit matures.
          example: ROLLOVER
        interest:
          type: string
          enum:
            - ROLLOVER
            - PAY
          description: Specifies how the interest is handled once the deposit matures.
          example: PAY
        reason:
          type: string
          maxLength: 100
          description: Optional audit-trail reason.
          example: Customer preference at onboarding
    DepositMaturityPeriod:
      type: object
      description: >
        Defines when the deposit matures. There are three usage modes:


        * **Relative period**: Sends `unit` + `value` (e.g. `MONTHS` + `6`).

        * **Explicit date**: Sends `calendar_maturity_date` (e.g. `2027-06-15`).

        * **Default**: Omits the field or sends `{}`. The product's configured
        default maturity term (`PRODUCT_DEFAULT_MATURITY_DATE_DAYS`, typically
        `10950` days ≈ 30 years) is applied.


        **NOTE**: `calendar_maturity_date` and `unit`/`value` are mutually
        exclusive, sending both in the same request returns a `400` validation
        error.


        The response returns exactly what was sent in the request:

        * Send `unit` + `value` returns `unit` + `value`

        * Send `calendar_maturity_date` returns `calendar_maturity_date`

        * Send nothing (default fallback applied) returns `unit=DAYS` and
        `value` equal to the product's configured
        `PRODUCT_DEFAULT_MATURITY_DATE_DAYS`
      properties:
        unit:
          $ref: '#/components/schemas/DepositMaturityPeriodUnit'
        value:
          $ref: '#/components/schemas/DepositMaturityPeriodValue'
        calendar_maturity_date:
          $ref: '#/components/schemas/DepositCalendarMaturityDate'
    DepositMaturityPeriodUnit:
      type: string
      description: >
        Time unit for the relative maturity period. It's used together with
        `value` and cannot coincide with `calendar_maturity_date`.


        - `DAYS`: Uses `value` directly. Example: `value=90` → 90 days.

        - `WEEKS`: Multiplies `value` by 7. Example: `value=4` → 28 days.

        - `MONTHS`: Calculates calendar-month with end-of-month (EOM) clamping
        when the target day does not exist. Example: `2024-01-31` + 1 month =
        `2024-02-29` (leap year) or `2025-02-28` (non-leap year).

        - `YEARS`: Calculates calendar-year, for example: `2024-02-29` + 1 year
        = `2025-02-28`. Note that there is no Feb 29 in 2025.


        For `WEEKS`, `MONTHS`, and `YEARS`, the resulting calendar date is
        converted back to a day count to validate against the product's
        configured minimum or maximum term.
      enum:
        - DAYS
        - WEEKS
        - MONTHS
        - YEARS
      example: MONTHS
    DepositMaturityPeriodValue:
      type: integer
      format: int32
      description: >-
        Number of time units until maturity. Must be greater than `0`. Mutually
        exclusive with `calendar_maturity_date`.
      minimum: 1
      example: 6
    DepositPenaltiesOverrideRequest:
      type: object
      description: >
        Per-type penalty overrides. Each type independently uses three-state
        semantics:

        omit (inherit) · `{waived: true}` (exempt) · `{waived: false, <fields>}`
        (customize).
      properties:
        reason:
          type: string
          maxLength: 100
          description: Optional audit-trail reason for the entire penalties block.
          example: Q4 2026 VIP retention package
        grace_period:
          $ref: '#/components/schemas/DepositGracePeriodOverrideRequest'
        early_withdrawal_after_opening:
          $ref: '#/components/schemas/DepositEarlyWithdrawalAfterOpeningOverrideRequest'
        withdrawal_fee:
          $ref: '#/components/schemas/DepositWithdrawalFeeOverrideRequest'
        tiered_interest_forfeiture:
          $ref: '#/components/schemas/DepositTieredInterestForfeitureOverrideRequest'
        subsequent_withdrawals:
          $ref: '#/components/schemas/DepositSubsequentWithdrawalsOverrideRequest'
    DepositPenaltiesOverrideSnapshot:
      type: object
      description: >
        Persisted penalty overrides for each type. Types appear only when set.
        Each entry includes `waived`, the relevant type-specific fields, and an
        optional `valid_until_datetime` for scheduling the revert.
      properties:
        reason:
          type: string
          example: Q4 2026 VIP retention package
        grace_period:
          $ref: '#/components/schemas/DepositGracePeriodOverrideRequest'
        early_withdrawal_after_opening:
          $ref: '#/components/schemas/DepositEarlyWithdrawalAfterOpeningOverrideRequest'
        withdrawal_fee:
          $ref: '#/components/schemas/DepositWithdrawalFeeOverrideRequest'
        tiered_interest_forfeiture:
          $ref: '#/components/schemas/DepositTieredInterestForfeitureOverrideRequest'
        subsequent_withdrawals:
          $ref: '#/components/schemas/DepositSubsequentWithdrawalsOverrideRequest'
    DepositPenaltyBreakdown:
      type: object
      description: >-
        Breakdown of the total penalty amount by calculation type. Omitted when
        no penalty applies.
      properties:
        fixed_amount:
          type: number
          format: double
          description: The sum of all fixed-amount penalties
          example: 50
        percentage_amount:
          type: number
          format: double
          description: The sum of all percentage-based penalties
          example: 75.5
    DepositPenaltyRuleApplied:
      type: object
      description: A single penalty rule applied during a simulated withdrawal
      properties:
        type:
          type: string
          enum:
            - PERCENTAGE
            - FIXED
          description: >
            The penalty calculation type.

            - `PERCENTAGE`: The penalty calculated as a percentage of the
            withdrawal amount

            - `FIXED`: The penalty is a fixed amount
          example: PERCENTAGE
        value:
          type: number
          format: double
          description: >
            The penalty value. For `PERCENTAGE`, this represents the percentage
            rate. For example, `2.5` = 2.5%. For `FIXED`, this is the absolute
            amount in the account's currency.
          example: 2.5
        description:
          type: string
          description: Describes the penalty rule that triggers the penalty
          example: Early withdrawal after opening penalty
    DepositProduct:
      type: object
      description: >-
        `external_product_id` is omitted for deposit products created outside of
        the bank link workflow, and `external_interest_plan_id` for interest
        plans created outside of it.
      required:
        - product_id
      properties:
        product_id:
          $ref: '#/components/schemas/ProductId'
        accrual_model:
          $ref: '#/components/schemas/DepositProductAccrualModel'
        accrue_during_grace_period:
          $ref: '#/components/schemas/DepositProductAccrueDuringGracePeriod'
        balance_type:
          $ref: '#/components/schemas/DepositProductBalanceType'
        cool_off_period:
          $ref: '#/components/schemas/DepositProductCoolOffPeriod'
        created_datetime:
          type: string
          format: date-time
          description: Date and time the deposit product was created, in RFC 3339 format
          example: '2026-11-13T13:26:25+00:00'
        end_date:
          $ref: '#/components/schemas/DepositProductEndDate'
        external_interest_plan_id:
          $ref: '#/components/schemas/ExternalInterestPlanId'
        external_product_id:
          $ref: '#/components/schemas/ExternalProductId'
        funding_duration:
          $ref: '#/components/schemas/DepositProductFundingDuration'
        grace_period_duration_days:
          $ref: '#/components/schemas/DepositProductGracePeriodDurationDays'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        maturity_instructions:
          $ref: '#/components/schemas/DepositProductDepositMaturityInstructions'
        max_amount:
          $ref: '#/components/schemas/DepositProductMaxAmount'
        max_term:
          $ref: '#/components/schemas/DepositProductMaxTerm'
        metadata:
          $ref: '#/components/schemas/DepositProductMetadata'
        min_amount:
          $ref: '#/components/schemas/DepositProductMinAmount'
        min_term:
          $ref: '#/components/schemas/DepositProductMinTerm'
        name:
          $ref: '#/components/schemas/DepositProductName'
        notices:
          $ref: '#/components/schemas/DepositProductNotices'
        penalties:
          $ref: '#/components/schemas/DepositProductDepositPenalties'
        processing_codes:
          $ref: '#/components/schemas/DepositProductDepositProcessingCodes'
        start_date:
          $ref: '#/components/schemas/DepositProductStartDate'
        status:
          $ref: '#/components/schemas/DepositProductStatus'
        term_type:
          $ref: '#/components/schemas/DepositProductTermType'
        updated_datetime:
          type: string
          format: date-time
          description: >-
            Date and time the deposit product was last updated, in RFC 3339
            format. Omitted if it was never updated.
          example: '2026-11-14T09:00:00+00:00'
    DepositProductAccrualModel:
      type: string
      description: >
        Balance that interest accrues on each day:

        * `DEPOSIT_BASIS` — the net balance change of the day (credits minus
        debits)

        * `BALANCE_BASIS` — the closing balance of the day, even when no
        transactions occurred


        On create, omit it to derive it from the `interest_base_model` of the
        interest plan: `BALANCE_CHANGE` gives `DEPOSIT_BASIS`, and
        `CLOSING_BALANCE` gives `BALANCE_BASIS`. An interest plan without
        `interest_base_model` is treated as `CLOSING_BALANCE`. A value that
        doesn't match the interest plan returns `400` with the code `WAPX0072`.
      enum:
        - DEPOSIT_BASIS
        - BALANCE_BASIS
      example: BALANCE_BASIS
    DepositProductAccrueDuringGracePeriod:
      type: boolean
      description: >-
        Does interest accrue daily during the grace period after maturity? It
        doesn't change the grace period itself. Default = `true`.
      example: true
    DepositProductBalanceType:
      type: string
      description: >
        Balance that interest accrues on when `accrual_model` is
        `BALANCE_BASIS`:

        * `VALUE_DATED_BALANCE` — the cleared balance

        * `LEDGER_BALANCE` — the balance including uncleared funds


        Default = `VALUE_DATED_BALANCE`.
      enum:
        - VALUE_DATED_BALANCE
        - LEDGER_BALANCE
      example: VALUE_DATED_BALANCE
    DepositProductCoolOffPeriod:
      type: integer
      format: int64
      description: Period, in days, during which a withdrawal can be made without penalty
      example: 0
    DepositProductDepositMaturityInstructions:
      properties:
        principal:
          type: string
          description: >
            Specifies the status of the principal amount at maturity.

            - `PAY`: The principal amount is paid to the payout account. If no
            payout account is configured, it remains in the account

            - `ROLLOVER`: The principal amount is rolled over to a new deposit
            term


            If no value is selected, the principal defaults to `PAY`.
          example: ROLLOVER
          enum:
            - PAY
            - ROLLOVER
          default: PAY
        interest:
          type: string
          description: >
            Specifies the status of the accrued interest at maturity.

            - `PAY`: The accrued interest is paid to the account

            - `ROLLOVER`: The accrued interest is rolled over and added to the
            principal


            If no value is selected, the interest defaults to `PAY`.
          example: PAY
          enum:
            - PAY
            - ROLLOVER
          default: PAY
      type: object
      description: >
        - If the principal or interest are `ROLLOVER,` the respective amounts is
        rolled over to a new deposit term.

        - If the principal is `PAY`, the principal amount is paid to the payout
        account at maturity. If no payout account is configured, it remains in
        the account.

        - If the interest is `PAY` and the accrued interest is greater than
        zero, it's paid to the account's cash balance.
    DepositProductDepositPenalties:
      type: object
      description: >
        Set of penalty configurations that can be applied to a deposit product.
        Each penalty type corresponds to a specific fee ID and transaction flow
        within the Pismo platform.

        For details about penalty types, refer to the [Penalty
        types](doc:penalties-for-cd-accounts#penalty-types) section of Penalties
        for CD accounts.
      properties:
        early_withdrawal_after_opening:
          $ref: '#/components/schemas/DepositProductEarlyWithdrawalAfterOpening'
        grace_period:
          $ref: '#/components/schemas/DepositProductGracePeriod'
        tiered_interest_forfeiture:
          description: >-
            This penalty corresponds to fee ID
            `tieredInterestForfeiturePenaltyID` and transaction flow
            `tieredInterestForfeiturePenalty`
          type: array
          items:
            $ref: '#/components/schemas/DepositProductTieredInterestForfeitureTier'
        withdrawal_fee:
          $ref: '#/components/schemas/DepositProductWithdrawalFee'
        subsequent_withdrawals:
          $ref: '#/components/schemas/DepositProductSubsequentWithdrawals'
    DepositProductDepositProcessingCodes:
      type: object
      properties:
        interest_processing_code:
          type: string
          description: >-
            Processing code for interest calculation. <br> If you don't specify
            a value, the default is `009797`.
          example: '009797'
        detach_processing_code:
          type: string
          description: >
            Processing code for detaching deposit feature from a bank
            account.<br>

            Detaching means the bank removes the deposit feature from the bank
            account.

            If you don't specify a value, the default is `009696`.
          example: '009696'
    DepositProductEarlyWithdrawalAfterOpening:
      description: >-
        This penalty corresponds to fee ID
        `earlyWithdrawalAfterOpeningPenaltyID` and transaction flow
        `earlyWithdrawalAfterOpeningPenalty`
      type: object
      required:
        - applicable_within_days
        - penalty_interest_days
      properties:
        applicable_within_days:
          type: integer
          format: int64
          minimum: 0
          description: Number of days after opening that the penalty is applied
          example: 30
        penalty_interest_days:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of days multiplied by the applicable interest or earnings
            rate to determine the penalty amount.
          example: 90
    DepositProductEndDate:
      type: string
      format: date
      description: >-
        Last day the deposit product can be attached to an account or program,
        in UTC. Attachments after this day are rejected. Must be after today.
      example: '2027-12-31'
    DepositProductFundingDuration:
      type: integer
      format: int64
      description: >-
        Period, in days, during which deposits are allowed before the account is
        blocked
      example: 12
    DepositProductGracePeriod:
      description: >-
        This penalty corresponds to fee ID `gracePeriodPenaltyID` and trasaction
        flow `gracePeriodPenalty`
      type: object
      required:
        - duration_days
        - penalty_interest_days
      properties:
        duration_days:
          type: integer
          format: int64
          minimum: 0
          description: Duration of the grace period in days
          example: 7
        penalty_interest_days:
          type: integer
          format: int64
          minimum: 0
          description: Number of interest days to forfeit as penalty
          example: 30
    DepositProductGracePeriodDurationDays:
      type: integer
      format: int64
      description: >-
        Grace period after maturity, in days, when no grace period penalty is
        defined. To define one, use `penalties.grace_period`. The grace period
        starts with the next cycle, so the first cycle has none, and interest
        accrues during it only when `accrue_during_grace_period` is `true`.
      example: 10
    DepositProductMaturityNotice:
      type: object
      required:
        - days_before_maturity
        - description
      properties:
        days_before_maturity:
          type: integer
          format: int64
          minimum: 1
          description: >
            Number of days before the account’s maturity date when the notice is
            sent. The value must be a positive integer greater than zero. Inputs
            such as zero, negative numbers, decimals, null, or non-numeric
            values result in `HTTP 400`. Each notice must use a distinct
            `days_before_maturity` value within the array.
          example: 30
        description:
          type: string
          maxLength: 128
          description: >
            A short, human‑readable label for the notice. Each entry must
            include one description, and it cannot exceed 128 characters.
          example: 30-day advance notice
    DepositProductMaxAmount:
      type: number
      format: double
      description: Maximum deposit amount, in the account's currency
      example: 5000
    DepositProductMaxTerm:
      type: integer
      format: int64
      description: Maximum term, in days
      example: 1025
    DepositProductMetadata:
      type: object
      description: >
        The metadata object contains user-defined key-value pairs that provide
        additional context or custom information.<br>

        Metadata content is not controlled by the Pismo platform and is instead
        controlled by the user.<br>


        **Note**: This field must not be used to send Personally Identifiable
        Information (PII), Payment Card Industry (PCI) data, or any
        sensitive/regulated information. Metadata fields are intended for
        operational, non-sensitive data only. For sensitive data, use the
        specific parameters designed for that purpose. For more information,
        refer to [Get started with Pismo
        APIs](ref:get-started-with-pismo-apis#metadata).
      example:
        key: value
    DepositProductMinAmount:
      type: number
      format: double
      description: >-
        Minimum balance to earn interest, in the account's currency. Below it,
        no interest is calculated. Without it, any balance earns interest.
      example: 1000
    DepositProductMinTerm:
      type: integer
      format: int64
      description: Minimum term, in days
      example: 265
    DepositProductName:
      type: string
      minLength: 1
      description: Deposit product name
      example: 12-month CD
    DepositProductNotices:
      type: array
      maxItems: 3
      description: >-
        Advance maturity notices, each with a different `days_before_maturity`.
        Without notices, none are configured.
      items:
        $ref: '#/components/schemas/DepositProductMaturityNotice'
    DepositProductPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of deposit products on the current page
          items:
            $ref: '#/components/schemas/DepositProduct'
        last_id:
          type: integer
          format: int64
          description: >-
            Reference of the last deposit product on the page, to pass as
            `after_id`. Omitted on the last page.
          example: 1706027185000000000
        next_page:
          type: boolean
          description: Is there a next page?
          example: true
        per_page:
          type: integer
          format: int32
          description: Maximum items per page
          example: 20
    DepositProductStartDate:
      type: string
      format: date
      description: >-
        First day the deposit product can be attached to an account or program,
        in UTC. Attachments before this day are rejected.
      example: '2026-12-01'
    DepositProductStatus:
      type: string
      description: >-
        Deposit product status. A deposit product is created with `CREATED`, and
        changes to `EXPIRED` after its `end_date`.
      enum:
        - CREATED
        - ACTIVE
        - INACTIVE
        - EXPIRED
      example: ACTIVE
    DepositProductSubsequentWithdrawals:
      type: object
      description: >
        This penalty corresponds to fee ID `subsequentWithdrawalPenaltyID` and
        transaction flow `subsequentWithdrawalPenalty`.<br>

        Settings for the subsequent withdrawal penalty (Regulation D).

        A penalty fee is applied when a customer makes a withdrawal within the
        configured window.

        The window either resets with each withdrawal (ROLLING) or remains fixed
        from the first withdrawal (FIXED).
      required:
        - applicable_within_days
        - window_behavior
      properties:
        applicable_within_days:
          type: integer
          format: int64
          minimum: 1
          description: >
            The number of days following a withdrawal during which a subsequent
            withdrawal triggers the penalty.

            Must be at least 1.
          example: 30
        window_behavior:
          type: string
          enum:
            - ROLLING
            - FIXED
          description: >
            Controls how the penalty window is managed after each withdrawal:

            - `ROLLING`: the window resets on every withdrawal (scheduler is
            replaced)

            - `FIXED`: the window is set once on the first withdrawal and does
            not reset
          example: ROLLING
        penalty_interest_days:
          type: integer
          format: int64
          minimum: 1
          description: |
            Number of interest days to forfeit as the penalty amount.
            Must be at least 1 when provided.
          example: 7
    DepositProductTermType:
      type: string
      description: Term type
      enum:
        - FIXED
        - FLEXIBLE
      example: FIXED
    DepositProductTieredInterestForfeitureTier:
      description: >-
        This penalty corresponds to fee ID `tieredInterestForfeiturePenaltyID`
        and transaction flow `tieredInterestForfeiturePenalty`
      type: object
      required:
        - min_days_held
        - max_days_held
        - forfeited_interest_days
      properties:
        min_days_held:
          type: integer
          format: int64
          description: Minimum number of days the deposit must be held
          example: 1
        max_days_held:
          type: integer
          format: int64
          description: Maximum number of days the deposit can be held
          example: 90
        forfeited_interest_days:
          type: integer
          format: int64
          description: Number of interest days to forfeit as penalty
          example: 30
    DepositProductWithdrawalFee:
      description: >-
        This penalty corresponds to fee ID `withdrawalFeePenaltyID` and
        transaction flow `withdrawalFeePenalty`
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - PERCENTAGE
            - FIXED
          description: Withdrawal fee type
          example: PERCENTAGE
        value:
          type: number
          format: double
          description: >
            Value of the withdrawal fee.

            - `PERCENTAGE`: a fraction of the withdrawal amount, with up to 4
            decimal places (`0.015` = 1.5%). Fee = `withdrawal_amount × value`.

            - `FIXED`: an amount in the account's currency, with up to 2 decimal
            places.
          example: 0.015
    DepositRenewalTermOverrideRequest:
      type: object
      description: >
        Specifies the recurring rollover term, not to be confused with the
        initial `maturity_period`.


        You must provide either `unit` with `value` or
        `renewal_calendar_maturity_date`.


        A `ROLLOVER` configuration in principal or interest is required.


        When you pass `renewal_calendar_maturity_date`, the Pismo platform
        converts the interval from today into a day count and stores it at
        attach time in normalized form: `{unit: DAYS, value: <calculated>}`.
      properties:
        unit:
          type: string
          enum:
            - DAYS
            - WEEKS
            - MONTHS
            - YEARS
          description: >-
            Time unit of the renewal term. Required together with `value` when
            calendar form is not used.
          example: MONTHS
        value:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Number of units. Required together with `unit` when calendar form is
            not used.
          example: 6
        renewal_calendar_maturity_date:
          type: string
          format: date
          description: >-
            Explicit calendar date (`YYYY-MM-DD`), the date must be a future
            date, and does not coincide with `unit`+`value`.
          example: '2027-05-22'
    DepositRenewalTermResponse:
      type: object
      description: >
        Renewal term applied on each rollover. The platform preserves the
        client's original format: `unit`+`value` appears when provided, and
        `renewal_calendar_maturity_date` is returned as a string when that form
        is used.
      properties:
        unit:
          type: string
          enum:
            - DAYS
            - WEEKS
            - MONTHS
            - YEARS
          example: MONTHS
        value:
          type: integer
          format: int32
          minimum: 1
          example: 6
        renewal_calendar_maturity_date:
          type: string
          format: date
          description: >-
            Returned only when the request uses the calendar format. Format =
            `YYYY-MM-DD`.
          example: '2027-05-22'
    DepositSubsequentWithdrawalsOverrideRequest:
      type: object
      description: Subsequent withdrawals (Regulation D) override.
      required:
        - waived
      properties:
        waived:
          type: boolean
        applicable_within_days:
          type: integer
          format: int32
          minimum: 1
        penalty_interest_days:
          type: integer
          format: int32
          minimum: 1
        window_behavior:
          type: string
          enum:
            - ROLLING
            - FIXED
        valid_until_datetime:
          type: string
          format: date-time
    DepositTieredInterestForfeitureOverrideRequest:
      type: object
      description: >-
        Tiered interest forfeiture override. Tiers replace the product's tiers
        when provided.
      required:
        - waived
      properties:
        waived:
          type: boolean
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/DepositTieredInterestForfeitureTierRequest'
        valid_until_datetime:
          type: string
          format: date-time
    DepositTieredInterestForfeitureTierRequest:
      type: object
      required:
        - min_days_held
        - forfeited_interest_days
      properties:
        min_days_held:
          type: integer
          format: int32
          minimum: 0
        max_days_held:
          type: integer
          format: int32
          minimum: 0
          description: Optional. Open-ended tier when omitted.
        forfeited_interest_days:
          type: integer
          format: int32
          minimum: 0
    DepositWithdrawalFeeOverrideRequest:
      type: object
      description: Withdrawal fee override.
      required:
        - waived
      properties:
        waived:
          type: boolean
        type:
          type: string
          enum:
            - PERCENTAGE
            - FIXED
        value:
          type: number
          format: double
          exclusiveMinimum: 0
        valid_until_datetime:
          type: string
          format: date-time
    DetachRequest:
      type: object
      required:
        - product_id
      properties:
        product_id:
          type: string
          description: Product identifier.
          example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
        metadata:
          type: object
          description: >
            The metadata object contains user-defined key-value pairs that offer
            additional context or custom information.<br>

            The platform has no control over its content, but rather controlled
            by the user.<br>


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only. For sensitive data, use
            the specific parameters designed for that purpose. For more
            information, refer to [Get started with Pismo
            APIs](ref:get-started-with-pismo-apis#metadata).
          example:
            key: value
    Division:
      type: object
      description: >-
        `external_hierarchy_id`, `external_hierarchy_level_id` and
        `external_program_ids` leave out hierarchies, hierarchy levels and
        programs created outside Apex. `program_ids` lists all the programs.
      required:
        - division_code
        - division_id
        - hierarchy_id
        - hierarchy_level_id
      properties:
        division_code:
          $ref: '#/components/schemas/DivisionCode'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        hierarchy_id:
          $ref: '#/components/schemas/HierarchyId'
        hierarchy_level_id:
          $ref: '#/components/schemas/HierarchyLevelId'
        description:
          $ref: '#/components/schemas/DivisionDescription'
        external_hierarchy_id:
          $ref: '#/components/schemas/ExternalHierarchyId'
        external_hierarchy_level_id:
          $ref: '#/components/schemas/ExternalHierarchyLevelId'
        external_program_ids:
          $ref: '#/components/schemas/DivisionExternalProgramIds'
        name:
          $ref: '#/components/schemas/DivisionName'
        parent_division_code:
          $ref: '#/components/schemas/DivisionParentCode'
        program_ids:
          $ref: '#/components/schemas/DivisionProgramIds'
        schema:
          $ref: '#/components/schemas/DivisionSchemaCreateTransactionBankingAccount'
        timezone:
          $ref: '#/components/schemas/DivisionTimezone'
    DivisionCode:
      type: string
      minLength: 1
      maxLength: 36
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        Division code provided by the client, with only letters, numbers and
        hyphens. It is unique per organization and cannot be changed after the
        division is created.
      example: PSM-DIVISION-01
    DivisionDescription:
      type: string
      minLength: 1
      maxLength: 80
      description: Division description
      example: NY - New York City
    DivisionExternalProgramIds:
      type: array
      maxItems: 100
      uniqueItems: true
      description: >-
        External program IDs of the programs that accounts in the division can
        use, validated when a transaction banking account is created. Without
        them, the division inherits the programs of its parent division, if it
        has one.
      items:
        $ref: '#/components/schemas/ExternalId'
      example:
        - PSM-PROGRAM-01
        - PSM-PROGRAM-02
    DivisionId:
      type: string
      format: uuid
      description: Pismo-generated division ID
      example: 6f8a456a-8b1a-4022-a2f8-7612595330b5
    DivisionName:
      type: string
      description: Division name
      example: NY
      minLength: 1
      maxLength: 40
    DivisionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of divisions on the current page
          items:
            $ref: '#/components/schemas/Division'
        pagination:
          $ref: '#/components/schemas/CorporatePagination'
    DivisionParentCode:
      type: string
      description: >-
        Division code that can be set as the parent of the division being
        created. The parent must be at a level with a lower index than the
        division being created. It must comply with the rule `^[a-zA-Z0-9-]+$`.
      minLength: 1
      maxLength: 36
      pattern: ^[a-zA-Z0-9-]+$
      example: my-parent-division
    DivisionProgramIds:
      type: array
      description: Pismo-generated IDs of the division's programs
      items:
        $ref: '#/components/schemas/ProgramId'
      example:
        - 12345
        - 12346
    DivisionSchemaCreateTransactionBankingAccount:
      type: object
      description: >
        Valid JSON Schema as defined at
        https://json-schema.org/specification.html.

        This schema validates the JSON custom fields used in the

        [Create transaction banking account](ref:post-account) process.

        If this field is not set, the division inherits its schema from the
        parent

        division, if one exists.

        The example below is shown in YAML for readability; the API requires
        JSON.
      example:
        $schema: https://json-schema.org/draft/2020-12/schema
        title: Account custom fields
        type: object
        properties:
          cost_center:
            description: Cost center of the account
            type: string
            maxLength: 20
        required:
          - cost_center
    DivisionTimezone:
      type: string
      minLength: 1
      description: >
        Division timezone in timezone database format.<br>

        This value is used in the calculations for holidays, weekends, and daily
        balances. If a timezone is not specified, the division inherits the
        timezone from its parent division. If the parent division also lacks a
        specified timezone, Pismo defaults to using UTC.
      example: America/New_York
    ErrorResponse:
      type: object
      description: >
        `code` identifies the error scenario. `W` codes are business validations
        and `E` codes are technical errors (`WAPX0030`, `EAPX0000`). `W` and `E`
        codes are numbered separately. Each operation lists the codes it returns
        and what each one means.


        When the Pismo platform rejects or fails the request, `message` ends
        with the platform's code, like `(downstream code: EIBACC0294)`. Branch
        on `code`, never on `message`.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
          example: WAPX0040
        message:
          type: string
          description: Error message
          example: no program has the external program ID in the path
    ExternalAccountId:
      type: string
      maxLength: 60
      description: >-
        External account ID, at most 60 characters, provided by the client
        system that owns the account. Requests send it only in the
        `x-external-account-id` header. Responses and events include it for
        accounts that have it stored.
      example: account-xyz-987
    ExternalAccountingAccountId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[A-Za-z0-9._~-]+$
      description: >-
        Accounting account ID provided by the client, unique per organization.
        It cannot be changed after the accounting account is created.
      example: PSM-ACCOUNTING-ACCOUNT-01
    ExternalAccountingScriptId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[A-Za-z0-9._~-]+$
      description: >-
        Accounting script ID provided by the client, unique per organization. It
        cannot be changed after the accounting script is created.
      example: PSM-ACCOUNTING-SCRIPT-01
    ExternalEntryTypeId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[A-Za-z0-9._~-]+$
      description: >-
        Entry type ID provided by the client, unique per organization. It cannot
        be changed after the entry type is created.
      example: PSM-ENTRY-TYPE-01
    ExternalEventTypeId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[A-Za-z0-9._~-]+$
      description: >-
        Event type ID provided by the client, unique per organization. It cannot
        be changed after the event type is created.
      example: PSM-EVENT-TYPE-01
    ExternalFeeModelId:
      type: string
      minLength: 1
      maxLength: 60
      description: >-
        Fee model ID provided by the client, unique per organization. It cannot
        be changed after the fee model is created.
      example: PSM-FEE-MODEL-01
    ExternalHierarchyId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        Hierarchy ID provided by the client, unique per organization. It cannot
        be changed after the hierarchy is created.
      example: PSM-HIERARCHY-01
    ExternalHierarchyLevelId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        Hierarchy level ID provided by the client, unique per organization. It
        cannot be changed after the hierarchy is created.
      example: PSM-HIERARCHY-LEVEL-01
    ExternalId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        ID provided by the client, with only letters, numbers and hyphens. It is
        unique per organization and concept, and returned exactly as received.
      example: PSM-EXTERNAL-01
    ExternalInterestPlanId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        Interest plan ID provided by the client, unique per organization. It
        cannot be changed after the interest plan is created.
      example: PSM-INTEREST-PLAN-01
    ExternalProductId:
      type: string
      minLength: 1
      maxLength: 60
      pattern: ^[a-zA-Z0-9-]+$
      description: >-
        Deposit product ID provided by the client, unique per organization. It
        cannot be changed after the deposit product is created.
      example: PSM-DEPOSIT-PRODUCT-01
    ExternalProgramId:
      $ref: '#/components/schemas/ExternalId'
    FeeModel:
      type: object
      description: >-
        `external_fee_model_id` is omitted for fee models created outside of the
        bank link workflow.
      required:
        - fee_model_id
        - model_description
        - fees
      properties:
        fee_model_id:
          $ref: '#/components/schemas/FeeModelId'
        fees:
          type: array
          description: List of the fee model's fees
          items:
            $ref: '#/components/schemas/FeeModelFee'
        model_description:
          $ref: '#/components/schemas/FeeModelDescription'
        external_fee_model_id:
          $ref: '#/components/schemas/ExternalFeeModelId'
    FeeModelAdditionalFee:
      type: object
      required:
        - calculation
        - id
        - description
        - type
      properties:
        description:
          type: string
          description: Fee description.
          example: Foreign currency surchange.
        type:
          description: >-
            Fee type, represents the fee classification, and is linked with the
            `id` field.
          type: string
          example: sellos
        id:
          $ref: '#/components/schemas/FeeModelFeeID'
        calculation:
          oneOf:
            - $ref: '#/components/schemas/FeeModelFeeCalculationFixed'
            - $ref: '#/components/schemas/FeeModelFeeCalculationGreater'
            - $ref: '#/components/schemas/FeeModelFeeCalculationPercentage'
    FeeModelCalculationMethodSubset:
      type: string
      description: Calculation method.
      enum:
        - FIXED
        - PERCENTAGE
      example: FIXED
    FeeModelDayCountMethod:
      type: string
      description: Day count convention used to calculate interest
      example: MONTH_30_YEAR_360
      enum:
        - MONTH_30_YEAR_360
        - MONTH_ACTUAL_YEAR_365
    FeeModelDescription:
      type: string
      minLength: 1
      maxLength: 255
      description: Fee model description
      example: Fee model to org
    FeeModelFee:
      type: object
      required:
        - description
        - id
        - type
        - calculation
        - filters
      properties:
        description:
          type: string
          description: Fee description.
          minLength: 1
          maxLength: 255
          example: Fee wdl
        id:
          $ref: '#/components/schemas/FeeModelFeeID'
        type:
          description: >
            Fee type, represents the fee classification, and is linked with the
            `id` field.
          type: string
          example: sellos
        precedence:
          $ref: '#/components/schemas/FeeModelPrecedence'
        deduct_from_transaction_value:
          description: |
            Should fee be deducted from transaction value flag? Default=`false`.
          type: boolean
          example: true
        calculation_basis:
          type: string
          description: >
            * `PRINCIPAL_AMOUNT` - Taxes are applied to original transaction
            amount only. This is the default.

            * `CONTRACT_AMOUNT` -  Taxes are applied to original transaction
            amount plus fees.
          enum:
            - PRINCIPAL_AMOUNT
            - CONTRACT_AMOUNT
          example: PRINCIPAL_AMOUNT
        collection_strategy:
          type: string
          description: >
            Optional. Controls in which installment the already-calculated fee
            amount is collected, without changing how the fee is calculated.

            * When omitted, the fee is distributed across the installment
            schedule following the existing behavior.

            * `FIRST_INSTALLMENT` - The full fee amount is collected in the
            first installment of the operation instead of being distributed
            across the schedule. For operations with a grace period, this is the
            first installment generated after the grace period ends.
          enum:
            - FIRST_INSTALLMENT
          example: FIRST_INSTALLMENT
        calculation:
          oneOf:
            - $ref: '#/components/schemas/FeeModelFeeCalculationFixed'
            - $ref: '#/components/schemas/FeeModelFeeCalculationGreater'
            - $ref: '#/components/schemas/FeeModelFeeCalculationPercentage'
            - $ref: '#/components/schemas/FeeModelFeeCalculationDailyPercentage'
            - $ref: '#/components/schemas/FeeModelFeeCalculationCompoundInterest'
            - $ref: '#/components/schemas/FeeModelFeeCalculationAccumulator'
            - $ref: '#/components/schemas/FeeModelFeeCalculationDynamicByAmount'
            - $ref: '#/components/schemas/FeeModelFeeCalculationPriceTable'
            - $ref: '#/components/schemas/FeeModelFeeCalculationEqualInstallments'
            - $ref: '#/components/schemas/FeeModelFeeCalculationAging'
            - $ref: '#/components/schemas/FeeModelFeeCalculationIof'
            - $ref: '#/components/schemas/FeeModelFeeCalculationConstantRepayment'
            - $ref: '#/components/schemas/FeeModelFeeCalculationBuiltIn'
        filters:
          $ref: '#/components/schemas/FeeModelFilters'
        additional_fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeModelAdditionalFee'
    FeeModelFeeCalculationAccumulator:
      type: object
      description: Fee calculation for ACCUMULATOR model.
      required:
        - calculation_method
        - index
        - identifier
        - rules
      properties:
        calculation_method:
          type: string
          description: Calculation method - `ACCUMULATOR`.
          enum:
            - ACCUMULATOR
        index:
          type: string
          description: |
            Field used to index the calculation.
              `AMOUNT` - Fee is based on transaction totals.
              `QUANTITY` - Fee is based on number of transactions.
          enum:
            - AMOUNT
            - QUANTITY
          example: QUANTITY
        identifier:
          type: string
          description: >
            Accumulator configuration ID. Client-assigned and passed to the <a
            href="https://developers.pismo.io/pismo-docs/reference/post-v1-accumulator-config"
            target="_blank">Create accumulator configuration</a> endpoint.
          example: ACC_CASH_OUT
        rules:
          type: array
          description: Ranges and strategies
          items:
            oneOf:
              - $ref: '#/components/schemas/FeeModelRuleRange'
              - $ref: '#/components/schemas/FeeModelRuleGreater'
    FeeModelFeeCalculationAging:
      type: object
      required:
        - calculation_method
        - rate
      properties:
        calculation_method:
          type: string
          description: Calculation method - `AGING`.
          enum:
            - AGING
        index:
          type: string
          description: Define range type when rate is dynamic.
          enum:
            - DAY
        rate:
          $ref: '#/components/schemas/FeeModelRate'
    FeeModelFeeCalculationBuiltIn:
      type: object
      description: >
        Fee calculation for `BUILT_IN` model. A `BUILT_IN` fee is always applied
        before any other fee. The percentage defined in `value` is applied to
        the principal amount and the resulting fee amount is incorporated into
        the principal, so all subsequent fees are calculated over the principal
        plus the `BUILT_IN` fee.


        A `BUILT_IN` fee can only be added if its `precedence` is lower than the
        `precedence` of every other fee in the same fee model that shares at
        least one `processing_code` with it. If any of those fees has an equal
        or lower `precedence`, the API returns `400 Bad Request` with an invalid
        payload error listing the violated `field` and `violation`.


        A `BUILT_IN` fee only accepts `calculation_basis` equal to
        `PRINCIPAL_AMOUNT`. If `calculation_basis` is omitted, it defaults to
        `PRINCIPAL_AMOUNT`. If `calculation_basis` is `CONTRACT_AMOUNT`, the API
        returns `400 Bad Request` with an invalid payload error listing the
        violated `field` and `violation`.
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          type: string
          description: >-
            Calculation method - `BUILT_IN`. Always applied before any other
            fee, and its amount is incorporated into the principal.
          enum:
            - BUILT_IN
        value:
          type: number
          format: double
          description: Percentage amount as decimal field, applied to the principal amount.
          example: 1.3
    FeeModelFeeCalculationCompoundInterest:
      type: object
      required:
        - calculation_method
        - value
        - days_range
      properties:
        calculation_method:
          type: string
          description: >-
            Calculation method - `COMPOUND_INTEREST`. Applied to loan-type
            products.
          enum:
            - COMPOUND_INTEREST
        value:
          type: number
          format: double
          description: Percentage amount as decimal field.
          example: 1.3
        days_range:
          type: integer
          format: int64
          description: >
            Calculation's range of days.


            For example: 10% interest and `days_range` = 20 for $100 purchase;
            considering 10 days between purchase and cycle close, is applied
            0.5% per day (10/20). In the first day, the value will be 0.5 (100 x
            0.5%), in the second day the value will be 0.55 (100.05 x 0.5%), and
            so on.
          example: 30
    FeeModelFeeCalculationConstantRepayment:
      type: object
      required:
        - calculation_method
        - day_count_method
        - interest_rate
      properties:
        calculation_method:
          type: string
          description: Calculation method - `CONSTANT_REPAYMENT`
          enum:
            - CONSTANT_REPAYMENT
        day_count_method:
          $ref: '#/components/schemas/FeeModelDayCountMethod'
        payment_postponement_rules:
          type: object
          description: Rules for payment postponement.
          properties:
            basis:
              type: string
              description: Postponement basis.
              enum:
                - PRINCIPAL
                - INTEREST
              example: INTEREST
            cycles:
              type: string
              description: Number of cycles to postpone.
              example: '1'
        interest_rate:
          $ref: '#/components/schemas/FeeModelInterestRate'
        fees:
          type: array
          description: List of additional fees.
          items:
            type: object
            required:
              - calculation
              - id
              - precedence
              - value
              - calculation_basis
            properties:
              calculation:
                type: string
                enum:
                  - FIXED
                  - PERCENTAGE
                  - DAILY_PERCENTAGE
                example: FIXED
              id:
                type: string
                example: tax1
              precedence:
                type: integer
                format: int64
                example: 1
              value:
                type: number
                format: double
                example: 10
              calculation_basis:
                type: string
                enum:
                  - PRINCIPAL_AMOUNT
                  - CONTRACT_AMOUNT
                example: PRINCIPAL_AMOUNT
    FeeModelFeeCalculationDailyPercentage:
      type: object
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          type: string
          description: >-
            Calculation method - `DAILY_PERCENTAGE`. Applied to credit card cash
            advances and other loan-type products.
          enum:
            - DAILY_PERCENTAGE
        value:
          type: number
          format: double
          description: Percentage amount as decimal field.
          example: 1.3
    FeeModelFeeCalculationDynamicByAmount:
      type: object
      description: Fee calculation for `DYNAMIC_BY_AMOUNT` model.
      required:
        - calculation_method
        - rules
      properties:
        calculation_method:
          type: string
          description: Calculation method - `DYNAMIC_BY_AMOUNT`.
          enum:
            - DYNAMIC_BY_AMOUNT
        rules:
          type: array
          description: Ranges and strategies
          items:
            oneOf:
              - $ref: '#/components/schemas/FeeModelRuleRange'
              - $ref: '#/components/schemas/FeeModelRuleGreater'
    FeeModelFeeCalculationEqualInstallments:
      type: object
      required:
        - calculation_method
        - fees
        - interest_rate
        - precedence
      properties:
        calculation_method:
          type: string
          description: Calculation method - `EQUAL_INSTALLMENTS`.
          enum:
            - EQUAL_INSTALLMENTS
        fees:
          $ref: '#/components/schemas/FeeModelFees'
        interest_rate:
          $ref: '#/components/schemas/FeeModelInterestRateWithGracePeriod'
        precedence:
          $ref: '#/components/schemas/FeeModelPrecedence'
        day_count_method:
          type: string
          enum:
            - MONTH_30_YEAR_360
            - MONTH_ACTUAL_YEAR_365
          example: MONTH_30_YEAR_360
    FeeModelFeeCalculationFixed:
      type: object
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          type: string
          description: Calculation method - `FIXED`
          enum:
            - FIXED
        value:
          type: number
          format: double
          description: Fixed fee amount as decimal field.
          example: 2.5
    FeeModelFeeCalculationGreater:
      type: object
      required:
        - calculation_method
        - fixed
        - percentage
      properties:
        calculation_method:
          type: string
          description: >-
            Calculation method - `GREATER`. Whichever value is greater - `fixed`
            or `percentage` is applied.
          enum:
            - GREATER
        fixed:
          type: number
          format: double
          description: Fixed fee amount as decimal field.
          example: 50
        percentage:
          type: number
          format: double
          description: Percentage amount as decimal field.
          example: 1.3
    FeeModelFeeCalculationIof:
      type: object
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          type: string
          description: Calculation method - `IOF`.
          enum:
            - IOF
        value:
          type: number
          format: double
          description: >-
            Percentage amount as decimal and used as base to calculate the fee
            amount.
          example: 100
    FeeModelFeeCalculationPercentage:
      type: object
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          type: string
          description: Calculation method - `PERCENTAGE`.
          enum:
            - PERCENTAGE
        value:
          type: number
          format: double
          description: Percentage amount as decimal field.
          example: 1.3
    FeeModelFeeCalculationPriceTable:
      type: object
      required:
        - calculation_method
        - fixed_iof_rate
        - interest_rate
        - daily_iof_rate
      properties:
        calculation_method:
          type: string
          description: Calculation method - `PRICE_TABLE`.
          enum:
            - PRICE_TABLE
        index:
          type: string
          description: Define range type when interest rate is dynamic.
          enum:
            - INSTALLMENT
        fixed:
          type: number
          format: double
          description: Fixed fee amount as decimal field.
          example: 50
        percentage:
          type: number
          format: double
          description: Percentage amount as decimal field.
          example: 1.3
        fixed_iof_rate:
          type: number
          format: double
          description: Percentage amount as decimal field. IOF = Brazilian tax.
          example: 0.38
        daily_iof_rate:
          type: number
          format: double
          description: Percentage amount as decimal field. IOF = Brazilian tax.
          example: 0.0082
        interest_rate:
          $ref: '#/components/schemas/FeeModelInterestRate'
    FeeModelFeeID:
      type: string
      description: >
        Fee ID - a reference from transaction postings. The Pismo transaction
        team uses fee ID fields to make accounting entries. Talk to your Pismo
        representative about getting fee IDs for your operations.
      example: sellos_baires
    FeeModelFees:
      type: array
      description: List of additional fees.
      items:
        type: object
        required:
          - calculation
          - id
          - precedence
          - value
          - calculation_basis
        properties:
          calculation:
            type: string
            enum:
              - FIXED
              - PERCENTAGE
              - DAILY_PERCENTAGE
              - IOF
            example: FIXED
          id:
            type: string
            example: tax1
          precedence:
            type: integer
            format: int64
            example: 1
          value:
            type: number
            format: double
            example: 10
          calculation_basis:
            type: string
            enum:
              - PRINCIPAL_AMOUNT
              - CONTRACT_AMOUNT
            example: PRINCIPAL_AMOUNT
          fixed_iof_rate:
            type: number
            format: double
            example: 3.5
          daily_iof_rate:
            type: number
            format: double
            example: 0.0082
    FeeModelFilters:
      type: object
      required:
        - processing_codes
      properties:
        processing_codes:
          type: array
          example:
            - '02'
            - '0040'
          description: >
            Processing codes to apply the fee to.  Processing codes identify an
            operation, such as purchases or debits. Each financial operation
            within the platform has its processing code. Some you can configure,
            while others are fixed in the card network flow. Talk to your Pismo
            representative to get, or create, processing codes. For more
            information, see <a
            href="https://developers.pismo.io/pismo-docs/docs/processing-codes-and-transaction-types"
            target="_blank">Processing codes and transaction types</a>.
          items:
            type: string
        operation_types:
          type: array
          description: >-
            Operation types to apply the fee to. If not specified, fees will be
            applied to all types.
          items:
            type: string
            enum:
              - authorization
              - confirmation
            example: authorization
        amount_range:
          type: object
          description: >-
            Optional amount range filter. When specified, the fee is applied
            only to operations whose amount falls within the given range. When
            the object is sent, only `minimum` is required; `maximum` remains
            optional. When two fees share at least one `processing_code`, their
            `amount_range` intervals must not overlap — a fee with no `maximum`
            is treated as unbounded above.
          required:
            - minimum
          properties:
            minimum:
              type: number
              format: double
              description: >-
                Minimum amount (inclusive) for the fee to be applied. BigDecimal
                value. Required when `amount_range` is provided.
              example: 10
            maximum:
              type: number
              format: double
              description: >-
                Maximum amount (inclusive) for the fee to be applied. BigDecimal
                value. Optional — when present, must be greater than or equal to
                `minimum`.
              example: 1000
        merchant_category:
          type: object
          description: >-
            Optional merchant category filter. When specified, the fee is
            applied only to operations whose Merchant Category Code (MCC)
            matches the given include/exclude criteria. MCC is treated as an
            opaque string — no ISO 8583 validation is performed. Omitting the
            object, or leaving both lists empty, bypasses the filter.
            Server-side validation — `include` and `exclude` each must not
            contain duplicate MCC values, and the two lists must not share any
            MCC value; violations return HTTP 400.
          properties:
            include:
              type: array
              description: >-
                When non-empty, the fee is applied only if the request MCC is in
                this list. A request without an MCC does not match when
                `include` is populated.
              items:
                type: string
              example:
                - '7995'
                - '5411'
            exclude:
              type: array
              description: >-
                When non-empty, the fee is NOT applied if the request MCC is in
                this list.
              items:
                type: string
              example:
                - '9999'
    FeeModelId:
      type: string
      format: uuid
      description: Pismo-generated fee model ID
      example: d290f1ee-6c54-4b01-90e6-d701748f0851
    FeeModelInterestRate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Fee type:
              `FIXED` - Field `value` is required and will be used as interest rate. Field `grace_period` is optional.
              `DYNAMIC` - Field `rules` is required and the value used as interest rate will be selected according to the installment ranges configured.
          enum:
            - FIXED
            - DYNAMIC
          example: FIXED
        value:
          type: number
          format: double
          description: >-
            Percentage amount as decimal field. Value used as interest rate.
            **REQUIRED** for `FIXED` type.
          example: 0.2
        grace_period:
          type: object
          description: >
            Optional grace period before interest begins. Only applicable when
            interest rate `type` is `FIXED`.


            **Only processed for the `EQUAL_INSTALLMENTS` calculation method.**
            Silently ignored for all other methods (e.g., `PRICE_TABLE`,
            `DAILY_PERCENTAGE`).
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - FIXED
              example: FIXED
            value:
              type: number
              format: double
              minimum: 0
              description: Number of periods to skip before interest begins.
              example: 1
        rules:
          type: array
          description: >-
            Installment ranges responsible to configure the value used as
            interest rate. **REQUIRED** for `DYNAMIC` type.
          items:
            $ref: '#/components/schemas/FeeModelInterestRateRule'
    FeeModelInterestRateRule:
      type: object
      required:
        - minimum
        - maximum
        - calculation
      properties:
        minimum:
          type: number
          format: double
          minimum: 1
          description: >
            First installment the rule is applied to. For example, if you enter
            "4", rule application begins on the 4th installment.

            Must be 1 or higher.
          example: 10
        maximum:
          type: number
          format: double
          maximum: 70
          description: >
            Last installment the rule is applied to. For example, if you enter
            "10", rule application ends after the 10th installment.
          example: 30
        calculation:
          $ref: '#/components/schemas/FeeModelRuleCalculation'
        progression:
          $ref: '#/components/schemas/FeeModelProgression'
    FeeModelInterestRateWithGracePeriod:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Fee type:
              `FIXED` - Field `value` is required and will be used as interest rate.
              `DYNAMIC` - Field `rules` is required and the value used as interest rate will be selected according to the installment ranges configured.
          enum:
            - FIXED
            - DYNAMIC
          example: FIXED
        value:
          type: number
          format: double
          description: >-
            Percentage amount as decimal field. Value used as interest rate.
            **REQUIRED** for `FIXED` type.
          example: 0.2
        grace_period:
          type: object
          description: >
            Optional grace period before interest begins.


            **Only processed for the `EQUAL_INSTALLMENTS` calculation method.**
            Silently ignored for all other methods.
          required:
            - type
            - value
          properties:
            type:
              type: string
              enum:
                - FIXED
              example: FIXED
            value:
              type: number
              format: double
              minimum: 0
              description: Number of periods to skip before interest begins.
              example: 1
        rules:
          type: array
          description: >-
            Installment ranges responsible to configure the value used as
            interest rate. **REQUIRED** for `DYNAMIC` type.
          items:
            $ref: '#/components/schemas/FeeModelInterestRateRule'
    FeeModelMaximumRule:
      type: number
      format: double
      description: >
        Last transaction the rule is applied to. For example, if you enter "10",
        rule application ends after the 10th transaction.
      example: 100
    FeeModelMinimumRule:
      type: number
      format: double
      description: >
        First tranasction this rule is applied to. For example, if you enter
        "4", the rule starts being applied on the 4th transaction.
      example: 4
    FeeModelPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of fee models on the current page
          items:
            $ref: '#/components/schemas/FeeModel'
    FeeModelPrecedence:
      description: >
        Calculation order. All fees with the same precedence number are
        calculated in the same iteration. The next iteration uses the previous
        output as its calculation basis.
      type: integer
      format: int64
      example: 0
    FeeModelProgression:
      type: object
      description: Rate progression configuration.
      required:
        - value
        - steps
      properties:
        value:
          type: number
          format: double
          description: >-
            Percentage amount as decimal field added to `rule.calculation.value`
            base value.
          example: 0.02
        steps:
          type: integer
          format: int64
          description: Frequency `value` is applied.
          example: 10
    FeeModelRate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: |
            Fee type:
              `FIXED` - Field `value` is **REQUIRED** and used as rate.
              `DYNAMIC` - Field `rules` is **REQUIRED** and the value used as rate is selected according to the day ranges configured.
          enum:
            - FIXED
            - DYNAMIC
          example: FIXED
        value:
          type: number
          format: double
          description: >-
            Percentage amount as decimal field. Value is used as rate.
            **REQUIRED** for `FIXED` type.
          example: 0.2
        rules:
          type: array
          description: >-
            Ranges responsible to configure the value used as rate. **REQUIRED**
            for `DYNAMIC` type.
          items:
            oneOf:
              - $ref: '#/components/schemas/FeeModelRateRuleRange'
              - $ref: '#/components/schemas/FeeModelRateRuleGreater'
    FeeModelRateRuleGreater:
      type: object
      required:
        - greater_than
        - calculation
      properties:
        greater_than:
          type: number
          format: double
          description: Rule is applied to numbers greater than this value.
          example: 10
        calculation:
          $ref: '#/components/schemas/FeeModelRuleCalculation'
        progression:
          $ref: '#/components/schemas/FeeModelProgression'
    FeeModelRateRuleRange:
      type: object
      required:
        - calculation
        - minimum
        - maximum
      properties:
        calculation:
          $ref: '#/components/schemas/FeeModelRuleCalculation'
        minimum:
          $ref: '#/components/schemas/FeeModelMinimumRule'
        maximum:
          $ref: '#/components/schemas/FeeModelMaximumRule'
        progression:
          $ref: '#/components/schemas/FeeModelProgression'
    FeeModelRuleCalculation:
      type: object
      required:
        - calculation_method
        - value
      properties:
        calculation_method:
          $ref: '#/components/schemas/FeeModelCalculationMethodSubset'
        value:
          type: number
          format: double
          description: Value to be applied
          example: 0.04
    FeeModelRuleGreater:
      type: object
      required:
        - greater_than
        - calculation
      properties:
        greater_than:
          type: number
          format: double
          description: >-
            Rule applies to numbers greater than this value. For example, if you
            enter "4", accumulation starts on the 5th transaction.
          example: 10
        calculation:
          $ref: '#/components/schemas/FeeModelRuleCalculation'
    FeeModelRuleRange:
      type: object
      required:
        - calculation
        - minimum
        - maximum
      properties:
        calculation:
          $ref: '#/components/schemas/FeeModelRuleCalculation'
        minimum:
          $ref: '#/components/schemas/FeeModelMinimumRule'
        maximum:
          $ref: '#/components/schemas/FeeModelMaximumRule'
    GetAverageBalanceResponse:
      type: object
      properties:
        account_id:
          type: integer
