        - $ref: '#/components/parameters/depositProductNameQuery'
        - $ref: '#/components/parameters/depositProductsBeginDateQuery'
        - $ref: '#/components/parameters/depositProductsEndDateQuery'
        - $ref: '#/components/parameters/depositProductsOrderQuery'
        - $ref: '#/components/parameters/depositProductsAfterIdQuery'
        - $ref: '#/components/parameters/depositProductsPerPageQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositProductPage'
        '400':
          description: >
            * `WAPX0000`: a query parameter breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DepositProductUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/deposit-products/{externalProductId}:
