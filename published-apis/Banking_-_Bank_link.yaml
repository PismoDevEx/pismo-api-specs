      maxLength: 80
    HierarchyLevelId:
      type: string
      format: uuid
      description: Pismo-generated hierarchy level ID
      example: 7d574f66-ebd0-4b83-85a1-98ce7569e5c3
    HierarchyLevelIndex:
      type: integer
      format: int32
      description: Hierarchy level index
      minimum: 0
      maximum: 9
      example: 2
    HierarchyLevelName:
      type: string
      description: Hierarchy level name
      minLength: 1
      maxLength: 40
    HierarchyName:
      type: string
      description: Hierarchy name
      minLength: 1
      maxLength: 40
    HierarchyPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of hierarchies on the current page
          items:
            $ref: '#/components/schemas/Hierarchy'
        pagination:
          $ref: '#/components/schemas/CorporatePagination'
    InterestAccountRequest:
      title: Interest account request
      type: object
      description: >
        Request body for `PUT /v1/interest/account/{accountId}`. The endpoint
        replaces the full

        interest configuration of the account, partial updates are not
        supported. Every request

        must redeclare a complete configuration that satisfies the rules below.


        Interest type. Exactly one of the two paths must be chosen:

        - **Benchmark-indexed rate:** If you pass `benchmark` and
        `margin_rate`., then `margin` is optional.
          `fixed_interest_rate` must be omitted.
        - **Fixed rate:** If you pass `fixed_interest_rate`, then `benchmark`,
        `margin_rate`, and `margin`
          must all be omitted.

        Passing neither `benchmark` nor `fixed_interest_rate` returns `400 Bad
        Request` with

        `fixed_interest_rate must be provided`. Passing both returns `400 Bad
        Request` with

        `fixed_interest_rate is not allowed when benchmark is passed`.


        **Tax-withholding rule**: Driven by
        `tax_withholding.withholding_moment`:

        - When `withholding_moment` is `ACCRUAL`, `fee_processing_code` is
        required and `tax_rules` must be omitted.

        - When `withholding_moment` is `CAPITALIZATION`, `tax_rules` is required
        and `fee_processing_code` must be omitted.

        - When `tax_withholding` is omitted, no withholding is configured.


        **Tax-exemption rule**: When `taxes_exemption` is `true`,
        `tax_withholding` must be null.

        When `taxes_exemption` is `false` or omitted, `tax_withholding` follows
        the rule above.


        Numeric fields (`fixed_interest_rate`, `margin_rate`) must have a
        positive value.

        `tax_withholding.fee_processing_code` is limited to 128 characters.
      properties:
        benchmark:
          $ref: '#/components/schemas/InterestBenchmark'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestFixedInterestRate'
        margin_rate:
          $ref: '#/components/schemas/InterestMarginRate'
        margin:
          $ref: '#/components/schemas/InterestMargin'
        taxes_exemption:
          type: boolean
          description: >-
            Is the account exempt from tax withholding? When `true`,
            `tax_withholding` must be null.
        tax_withholding:
          $ref: '#/components/schemas/InterestTaxWithholding'
        interest_by_tiers:
          $ref: '#/components/schemas/InterestByTiers'
        capitalization_frequency:
          $ref: '#/components/schemas/InterestCapitalizationFrequency'
          description: >-
            Optional account-level capitalization frequency. When provided with
            a valid value, it overrides the capitalization frequency configured
            in the associated interest plan. If omitted or sent as null, the
            current account-level value remains unchanged. If there is no
            existing account-level value, then the associated interest plan
            value is used during processing.
      example:
        benchmark: FED
        margin_rate: 1.3
        margin: 0.05
        tax_withholding:
          withholding_moment: ACCRUAL
          fee_processing_code: '001100'
    InterestAccountResponse:
      title: Interest account response
      type: object
      properties:
        benchmark:
          $ref: '#/components/schemas/InterestBenchmark'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestFixedInterestRate'
        margin_rate:
          $ref: '#/components/schemas/InterestMarginRate'
        margin:
          $ref: '#/components/schemas/InterestMargin'
        tax_withholding:
          $ref: '#/components/schemas/InterestTaxWithholding'
        taxes_exemption:
          $ref: '#/components/schemas/InterestTaxesExemption'
        interest_by_tiers:
          $ref: '#/components/schemas/InterestByTiers'
        capitalization_frequency:
          $ref: '#/components/schemas/InterestCapitalizationFrequency'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
          description: >-
            This is the external account ID parsed from a request's account
            token. Returned only when a request was made with an external ID
            token. Omitted otherwise, including if the request used a Pismo
            account ID token, even if an external account ID was previously
            stored.
        account_id:
          type: string
          description: >-
            Pismo account ID. Returned only when the request was authenticated
            with a Pismo account ID token. Omitted otherwise.
          example: '8080'
    InterestAmount:
      type: number
      format: double
      description: Amount in the `interest_by_tier`
      example: 1000
    InterestBenchmark:
      type: string
      description: >
        Market index used to measure interest value over time. For fixed
        interest, this field must be null.
          - `BOE`: Bank of England, UK
          - `DI`: Interbank Deposit Contract, Brazil
          - `FED`: Federal Reserve System, USA
          - `RBA`: Reserve Bank of Australia
          - `RBI`: Reserve Bank of India
          - `TO`: Overnight Interbank Target Rate (Tasa Objetivo), Mexico
      enum:
        - BOE
        - DI
        - FED
        - RBA
        - RBI
        - TO
      example: FED
    InterestByTiers:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InterestByTiersType'
        tier_calculation:
          $ref: '#/components/schemas/InterestTierCalculation'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/InterestByTiersArrayObject'
      required:
        - type
        - tier_calculation
        - tiers
      description: Interest by tiers configuration
      example:
        type: TERM
        tier_calculation: RETROACTIVE
        tiers:
          - days: 30
            amount: 1000
            margin_rate: 1
            fixed_interest_rate: 1.2
          - days: 60
            amount: 2000
            margin_rate: 1
            fixed_interest_rate: 1.3
    InterestByTiersArrayObject:
      type: object
      properties:
        days:
          $ref: '#/components/schemas/InterestDays'
        amount:
          $ref: '#/components/schemas/InterestAmount'
        margin_rate:
          $ref: '#/components/schemas/InterestMarginRate'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestFixedInterestRate'
      description: Tier details for interest calculation
    InterestByTiersType:
      type: string
      description: >
        Interest type

        - `TERM`: Interest rate varies according to the period of time since the
        deposit was made.

        - `AMOUNT`: Interest rate varies according to the current balance.
      enum:
        - TERM
        - AMOUNT
      example: TERM
    InterestCapitalizationFrequency:
      type: string
      description: Interest payout frequency
      enum:
        - DAILY
        - MONTHLY
        - QUARTERLY
        - HALF_YEARLY
        - YEARLY
        - MATURITY
      example: DAILY
    InterestDays:
      type: integer
      format: int32
      description: Number of days in `interest_by_tier`
      example: 30
    InterestFeeProcessingCode:
      type: string
      format: number
      description: >-
        Processing code configured in the [fee model](doc:fee-model) for
        charging a tax, penalty, or fee.
      example: '001100'
    InterestFixedInterestRate:
      type: number
      format: double
      description: >-
        Fixed annual interest rate for investments or deposits. If a `benchmark`
        value is provided, this field must be `null`. Otherwise, this field is
        required.
      example: 0.1
    InterestMargin:
      type: number
      format: double
      description: >
        Also known as a spread, this is an incremental rate the clients receive
        on investments or deposits.

        If a `benchmark` value is provided, this field is optional.

        If `benchmark` is null, this field must be null also.
      example: 0.02
    InterestMarginRate:
      type: number
      format: double
      description: >-
        Rate linked to the benchmark rate. For example, for 110% FED, margin
        rate is 110%. If a `benchmark` value is not provided, this field must be
        `null`. Otherwise, this field is required.
      example: 1.1
    InterestPlan:
      type: object
      description: >-
        `external_interest_plan_id` is omitted for interest plans created
        outside of the bank link workflow.
      required:
        - interest_plan_id
        - accrual_basis
        - accrual_frequency
        - capitalization_frequency
        - currency_code
        - description
        - interest_type
        - start_date
      properties:
        accrual_basis:
          $ref: '#/components/schemas/InterestPlanAccrualBasis'
        accrual_frequency:
          $ref: '#/components/schemas/InterestPlanAccrualFrequency'
        capitalization_frequency:
          $ref: '#/components/schemas/InterestPlanCapitalizationFrequency'
        currency_code:
          $ref: '#/components/schemas/CurrencyNumericCode'
        description:
          $ref: '#/components/schemas/InterestPlanDescription'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        interest_type:
          $ref: '#/components/schemas/InterestPlanInterestType'
        start_date:
          $ref: '#/components/schemas/InterestPlanPlanStartDate'
        benchmark:
          $ref: '#/components/schemas/InterestPlanBenchmarkResponse'
        division_code:
          allOf:
            - $ref: '#/components/schemas/DivisionCode'
          description: >-
            Code of the division the interest plan accrues by. Omitted when the
            interest plan uses the default division.
        division_id:
          $ref: '#/components/schemas/InterestPlanDivisionId'
        external_interest_plan_id:
          $ref: '#/components/schemas/ExternalInterestPlanId'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestPlanFixedInterestRate'
        interest_base_model:
          $ref: '#/components/schemas/InterestPlanInterestBaseModel'
        interest_by_tiers:
          $ref: '#/components/schemas/InterestPlanInterestByTiers'
        interest_thresholds:
          $ref: '#/components/schemas/InterestPlanInterestThresholds'
        margin:
          $ref: '#/components/schemas/InterestPlanMargin'
        margin_rate:
          $ref: '#/components/schemas/InterestPlanMarginRate'
        operation_type:
          $ref: '#/components/schemas/InterestPlanOperationType'
        status:
          $ref: '#/components/schemas/InterestPlanStatus'
        tax_withholding:
          $ref: '#/components/schemas/InterestPlanTaxWithholding'
    InterestPlanAccrualBasis:
      type: string
      description: |
        Method used to calculate interest accrual.
          * `BD_252`: Calculates daily interest using a 252-day year and the actual number of business days in each time period.
          * `ACTUAL_360`: Calculates daily interest using a 360-day year and the actual number of days in each time period.
          * `ACTUAL_365`: Calculates daily interest using a 365-day year and the actual number of days in each time period.
          * `ACTUAL_ACTUAL`: Calculates daily interest using the actual number of days in the year (which in the leap year is 366) and the actual number of days in each time period.
      enum:
        - BD_252
        - ACTUAL_360
        - ACTUAL_365
        - ACTUAL_ACTUAL
      example: ACTUAL_365
    InterestPlanAccrualFrequency:
      type: string
      description: Interest accrual frequency
      enum:
        - DAILY
        - MONTHLY
        - QUARTERLY
        - HALF_YEARLY
        - YEARLY
        - MATURITY
      example: DAILY
    InterestPlanAmount:
      type:
        - number
        - 'null'
      format: double
      description: Amount in the `interest_by_tier`
      example: 1000
    InterestPlanBenchmark:
      type: string
      description: >
        Market index used to measure interest value over time. For fixed
        interest, this field must be null.
          - `BOE`: Bank of England, UK
          - `DI`: Interbank Deposit Contract, Brazil
          - `FED`: Federal Reserve System, USA
          - `RBA`: Reserve Bank of Australia
          - `RBI`: Reserve Bank of India
          - `TO`: Overnight Interbank Target Rate (Tasa Objetivo), Mexico
      enum:
        - BOE
        - DI
        - FED
        - RBA
        - RBI
        - TO
      example: FED
    InterestPlanBenchmarkResponse:
      type: string
      description: |
        Market index returned in responses.
          - `BOE`: Bank of England, UK
          - `DI`: Interbank Deposit Contract, Brazil
          - `FED`: Federal Reserve System, USA
          - `FIXED`: Fixed interest rate, no market index
          - `RBA`: Reserve Bank of Australia
          - `RBI`: Reserve Bank of India
          - `TO`: Overnight Interbank Target Rate (Tasa Objetivo), Mexico
      enum:
        - BOE
        - DI
        - FED
        - FIXED
        - RBA
        - RBI
        - TO
      example: FIXED
    InterestPlanCapEffectiveRate:
      type: number
      format: double
      description: >-
        Cap effective rate. If you pass a value for `cap_effective_rate`, you
        must also pass a value for `cap_threshold`.
      example: 1.2
    InterestPlanCapitalizationFrequency:
      type: string
      description: Interest payout frequency
      enum:
        - DAILY
        - MONTHLY
        - QUARTERLY
        - HALF_YEARLY
        - YEARLY
        - MATURITY
      example: DAILY
    InterestPlanCapThreshold:
      type: number
      format: double
      description: >-
        Cap threshold value. If you pass a value for `cap_threshold`, you must
        also pass a value for `cap_effective_rate`.
      example: 1.1
    InterestPlanDays:
      type:
        - integer
        - 'null'
      format: int32
      description: Number of days in `interest_by_tier`
      example: 30
    InterestPlanDescription:
      type: string
      minLength: 1
      maxLength: 128
      description: Interest plan name
      example: Banking plan
    InterestPlanDivisionId:
      type: string
      maxLength: 256
      description: >-
        Pismo division ID the interest plan accrues by, or `DEFAULT_DIVISION`
        when it uses the default division
      example: d9b2c9e1-4633-4a10-841b-270f7f1493cd
    InterestPlanFeeProcessingCode:
      type: string
      description: >-
        Processing code configured in the [fee model](doc:fee-model) for
        charging a tax, penalty, or fee.
      example: '001100'
    InterestPlanFixedInterestRate:
      type:
        - number
        - 'null'
      format: double
      description: >
        Nominal annual interest rate, expressed as a decimal fraction. 0.10 =
        10% per year. 1.00 = 100% per year. Do not send 10 for 10%. Maximum
        precision: 8 decimal places. The platform converts this annual rate to
        the accrual period using `accrual_basis` and `interest_type`.


        If you pass a value for `benchmark`, this field must be null. Otherwise,
        it's required.
      example: 0.1
    InterestPlanFloorEffectiveRate:
      type: number
      format: double
      description: Floor effective rate
      example: 2.2
    InterestPlanFloorThreshold:
      type: number
      format: double
      description: Floor threshold value
      example: 2.1
    InterestPlanId:
      type: string
      format: uuid
      description: Pismo-generated interest plan ID
      example: 07d84f79-3027-47bd-b628-65528ccc8fb2
    InterestPlanInterestBaseModel:
      type: string
      description: >-
        Interest calculation model. `CLOSING_BALANCE` calculates interest on a
        single end-of-day balance snapshot. `BALANCE_CHANGE` calculates interest
        on each intraday balance movement (for example, credits and debits) as
        it occurs, so interest accrues on the balance held during each interval
        between consecutive movements rather than on one end-of-day figure.
        Defaults to `CLOSING_BALANCE`.
      enum:
        - CLOSING_BALANCE
        - BALANCE_CHANGE
      default: CLOSING_BALANCE
      example: CLOSING_BALANCE
    InterestPlanInterestByTiers:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/InterestPlanInterestByTiersType'
        tier_calculation:
          $ref: '#/components/schemas/InterestPlanTierCalculation'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/InterestPlanInterestByTiersArrayObject'
      required:
        - type
        - tier_calculation
        - tiers
      description: Interest by tiers configuration
      example:
        type: TERM
        tier_calculation: RETROACTIVE
        tiers:
          - days: 30
            amount: 1000
            margin_rate: 1
            fixed_interest_rate: 1.2
          - days: 60
            amount: 2000
            margin_rate: 1
            fixed_interest_rate: 1.3
    InterestPlanInterestByTiersArrayObject:
      type: object
      properties:
        days:
          $ref: '#/components/schemas/InterestPlanDays'
        amount:
          $ref: '#/components/schemas/InterestPlanAmount'
        margin_rate:
          $ref: '#/components/schemas/InterestPlanMarginRate'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestPlanFixedInterestRate'
      description: Tier details for interest calculation
    InterestPlanInterestByTiersType:
      type: string
      description: >
        Interest type

        - `TERM`: Interest rate varies according to the period of time since the
        deposit was made.

        - `AMOUNT`: Interest rate varies according to the current balance.
      enum:
        - TERM
        - AMOUNT
      example: TERM
    InterestPlanInterestThresholds:
      type: object
      properties:
        cap_threshold:
          $ref: '#/components/schemas/InterestPlanCapThreshold'
        cap_effective_rate:
          $ref: '#/components/schemas/InterestPlanCapEffectiveRate'
        floor_threshold:
          $ref: '#/components/schemas/InterestPlanFloorThreshold'
        floor_effective_rate:
          $ref: '#/components/schemas/InterestPlanFloorEffectiveRate'
      description: Cap and floor thresholds for the interest plan
      example:
        cap_threshold: 1.1
        cap_effective_rate: 1.2
        floor_threshold: 2.2
        floor_effective_rate: 2.1
    InterestPlanInterestType:
      type: string
      description: >
        Interest calculation type

        - `SIMPLE`: Calculated on the original deposit or investment value.

        - `COMPOUND`: Calculated on the original value plus the last accumulated
        interest.
      enum:
        - SIMPLE
        - COMPOUND
      example: SIMPLE
    InterestPlanMargin:
      type: number
      format: double
      description: >
        Additive spread, in the same unit and period as the benchmark rate:
        nominal annual, decimal fraction. If `benchmark` is 0.025 and `margin`
        is 0.0225, the resulting annual rate is 0.0475.


        If you pass a value for `benchmark`, this field is optional. If
        `benchmark` is null, this field must be null also.
      example: 0.02
    InterestPlanMarginRate:
      type:
        - number
        - 'null'
      format: double
      description: >
        Multiplier applied to the benchmark rate, expressed as a decimal
        fraction of 100%. 1.00 = 100% of the benchmark. 1.10 = 110% of the
        benchmark. 0.95 = 95% of the benchmark. This is not added to the
        benchmark—use `margin` for an additive spread.


        If you don't pass a value for `benchmark`, this field must be null.
        Otherwise, it's required.
      example: 1.1
    InterestPlanOperationType:
      type: string
      description: |
        Operation type.
        - `DEBIT`: Interest plan for debit type operations
        - `CREDIT`: Interest plan for credit type operations
      enum:
        - DEBIT
        - CREDIT
      example: DEBIT
    InterestPlanPage:
      type: object
      properties:
        current_page:
          type: integer
          format: int32
          description: Current page
          example: 1
        items:
          type: array
          description: List of interest plan versions on the current page
          items:
            $ref: '#/components/schemas/InterestPlan'
        pages:
          type: integer
          format: int32
          description: Number of pages
          example: 1
        per_page:
          type: integer
          format: int32
          description: Maximum items per page
          example: 10
        total_items:
          type: integer
          format: int32
          description: Total number of items
          example: 1
    InterestPlanPlanStartDate:
      type: string
      format: date
      description: Date to start applying the interest plan. Format = YYYY-MM-DD.
      example: '2025-06-17'
    InterestPlanStartDateForNewVersion:
      type: string
      format: date
      description: >-
        Date to start applying the new interest plan version. Format =
        YYYY-MM-DD. Must be greater than or equal to current date.
      example: '2025-06-17'
    InterestPlanStatus:
      type: string
      description: Interest plan status. Must be set to `ACTIVE`.
      enum:
        - ACTIVE
      example: ACTIVE
    InterestPlanTaxRule:
      type: object
      description: A single tax rule applied within a tax withholding configuration.
      required:
        - description
        - fixed_percentage
      properties:
        description:
          type: string
          maxLength: 128
          description: Description of the tax rule.
          example: IOF
        fixed_percentage:
          type: number
          format: double
          description: Fixed percentage applied by the tax rule.
          example: 0.0038
        threshold_amount:
          type:
            - number
            - 'null'
          format: double
          description: >-
            Optional monetary threshold amount associated with the tax rule. Use
            null when the rule does not depend on a threshold.
          example: null
    InterestPlanTaxWithholding:
      type: object
      description: >
        Tax withholding configuration. Replaces the standalone
        `fee_processing_code` field.

        Conditional rules enforced at creation/update time:

        - `ACCRUAL`: `fee_processing_code` is required; `tax_rules` must be
        omitted.

        - `CAPITALIZATION`: `tax_rules` is required; `fee_processing_code` must
        be omitted.

        - Omitted `withholding_moment`: both `fee_processing_code` and
        `tax_rules` must be omitted.

        In responses, legacy plans that predate this field may return
        `fee_processing_code` without `withholding_moment`.
      properties:
        withholding_moment:
          $ref: '#/components/schemas/InterestPlanWithholdingMoment'
        fee_processing_code:
          $ref: '#/components/schemas/InterestPlanFeeProcessingCode'
        tax_rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InterestPlanTaxRule'
    InterestPlanTierCalculation:
      type: string
      description: >
        Tier calculation method

        - `RETROACTIVE`: Interest is recalculated from the beginning based on
        the new applicable rate.

        - `NON_RETROACTIVE`: Interest is calculated progressively based on each
        layer rate.
      enum:
        - RETROACTIVE
        - NON_RETROACTIVE
      example: RETROACTIVE
    InterestPlanWithholdingMoment:
      type: string
      description: Moment at which tax is withheld. When omitted, no withholding applies.
      enum:
        - ACCRUAL
        - CAPITALIZATION
      example: ACCRUAL
    InterestTaxesExemption:
      type: boolean
      description: Is the account exempt from taxes?
      example: true
    InterestTaxRule:
      type: object
      description: A single tax rule applied within a tax withholding configuration.
      required:
        - description
        - fixed_percentage
      properties:
        description:
          type: string
          maxLength: 128
          description: Description of the tax rule.
          example: IOF
        fixed_percentage:
          type: number
          format: double
          description: Fixed percentage applied by the tax rule.
          example: 0.0038
        threshold_amount:
          type: number
          format: double
          description: Amount threshold above which the tax rule applies.
          example: 1000
    InterestTaxWithholding:
      type: object
      description: >
        Tax withholding configuration. Replaces the standalone
        `fee_processing_code` field.

        Conditional rules enforced at creation/update time:

        - `ACCRUAL`: `fee_processing_code` is required; `tax_rules` must be
        omitted.

        - `CAPITALIZATION`: `tax_rules` is required; `fee_processing_code` must
        be omitted.

        - Omitted `withholding_moment`: both `fee_processing_code` and
        `tax_rules` must be omitted.

        In GET responses, legacy plans that predate this field may return
        `fee_processing_code` with a null `withholding_moment`.
      required:
        - withholding_moment
      properties:
        withholding_moment:
          $ref: '#/components/schemas/InterestWithholdingMoment'
        fee_processing_code:
          $ref: '#/components/schemas/InterestFeeProcessingCode'
        tax_rules:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/InterestTaxRule'
    InterestTierCalculation:
      type: string
      description: >
        Tier calculation method

        - `RETROACTIVE`: Interest is recalculated from the beginning based on
        the new applicable rate.

        - `NON-RETROACTIVE`: Interest is calculated progressively based on each
        layer rate.
      enum:
        - RETROACTIVE
        - NON-RETROACTIVE
      example: RETROACTIVE
    InterestWithholdingMoment:
      type: string
      description: Moment at which tax is withheld. When omitted, no withholding applies.
      enum:
        - ACCRUAL
        - CAPITALIZATION
      example: ACCRUAL
    PayoutAccount:
      properties:
        label:
          type: string
          description: Label to identify the account
          example: My payout account
        type:
          type: string
          description: Payout account type, either `INTERNAL` or `EXTERNAL`
          enum:
            - INTERNAL
            - EXTERNAL
          example: INTERNAL
        external_account_id:
          type: string
          minLength: 1
          maxLength: 60
          description: >
            External account ID of the Pismo account that receives the payments.
            This is the destination account, not the account in the
            `x-external-account-id` header.

            Required for type `INTERNAL` and not allowed for `EXTERNAL`.
          example: ext-acct-002
        external_account:
          type: object
          description: >
            Contains user-defined key-value pairs that identify the external
            account receiving the payments.

            Note that external account information is client-provided.

             Required for type `EXTERNAL` and not allowed for `INTERNAL`
          example:
            key: value
      type: object
    PenaltySimulationRequest:
      type: object
      required:
        - withdrawal_datetime
      properties:
        withdrawal_amount:
          type: number
          format: double
          description: >
            The amount the customer intends to withdraw. When omitted, the
            system fetches the current book balance from Bank Statements API.
            When provided, it must not exceed the current book balance.
          example: 5000
        withdrawal_datetime:
          type: string
          format: date-time
          description: Simulated withdrawal date in ISO 8601 format.
          example: '2026-06-15T00:00:00Z'
    PenaltySimulationResponse:
      type: object
      properties:
        external_account_id:
          type: string
          description: >-
            External account identifier of the resolved account. Returned only
            when the account has an external account identifier.
          example: a4070788-bbe3-4127-8abc-12345
        withdrawal_amount:
          type: number
          format: double
          description: >-
            The withdrawal amount used in the simulation (equals book_balance
            when omitted in request)
          example: 40667.17
        withdrawal_datetime:
          type: string
          format: date-time
          description: The withdrawal date used in the simulation in ISO 8601 format.
          example: '2026-12-15T00:00:00Z'
        penalty_rule_applied:
          type: array
          description: >
            List of penalty rules that applies to the withdrawal, omitted if no
            penalties apply.
          items:
            $ref: '#/components/schemas/DepositPenaltyRuleApplied'
        penalty_amount:
          type: number
          format: double
          description: >-
            The total penalty amount applied to the withdrawal, combining all
            relevant penalty rules.
          example: 231.75
        penalty_breakdown:
          $ref: '#/components/schemas/DepositPenaltyBreakdown'
        currency:
          type: string
          description: >-
            The currency in ISO 4217 alphabetic format, omitted if no penalty
            applies.
          example: BRL
        gross_amount:
          type: number
          format: double
          description: >
            The gross amount of the deposit account, calculated as the sum of
            the total balance without interest plus the total interest earned.
            Always present; 0 when no total record exists.
          example: 41329.34
        interest_earned_amount:
          type: number
          format: double
          description: >
            The total interest earned (paid/capitalized) on the account. Always
            present; 0 when no total record exists.
          example: 667.17
        net_amount:
          type: number
          format: double
          description: >
            The net amount after deducting penalties from the gross amount:
            `gross_amount - penalty_amount`.
          example: 41097.59
        simulation_datetime:
          type: string
          format: date-time
          description: >-
            The date and time of the simulation, formatted according to ISO
            8601.
          example: '2026-06-19T19:22:55Z'
    ProcessingCode:
      type: string
      minLength: 1
      maxLength: 6
      description: >
        A processing code identifies a financial operation on the Pismo
        platform. Processing codes need to be mapped to transaction type codes
        to create a transaction flow. 


        A custom processing code is created with a `PENDING` status . Initially,
        its use is not allowed in authorizations. Once the transaction flow for
        a custom processing code is completely configured, its status changes to
        `SUCCESS` and it is ready for use. 


        For more information, refer to [Processing
        codes](doc:processing-codes-and-transaction-types)
    ProcessingCodeBalanceImpact:
      type: integer
      format: int64
      description: |
        Balance impact associated with processing code:
          * `1` - Credit 
          * `0` - No impact. Zero balance operations have no impact. Zero balance customers are responsible for settling accounts and generating transactions.
          * `-1` - Debit
      enum:
        - 1
        - 0
        - -1
      x-enum-varnames:
        - ProcessingCodeBalanceImpactCredit
        - ProcessingCodeBalanceImpactNoImpact
        - ProcessingCodeBalanceImpactDebit
      example: 1
    ProcessingCodeCreateTranslation:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/ProcessingCodeTranslatedLanguage'
        description:
          type: string
          maxLength: 50
          description: Translated description
        reversal_description:
          type: string
          maxLength: 50
          description: Translated reversal translated description
        partial_reversal_description:
          type: string
          maxLength: 50
          description: Translated partial reversal description
    ProcessingCodeDetail:
      type: object
      required:
        - balance_impact
        - description
        - org_operation_id
        - processing_code
        - standard
        - status
        - type
      properties:
        balance_impact:
          $ref: '#/components/schemas/ProcessingCodeBalanceImpact'
        description:
          $ref: '#/components/schemas/ProcessingCodePcDescription'
        org_operation_id:
          $ref: '#/components/schemas/ProcessingCodeOrgOperationID'
        processing_code:
          $ref: '#/components/schemas/ProcessingCode'
        standard:
          $ref: '#/components/schemas/ProcessingCodeStandard'
        status:
          $ref: '#/components/schemas/ProcessingCodeStatus'
        type:
          $ref: '#/components/schemas/ProcessingCodeType'
        partial_reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodePartialReversalProcessingCode'
        reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodeReversalProcessingCode'
        tags:
          $ref: '#/components/schemas/ProcessingCodeTags'
        translations:
          $ref: '#/components/schemas/ProcessingCodeTranslations'
    ProcessingCodeOrgOperationID:
      type: integer
      format: int64
      description: Org operation ID
    ProcessingCodePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          description: List of processing codes on the current page
          items:
            $ref: '#/components/schemas/ProcessingCodeDetail'
        count:
          type: integer
          format: int32
          description: Number of processing codes on the current page
          example: 1
        has_next:
          type: boolean
          description: Is there a next page?
          example: false
        next_cursor:
          type: string
          description: >-
            Cursor of the next page, to pass as `cursor`. Omitted on the last
            page.
          example: eyJQSyI6IlROLTEjV0YwMDAxIn0=
    ProcessingCodePartialReversalDescription:
      type: string
      maxLength: 50
      description: >
        Partial reversal description. **REQUIRED** if
        `partial_reversal_processing_code` does not exist.
      example: Partial reversal description
    ProcessingCodePartialReversalProcessingCode:
      type: string
      minLength: 1
      maxLength: 6
      description: >
        Partial reversal processing code. Processing code for partial reversal
        cancellation. Used in transactions and accounting flow to post the
        correct entries related to partial cancellation. 


        Every `AUTHORIZATION` processing code is **REQUIRED** to have a reversal
        and a partial reversal processing code. If a partial code isn't
        provided, a default one is assigned based on `balance_impact`. 


        For more information, refer to [default reversal processing
        codes](doc:processing-codes-and-transaction-types#default-reversal-processing-codes).
      example: '578739'
    ProcessingCodePcDescription:
      type: string
      minLength: 1
      maxLength: 50
      description: Processing code description
    ProcessingCodeReversalDescription:
      type: string
      maxLength: 50
      description: >
        Reversal description. If not passed, it is automatically set to "REV "
        plus the `description` field. If `description` is between 47–50
        characters, `reversal_description` is truncated from the end to fit 50
        characters.


        For example, if `description` is "Purchase", `reversal_description` is
        set to "REV Purchase".
      example: Reversal description
    ProcessingCodeReversalProcessingCode:
      type: string
      minLength: 1
      maxLength: 6
      pattern: ^[a-zA-Z0-9]+$
      description: >
        Reversal processing code. Processing code for cancellation. Used in
        transactions and accounting flow to post the correct entries related to
        cancellation. 


        Every `AUTHORIZATION` processing code is **REQUIRED** to have a reversal
        and a partial reversal processing code. If a partial code isn't
        provided, a default one is assigned based on `balance_impact`. 


        The reversal processing code can either currently exist or not. If it
        exists, its `balance_impact` must be the opposite of the main processing
        code and its type must be `REVERSAL`.


        For more information, refer to [default reversal processing
        codes](doc:processing-codes-and-transaction-types#default-reversal-processing-codes).
      example: '578739'
    ProcessingCodeStandard:
      type: boolean
      description: >
        Is this a standard processing code?  A standard processing code, as
        opposed to a custom one, is one that is pre-defined for every
        organization on the Pismo platform. 


        For more information, refer to [Standard processing
        codes](doc:processing-codes-and-transaction-types#standard-processing-codes).   
      example: true
    ProcessingCodeStatus:
      type: string
      description: |
        Processing code status:
          * `PENDING` - Missing required configurations. A custom processing code is initially created with a `PENDING` status and its use is not allowed in authorizations. Once the transaction flow for a custom processing code is completely configured, its status changes to `SUCCESS` and it is ready for use. All standard processing codes have a `SUCCESS` status.

          * `SUCCESS` - Required configurations done
      enum:
        - SUCCESS
        - PENDING
      example: SUCCESS
    ProcessingCodeTags:
      type: array
      description: >
        Processing code tags.  These tags apply **ONLY** to `AUTHORIZATION` type
        processing codes. You cannot add tags to reverse processing codes as
        they may be associated with more than one authorization processing code.
      items:
        type: string
        description: Processing code tag.
        enum:
          - GLOBAL
          - BRAZIL
          - ARGENTINA
          - INDIA
          - NETWORK
          - VISA
          - MASTERCARD
          - ELO
          - RUPAY
          - TECBAN
          - UPI
          - PIX
          - FPS
          - TRANSACTION_BANKING
          - BNPL
          - LENDING
          - DEPRECATED
        example: INDIA
    ProcessingCodeTranslatedLanguage:
      type: string
      description: >
        Translation language. 


        For example, the code for English (United States) is `en-US`. The
        prefix, `en`, is a language code following the ISO 639-1 standard. The
        suffix, `US`, is a country code following the ISO 3166-1 Alpha-2
        standard.
      example: en-US
    ProcessingCodeTranslation:
      type: object
      properties:
        language:
          $ref: '#/components/schemas/ProcessingCodeTranslatedLanguage'
        description:
          type: string
          maxLength: 50
          description: Translated description
    ProcessingCodeTranslations:
      type: array
      description: Processing code descriptions translation in different languages
      items:
        $ref: '#/components/schemas/ProcessingCodeTranslation'
    ProcessingCodeType:
      type: string
      description: |
        Processing code type:
          * `AUTHORIZATION` - Processing code used in authorizations. Only `AUTHORIZATION` processing codes have tags, and a reversal and a partial reversal processing code.

          * `REVERSAL` - Processing code used to cancel or partially cancel an `AUTHORIZATION` processing code.
      enum:
        - AUTHORIZATION
        - REVERSAL
      example: AUTHORIZATION
    ProductId:
      type: string
      format: uuid
      description: Pismo-generated product ID
      example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
    Program:
      type: object
      required:
        - country_code
        - currency_numeric_code
        - external_program_id
        - name
        - program_id
        - timezone
        - type
      properties:
        country_code:
          $ref: '#/components/schemas/ProgramCountryCode'
        currency_numeric_code:
          $ref: '#/components/schemas/CurrencyNumericCode'
        external_program_id:
          $ref: '#/components/schemas/ExternalId'
        name:
          $ref: '#/components/schemas/ProgramName'
        program_id:
          $ref: '#/components/schemas/ProgramId'
        timezone:
          $ref: '#/components/schemas/ProgramTimezone'
        type:
          $ref: '#/components/schemas/ProgramType'
        created_datetime:
          type: string
          format: date-time
          description: Program creation date and time, in RFC 3339 format
          example: '2026-10-26T13:11:05Z'
        language:
          $ref: '#/components/schemas/ProgramLanguage'
        status:
          type: string
          enum:
            - ACTIVE
            - PENDING
          description: >
            Program status:

            * `ACTIVE` — PCI settings and accounting stages are configured

            * `PENDING` — PCI settings and accounting stages are not configured.
            The program is not ready for use.
          example: ACTIVE
    ProgramCountryCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: >-
        [ISO 3166-1 alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)
        country code
      example: USA
    ProgramFeeModelAttachment:
      type: object
      description: >-
        `external_fee_model_id` is omitted when the attached fee model was
        created outside of the bank link workflow.
      required:
        - external_program_id
        - program_id
        - fee_model_id
      properties:
        external_program_id:
          $ref: '#/components/schemas/ExternalId'
        fee_model_id:
          $ref: '#/components/schemas/FeeModelId'
        program_id:
          $ref: '#/components/schemas/ProgramId'
        external_fee_model_id:
          $ref: '#/components/schemas/ExternalFeeModelId'
    ProgramId:
      type: integer
      format: int64
      description: Pismo-generated program ID
      example: 12345
    ProgramLanguage:
      type: string
      enum:
        - en-US
        - pt-BR
      description: Program language. Default = `en-US`.
      example: en-US
    ProgramName:
      type: string
      minLength: 1
      maxLength: 50
      description: Program name
      example: Certificate of deposit program
    ProgramPage:
      type: object
      properties:
        current_page:
          type: integer
          format: int32
          description: Current page
          example: 1
        items:
          type: array
          description: List of programs on the current page
          items:
            $ref: '#/components/schemas/Program'
        pages:
          type: integer
          format: int32
          description: Number of pages
          example: 1
        per_page:
          type: integer
          format: int32
          description: Maximum items per page
          example: 10
        total_items:
          type: integer
          format: int32
          description: Total number of items
          example: 1
    ProgramTimezone:
      type: string
      description: >-
        Program timezone in the [IANA time zone
        database](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones)
        "Region/City" format.
      example: America/Chicago
    ProgramType:
      type: string
      description: >
        Program type:

        * `CREDITO` — Full balance credit accounts

        * `PRE-PAGO` — Full balance prepaid accounts

        * `DEBITO` — Full balance debit accounts

        * `MERCHANT` — Merchant accounts

        * `CREDITO ZERO-BALANCE` — Zero balance credit accounts

        * `PRE-PAGO ZERO-BALANCE` — Zero balance prepaid accounts

        * `DEBITO ZERO-BALANCE` — Zero balance debit accounts

        * `CURRENT ACCOUNTS` — Current accounts

        * `INTERNAL ACCOUNTS` — Internal accounts

        * `CORRESPONDENT ACCOUNTS` — Correspondent accounts

        * `VOUCHER` — Prepaid voucher meal/food card


        For more information, refer to [Program
        types](https://developers.pismo.io/pismo-docs/docs/program-types).
      enum:
        - CREDITO
        - PRE-PAGO
        - DEBITO
        - MERCHANT
        - CREDITO ZERO-BALANCE
        - PRE-PAGO ZERO-BALANCE
        - DEBITO ZERO-BALANCE
        - CURRENT ACCOUNTS
        - INTERNAL ACCOUNTS
        - CORRESPONDENT ACCOUNTS
        - VOUCHER
      example: CURRENT ACCOUNTS
    SavingsAccountAttachRequest:
      type: object
      required:
        - product_id
      properties:
        product_id:
          type: string
          description: Product ID
          example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
        metadata:
          type: object
          description: >
            The metadata object contains user-defined key-value pairs that offer
            additional context or custom information.<br>

            The platform has no control over its content, it's controlled by the
            user.<br>


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only. For sensitive data, use
            the specific parameters designed for that purpose. For more
            information, refer to [Get started with Pismo
            APIs](ref:get-started-with-pismo-apis#metadata).
          example:
            key: value
    UnifiedDepositOpenRequest:
      type: object
      required:
        - deposit_attachment
      description: >-
        Creates or locates a deposit account and attaches a deposit product in a
        single request.
      properties:
        deposit_attachment:
          $ref: '#/components/schemas/UnifiedOpenDepositAttachment'
        account_creation:
          $ref: '#/components/schemas/UnifiedOpenAccountCreation'
        metadata:
          type: object
          description: >
            The metadata object contains user-defined key-value pairs that
            provide additional context or custom information.<br>

            Metadata content is not controlled by the Pismo platform and is
            instead controlled by the user.<br>


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only. For sensitive data, use
            the specific parameters designed for that purpose. For more
            information, refer to [Get started with Pismo
            APIs](ref:get-started-with-pismo-apis).
          example:
            key: value
    UnifiedDepositOpenResponse:
      type: object
      description: >-
        Response returned after successfully opening a deposit account and
        attaching a product
      properties:
        account_id:
          type: integer
          format: int64
          description: Pismo account ID (new or existing)
          example: 123456
        deposit_configs:
          type: object
          description: Deposit configuration after attachment
          properties:
            maturity_period:
              $ref: '#/components/schemas/DepositMaturityPeriod'
            renewal_term:
              type: object
              description: >-
                Renewal term configuration, present only when the override
                includes a renewal term
              properties:
                renewal_calendar_maturity_date:
                  type: string
                  format: date
                  description: Explicit renewal maturity date, in `YYYY-MM-DD` format
                  example: '2028-06-15'
                unit:
                  $ref: '#/components/schemas/DepositMaturityPeriodUnit'
                value:
                  $ref: '#/components/schemas/DepositMaturityPeriodValue'
        external_account_id:
          type: string
          description: External account ID
          example: ext-acct-001
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: External product ID of the attached deposit product
        product_id:
          type: string
          description: Product ID of the attached deposit product
          example: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
    UnifiedOpenAccountCreation:
      type: object
      required:
        - external_program_id
        - division_code
        - applicant
      description: >
        Account creation parameters. Required to create a new account, and
        omitted to attach the deposit to an existing account.

        Pismo platform uses these fields to create a new transaction banking
        account via the transaction banking API.
      properties:
        applicant:
          $ref: '#/components/schemas/UnifiedOpenApplicant'
        division_code:
          type: string
          description: Division code for the new account
          example: '001'
        external_program_id:
          $ref: '#/components/schemas/ExternalId'
        currency_code:
          type: string
          description: >-
            ISO 4217 currency code for the account. If omitted, the default
            currency for the program is used.
          example: USD
    UnifiedOpenApplicant:
      type: object
      required:
        - document_number
        - name
      description: Applicant information for account creation
      properties:
        document_number:
          type: string
          description: >-
            Applicant document number. For example, CPF or the US social
            security number.
          example: '12345678900'
        name:
          type: string
          description: Applicant's full name
          example: John Doe
    UnifiedOpenDepositAttachment:
      type: object
      required:
        - external_product_id
      description: Deposit product attachment configuration
      properties:
        external_product_id:
          allOf:
            - $ref: '#/components/schemas/ExternalProductId'
          description: External product ID of the deposit product to attach
        deposit_configs:
          $ref: '#/components/schemas/DepositConfigs'
    UpdateAccountAttachmentRequest:
      type: object
      required:
        - deposit_configs
      properties:
        deposit_configs:
          type: object
          description: >-
            At least one of `maturity_period`, `overrides` or
            `interest_capitalization_mode` must be provided.
          properties:
            maturity_period:
              allOf:
                - $ref: '#/components/schemas/DepositMaturityPeriod'
              description: >
                Term in force, recalculated from the attachment's
                `effective_date`. The resolved maturity date must be today or
                later, otherwise the request returns `400`.


                Accepts `unit` + `value` or `calendar_maturity_date`, which are
                mutually exclusive. An empty object or omission leave the term
                unchanged.


                The response returns `unit`, `value`, and
                `calendar_maturity_date` populated together. A request sent with
                `calendar_maturity_date` comes back as `unit: DAYS` and the
                number of days.
            interest_capitalization_mode:
              type:
                - string
                - 'null'
              enum:
                - PAYOUT
                - REINVEST
                - null
              description: >
                How capitalized interest is treated on this attachment:

                * `PAYOUT`: Requires the attachment to already have a
                `payout_account`, otherwise the request returns `400`. Set it
                first with `PATCH /apex/v1/account/deposits/payout-account`.

                * `REINVEST`: The capitalized amount is added to the principal.

                * Omitted: The current mode is kept.

                * `null`: Clears the account-level value and restores the
                program value, then the product default. When no level defines
                it, `REINVEST` applies.


                Applies only to the capitalization flow. The maturity
                instruction flow always uses `payout_account`.
              example: REINVEST
            overrides:
              allOf:
                - $ref: '#/components/schemas/DepositAttachmentOverridesRequest'
              minProperties: 1
              description: >
                Account-level overrides to update. Every override and penalty
                type follows three-state semantics: omit it to keep the current
                value, send `null` to remove the override and restore the
                inherited configuration, or send a value to replace it. The
                object must contain at least one field.
    UpdateAccountRequest:
      type: object
      minProperties: 1
      description: Transaction banking account fields to update
      properties:
        applicant:
          type: object
          minProperties: 1
          description: Applicant data to update
          properties:
            custom_fields:
              type: object
              description: >-
                Name-value fields for any account-related data your organization
                needs to store at Pismo. The values can be validated against the
                JSON schema stored in the division referenced by
                `division_code`.
              example:
                product_id: 1
        division_code:
          type: string
          maxLength: 36
          description: >-
            Client-provided code that identifies the division within the
            organization. Contains only letters, numbers, and hyphens.
          example: my-division
        external_program_id:
          allOf:
            - $ref: '#/components/schemas/ExternalId'
          description: >-
            External program ID of the program to move the account to. The
            program must belong to the organization and be bound to the
            division. The new program must have the same type and currency as
            the current one.
    UpdateAccountStatusRequest:
      type: object
      description: >
        Status update payload. You must provide `status`, `reason_external_id`,
        or both.
      properties:
        status:
          type: string
          pattern: ^[A-Z_]+$
          minLength: 1
          maxLength: 9
          description: >
            New status for the account. Must not be a final status or a status
            defined in the account's dormancy configuration.
          example: DORMANT
        reason_external_id:
          type: string
          minLength: 1
          maxLength: 120
          description: External reason ID specifying account restrictions.
          example: CREDIT_ONLY
        update_children:
          type: boolean
          description: >-
            Should the status of all account children linked through
            `parent_account_id` be updated also?
          example: true
        metadata:
          type: object
          description: >
            Key-value pairs relating to the status change, propagated in the
            Account status changed event. This data is not persisted.


            **Note**: This field must not be used to send Personally
            Identifiable Information (PII), Payment Card Industry (PCI) data, or
            any sensitive/regulated information. Metadata fields are intended
            for operational, non-sensitive data only.
          example:
            key: value
    UpdateDepositProductRequest:
      type: object
      description: >-
        Only `status`, `reason`, `min_amount`, `notices` and
        `accrue_during_grace_period` can change, and at least one of `status`,
        `min_amount`, `notices` and `accrue_during_grace_period` must be sent.
        Any other field fails with `400`.
      minProperties: 1
      additionalProperties: false
      properties:
        status:
          type: string
          description: New deposit product status
          enum:
            - CREATED
            - ACTIVE
            - INACTIVE
          example: ACTIVE
        reason:
          type: string
          maxLength: 128
          description: Reason for the status change. Required when `status` is sent.
          example: Product approved
        min_amount:
          $ref: '#/components/schemas/DepositProductMinAmount'
        notices:
          $ref: '#/components/schemas/DepositProductNotices'
        accrue_during_grace_period:
          $ref: '#/components/schemas/DepositProductAccrueDuringGracePeriod'
    UpdateDivisionRequest:
      type: object
      description: >-
        Only `external_hierarchy_id`, `external_hierarchy_level_id`, `name`,
        `parent_division_code`, `description`, `timezone`,
        `external_program_ids` and `schema` can change. Any other field,
        including `division_code`, fails with `400`.
      minProperties: 1
      additionalProperties: false
      properties:
        description:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 80
          description: >-
            Division description. Omit it to keep the current description, or
            send `null` to clear it.
          example: NY - New York City
        external_hierarchy_id:
          $ref: '#/components/schemas/ExternalHierarchyId'
        external_hierarchy_level_id:
          $ref: '#/components/schemas/ExternalHierarchyLevelId'
        external_program_ids:
          $ref: '#/components/schemas/DivisionExternalProgramIds'
        name:
          $ref: '#/components/schemas/DivisionName'
        parent_division_code:
          $ref: '#/components/schemas/DivisionParentCode'
        schema:
          $ref: '#/components/schemas/DivisionSchemaCreateTransactionBankingAccount'
        timezone:
          type:
            - string
            - 'null'
          minLength: 1
          description: >-
            Division timezone in timezone database format. Omit it to keep the
            current timezone, or send `null` to clear it, so the division
            inherits the timezone of its parent division, or UTC if no parent
            division has one.
          example: America/New_York
    UpdateFeeModelRequest:
      type: object
      description: >-
        Replaces `model_description` and `fees`. Any other field fails with
        `400`.
      additionalProperties: false
      required:
        - model_description
        - fees
      properties:
        model_description:
          $ref: '#/components/schemas/FeeModelDescription'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/FeeModelFee'
    UpdateHierarchyRequest:
      type: object
      description: >-
        Only `name` can change. Any other field, including
        `external_hierarchy_id` or `levels`, fails with `400`.
      required:
        - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/HierarchyName'
    UpdateInterestPlanRequest:
      type: object
      description: >-
        Requires `start_date` and at least one of `description`,
        `fixed_interest_rate`, `margin_rate`, `margin`, `interest_by_tiers` and
        `interest_thresholds`. Any other field fails with `400`.
      minProperties: 2
      additionalProperties: false
      required:
        - start_date
      properties:
        start_date:
          $ref: '#/components/schemas/InterestPlanStartDateForNewVersion'
        description:
          $ref: '#/components/schemas/InterestPlanDescription'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestPlanFixedInterestRate'
        margin:
          $ref: '#/components/schemas/InterestPlanMargin'
        margin_rate:
          $ref: '#/components/schemas/InterestPlanMarginRate'
        interest_by_tiers:
          $ref: '#/components/schemas/InterestPlanInterestByTiers'
        interest_thresholds:
          $ref: '#/components/schemas/InterestPlanInterestThresholds'
    UpdatePayoutAccountRequest:
      type: object
      required:
        - payout_account
      properties:
        payout_account:
          $ref: '#/components/schemas/PayoutAccount'
    UpdatePayoutAccountResponse:
      type: object
      properties:
        payout_account:
          $ref: '#/components/schemas/PayoutAccount'
        updated_datetime:
          type: string
          format: date-time
          description: The date and time when the payout account was updated
          example: '2024-01-23T13:26:25Z'
    UpdateProcessingCodeRequest:
      type: object
      description: >-
        Only `description`, `reversal_processing_code`,
        `partial_reversal_processing_code`, `tags` and `translations` can
        change. Any other field fails with `400`.
      minProperties: 1
      additionalProperties: false
      properties:
        description:
          $ref: '#/components/schemas/ProcessingCodePcDescription'
        partial_reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodePartialReversalProcessingCode'
        reversal_processing_code:
          $ref: '#/components/schemas/ProcessingCodeReversalProcessingCode'
        tags:
          $ref: '#/components/schemas/ProcessingCodeTags'
        translations:
          $ref: '#/components/schemas/ProcessingCodeTranslations'
    UpdateProgramRequest:
      type: object
      description: >-
        Only `name`, `timezone` and `language` can change. Any other field fails
        with `400`.
      minProperties: 1
      additionalProperties: false
      properties:
        language:
          $ref: '#/components/schemas/ProgramLanguage'
        name:
          $ref: '#/components/schemas/ProgramName'
        timezone:
          $ref: '#/components/schemas/ProgramTimezone'
  responses:
    AccountingScriptUnexpectedResponse:
      description: |
        * `EAPX0120`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0120
            message: the Pismo platform answered outside its contract
    AccountUnexpectedResponse:
      description: |
        * `EAPX0040`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0040
            message: the Pismo platform answered outside its contract
    CreationUnconfirmed:
      description: >
        * `EAPX0030`: the creation isn't confirmed: retry with the same body
        after the `Retry-After` delay
      headers:
        Retry-After:
          description: Seconds to wait before retrying with the same body
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0030
            message: >-
              the creation isn't confirmed: retry with the same body after the
              `Retry-After` delay
    DepositProductUnexpectedResponse:
      description: |
        * `EAPX0090`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0090
            message: the Pismo platform answered outside its contract
    DivisionUnexpectedResponse:
      description: |
        * `EAPX0100`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0100
            message: the Pismo platform answered outside its contract
    FeeModelUnexpectedResponse:
      description: |
        * `EAPX0060`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0060
            message: the Pismo platform answered outside its contract
    GatewayTimeout:
      description: |
        * `EAPX0020`: the Pismo platform didn't answer in time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0020
            message: the Pismo platform didn't answer in time
    HierarchyUnexpectedResponse:
      description: |
        * `EAPX0110`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0110
            message: the Pismo platform answered outside its contract
    InterestPlanUnexpectedResponse:
      description: |
        * `EAPX0080`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0080
            message: the Pismo platform answered outside its contract
    InternalError:
      description: |
        * `EAPX0000`: Apex failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0000
            message: Apex failed
    InternalOrPlatformError:
      description: |
        * `EAPX0000`: Apex failed
        * `EAPX0010`: the Pismo platform failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0000
            message: Apex failed
    ProcessingCodeUnexpectedResponse:
      description: |
        * `EAPX0070`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0070
            message: the Pismo platform answered outside its contract
    ProgramUnexpectedResponse:
      description: |
        * `EAPX0050`: the Pismo platform answered outside its contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: EAPX0050
            message: the Pismo platform answered outside its contract
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /apex/v1/programs:
    post:
      tags:
        - Programs
      summary: Create program [beta]
      description: >
        Create a program with a client-defined `external_program_id`. The
        `external_program_id` must be unique within the organization and cannot
        be changed after the program is created. The Pismo platform generates
        the `program_id`, and responses return both IDs.


        This endpoint generates a [Program
        created](https://developers.pismo.io/events/docs/programs-creation-1)
        event.


        Notes:


        * Creating with an `external_program_id` that's already in use creates
        nothing: the endpoint returns the response of the first creation with
        `200`, whatever the body. Use [Get program](ref:apex-v1-get-program) to
        read the program's current state.

        * If the Pismo platform doesn't confirm the creation in time, the
        request fails with `504` and the code `EAPX0030`. Retry with the same
        body after the `Retry-After` delay: the retry returns the program if
        Apex saved it, or creates it. If the Pismo platform created the program
        but didn't answer in time, the retry can create a second program, and
        the first one is left without an external ID.
      operationId: apex-v1-create-program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
            examples:
              currentAccounts:
                summary: Create current accounts program
                value:
                  external_program_id: PSM-PROGRAM-01
                  name: Certificate of deposit program
                  type: CURRENT ACCOUNTS
                  timezone: America/Chicago
                  currency_numeric_code: '840'
                  country_code: USA
      responses:
        '200':
          description: >-
            A program with this `external_program_id` was already created.
            Returns the response of the first creation, whatever the request
            body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
              examples:
                success:
                  summary: Successful response
                  value:
                    program_id: 12345
                    external_program_id: PSM-PROGRAM-01
                    name: Certificate of deposit program
                    type: CURRENT ACCOUNTS
                    timezone: America/Chicago
                    currency_numeric_code: '840'
                    country_code: USA
                    language: en-US
                    status: ACTIVE
                    created_datetime: '2026-10-26T13:11:05Z'
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the program with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform rejected the program with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: >
            * `WAPX0020`: the Pismo platform rejected the program with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            * `WAPX0020`: the Pismo platform rejected the program with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          description: |
            * `EAPX0010`: the Pismo platform failed to create the program
            * `EAPX0050`: the Pismo platform answered outside its contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            * `EAPX0010`: the Pismo platform failed to create the program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          $ref: '#/components/responses/CreationUnconfirmed'
    get:
      tags:
        - Programs
      summary: List programs [beta]
      description: >
        List the organization's programs. Filter by `name`, `type` or
        `external_program_id`. Results are paginated; use `page` and `per_page`.
      operationId: apex-v1-list-programs
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/perPageQuery'
        - $ref: '#/components/parameters/programNameQuery'
        - $ref: '#/components/parameters/programTypeQuery'
        - $ref: '#/components/parameters/externalProgramIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramPage'
        '400':
          description: >
            * `WAPX0000`: a query parameter breaks the spec

            * `WAPX0020`: the Pismo platform rejected the search with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProgramUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/programs/{externalProgramId}:
    get:
      tags:
        - Programs
      summary: Get program [beta]
      description: >
        Get a program identified by an external program ID. Returns `404` with
        the code `WAPX0040` if no program has this external program ID.
      operationId: apex-v1-get-program
      parameters:
        - $ref: '#/components/parameters/externalProgramIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          description: >
            * `WAPX0000`: the external program ID in the path breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0040`: no program has the external program ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProgramUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    patch:
      tags:
        - Programs
      summary: Update program [beta]
      description: >
        Update a program identified by an external program ID. You can update
        only `name`, `timezone` and `language`. Passing any other field,
        including `program_id`, `external_program_id` or `type`, returns `400`
        with the code `WAPX0000`.


        On success, the Pismo platform generates a [Program
        updated](https://developers.pismo.io/events/docs/programs-update-1)
        event.
      operationId: apex-v1-update-program
      parameters:
        - $ref: '#/components/parameters/externalProgramIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProgramRequest'
            examples:
              rename:
                summary: Rename program
                value:
                  name: Certificate of deposit program 2026
      responses:
        '200':
          description: Program updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          description: >
            * `WAPX0000`: the body or the external program ID in the path breaks
            the spec, like an empty body or a field that can't be updated

            * `WAPX0020`: the Pismo platform rejected the update with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0040`: no program has the external program ID in the path

            * `WAPX0020`: the Pismo platform rejected the update with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/ProgramUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/programs/{externalProgramId}/fee-models/attachment:
    get:
      tags:
        - Programs
      summary: Get program fee model attachment [beta]
      description: >
        Get the fee model attached to a program identified by an external
        program ID. If the fee model was created outside of the bank link
        workflow, `external_fee_model_id` is omitted.
      operationId: apex-v1-get-program-fee-model
      parameters:
        - $ref: '#/components/parameters/externalProgramIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramFeeModelAttachment'
        '400':
          description: >
            * `WAPX0000`: the external program ID in the path breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0010`: the program has no fee model attached
            * `WAPX0040`: no program has the external program ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    put:
      tags:
        - Programs
      summary: Replace program fee model attachment [beta]
      description: >
        Attach a fee model to a program, both identified by external IDs. A
        program has at most one fee model attached, so attaching a different fee
        model replaces the current one. Attaching the fee model that is already
        attached changes nothing and returns `200` with the attachment, so the
        request is safe to retry.


        Returns `404` with the code `WAPX0040` if no program has the external
        program ID in the path, or `400` with the code `WAPX0051` if no fee
        model has the `external_fee_model_id` in the body.
      operationId: apex-v1-attach-program-fee-model
      parameters:
        - $ref: '#/components/parameters/externalProgramIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachProgramFeeModelRequest'
            examples:
              attach:
                summary: Attach fee model to program
                value:
                  external_fee_model_id: PSM-FEE-MODEL-01
      responses:
        '200':
          description: Fee model attached, or it was already attached to the program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramFeeModelAttachment'
        '400':
          description: >
            * `WAPX0000`: the body or the external program ID in the path breaks
            the spec

            * `WAPX0020`: the Pismo platform rejected the attachment with a code
            Apex doesn't map yet

            * `WAPX0051`: no fee model has the `external_fee_model_id` in the
            body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform rejected the attachment with a code
            Apex doesn't map yet

            * `WAPX0040`: no program has the external program ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      tags:
        - Programs
      summary: Delete program fee model attachment [beta]
      description: >
        Remove the fee model attachment from a program identified by an external
        program ID. The fee model itself is not deleted.
      operationId: apex-v1-detach-program-fee-model
      parameters:
        - $ref: '#/components/parameters/externalProgramIdPath'
      responses:
        '204':
          description: No Content
        '400':
          description: >
            * `WAPX0000`: the external program ID in the path breaks the spec

            * `WAPX0020`: the Pismo platform rejected the detachment with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0010`: the program has no fee model attached
            * `WAPX0040`: no program has the external program ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/processing-codes:
    post:
      tags:
        - Processing codes
      summary: Create processing code [beta]
      description: >
        Create a custom `AUTHORIZATION` processing code. The client chooses the
        `processing_code`, which identifies the processing code in every bank
        link operation, so processing codes have no separate external ID.


        This endpoint generates an [Orgs operation
        created](https://developers.pismo.io/events/docs/orgs-operation-create-1)
        event.


        The response returns the processing code, the reversal and partial
        reversal processing codes linked to it, and its status. Use [Get
        processing code](ref:apex-v1-get-processing-code) for the full
        processing code, including the `org_operation_id` the Pismo platform
        generates.


        Notes:


        * The processing code is created with the `PENDING` status. It can't be
        used in authorizations until its transaction flow is configured.

        * A `reversal_processing_code` or `partial_reversal_processing_code`
        that doesn't exist is created as a `REVERSAL` processing code, with
        `reversal_description` or `partial_reversal_description`. One that
        exists must be a `REVERSAL` processing code with the opposite
        `balance_impact`. If `partial_reversal_processing_code` is omitted, a
        default one is assigned based on `balance_impact`.

        * Creating a processing code that already exists creates nothing: the
        endpoint returns the existing processing code with `200`, whatever the
        body. A retry of a request that succeeded or timed out gets the same
        `200`. Use [Get processing code](ref:apex-v1-get-processing-code) for
        the full processing code.
      operationId: apex-v1-create-processing-code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessingCodeRequest'
            examples:
              debitPurchase:
                summary: Create a debit processing code
                value:
                  processing_code: WF0001
                  balance_impact: -1
                  description: Domestic POS purchase
                  reversal_processing_code: WF0002
                  reversal_description: REV Domestic POS purchase
                  partial_reversal_processing_code: WF0003
                  partial_reversal_description: Partial REV Domestic POS purchase
                  tags:
                    - TRANSACTION_BANKING
      responses:
        '200':
          description: >-
            A processing code with this `processing_code` already exists.
            Returns it, whatever the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProcessingCodeResponse'
        '201':
          description: Processing code created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProcessingCodeResponse'
              examples:
                success:
                  summary: Successful response
                  value:
                    processing_code: WF0001
                    reversal_processing_code: WF0002
                    partial_reversal_processing_code: WF0003
                    status: PENDING
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet, like a standard processing code or one that
            starts with `PSM`, a `processing_code` equal to its reversal or
            partial reversal processing code, an existing reversal or partial
            reversal processing code that isn't `REVERSAL` or has the wrong
            `balance_impact`, or a concurrent request creating the same
            processing code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProcessingCodeUnexpectedResponse'
        '504':
          description: >
            * `EAPX0020`: the Pismo platform didn't answer in time, so the
            processing code may have been created: retry with the same body,
            which returns it with `200` if it was
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Processing codes
      summary: List processing codes [beta]
      description: >
        List the organization's processing codes: standard and custom,
        `AUTHORIZATION` and `REVERSAL`. Results are paginated with a cursor:
        pass the previous page's `next_cursor` as `cursor`. The last page has
        `has_next` set to `false` and no `next_cursor`. When no processing code
        matches, the response is `200` with an empty `items`, never `404`.


        Filter by `processing_code` to get a one-item list, or an empty list if
        the organization has no such processing code.
      operationId: apex-v1-list-processing-codes
      parameters:
        - $ref: '#/components/parameters/limitQuery'
        - $ref: '#/components/parameters/cursorQuery'
        - $ref: '#/components/parameters/processingCodeQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingCodePage'
        '400':
          description: >
            * `WAPX0000`: a query parameter breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet, like an invalid `cursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProcessingCodeUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/processing-codes/{processingCode}:
    get:
      tags:
        - Processing codes
      summary: Get processing code [beta]
      description: >
        Get a processing code. Returns `404` if the organization has no such
        processing code.
      operationId: apex-v1-get-processing-code
      parameters:
        - $ref: '#/components/parameters/processingCodePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingCodeDetail'
        '400':
          description: >
            * `WAPX0000`: the processing code in the path breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0010`: no processing code has the code in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProcessingCodeUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    patch:
      tags:
        - Processing codes
      summary: Update processing code [beta]
      description: >
        Update a processing code. Only the fields sent change. You can update
        only `description`, `reversal_processing_code`,
        `partial_reversal_processing_code`, `tags` and `translations`. Passing
        any other field, including `processing_code` or `balance_impact`,
        returns `400`.


        On success, the Pismo platform generates an [Orgs operation
        updated](https://developers.pismo.io/events/docs/orgs-operation-update-1)
        event.


        Notes:


        * `tags` replaces the current tags. It's ignored on a `REVERSAL`
        processing code.

        * `translations` adds or replaces the description of each language sent,
        and keeps the other languages.

        * A new `reversal_processing_code` or `partial_reversal_processing_code`
        must exist, be a `REVERSAL` processing code and have the opposite
        `balance_impact`. Linking one that isn't `SUCCESS` moves the processing
        code back to `PENDING`.
      operationId: apex-v1-update-processing-code
      parameters:
        - $ref: '#/components/parameters/processingCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessingCodeRequest'
            examples:
              rename:
                summary: Change the description
                value:
                  description: Domestic POS purchase 2026
      responses:
        '204':
          description: Processing code updated
        '400':
          description: >
            * `WAPX0000`: the path or the body breaks the spec, like a field
            that can't change

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet, like a new reversal or partial reversal
            processing code that doesn't exist, isn't `REVERSAL`, has the wrong
            `balance_impact` or equals the processing code, or a change to the
            reversal processing codes of a `REVERSAL` processing code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0010`: no processing code has the code in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            * `WAPX0150`: another request changed the processing code at the
            same time; retry the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProcessingCodeUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/fee-models:
    post:
      tags:
        - Fee models
      summary: Create fee model [beta]
      description: >
        Create a fee model with a client-defined `external_fee_model_id`. The
        `external_fee_model_id` must be unique within the organization and
        cannot be changed after the fee model is created. The Pismo platform
        generates the `fee_model_id`, and responses return both IDs.


        Notes:


        * Creating with an `external_fee_model_id` that's already in use creates
        nothing: the endpoint returns the response of the first creation with
        `200`, whatever the body. Use [Get fee model](ref:apex-v1-get-fee-model)
        to read the fee model's current state.

        * If the Pismo platform doesn't confirm the creation in time, the
        request fails with `504` and the code `EAPX0030`. Retry with the same
        body after the `Retry-After` delay: the retry returns the fee model if
        Apex saved it, or creates it. If the Pismo platform created the fee
        model but didn't answer in time, the retry can create a second fee
        model, and the first one is left without an external ID.


        A fee model is a collection of fees with custom calculations. For more
        information, see the [Fee model](doc:fee-model) guide. To apply a fee
        model, [attach it to a program](ref:apex-v1-attach-program-fee-model).


        An accumulator fee model requires you call the [Create accumulator
        configuration](ref:post-v1-accumulator-config) endpoint first to define
        how transaction totals are kept.
      operationId: apex-v1-create-fee-model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeeModelRequest'
            examples:
              fixed:
                summary: Create fixed fee model
                value:
                  external_fee_model_id: PSM-FEE-MODEL-01
                  model_description: Fee model to org
                  fees:
                    - description: Fee wdl
                      type: dom
                      id: dom_wdl
                      deduct_from_transaction_value: true
                      calculation_basis: PRINCIPAL_AMOUNT
                      calculation:
                        calculation_method: FIXED
                        value: 30
                      filters:
                        processing_codes:
                          - '02'
                          - '0040'
      responses:
        '200':
          description: >-
            A fee model with this `external_fee_model_id` was already created.
            Returns the response of the first creation, whatever the request
            body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeModel'
        '201':
          description: Fee model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeModel'
              examples:
                success:
                  summary: Successful response
                  value:
                    fee_model_id: d290f1ee-6c54-4b01-90e6-d701748f0851
                    external_fee_model_id: PSM-FEE-MODEL-01
                    model_description: Fee model to org
                    fees:
                      - description: Fee wdl
                        type: dom
                        id: dom_wdl
                        deduct_from_transaction_value: true
                        calculation_basis: PRINCIPAL_AMOUNT
                        calculation:
                          calculation_method: FIXED
                          value: 30
                        filters:
                          processing_codes:
                            - '02'
                            - '0040'
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the fee model with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/CreationUnconfirmed'
    get:
      tags:
        - Fee models
      summary: List fee models [beta]
      description: >
        List the organization's fee models, most recently updated first. Filter
        by `external_fee_model_id`. Results are paginated; use `page` and
        `per_page`. The Pismo platform returns no page data, so the page only
        has `items`: a page with fewer than `per_page` items is the last one.


        Fee models created outside of the bank link workflow are listed without
        `external_fee_model_id`.
      operationId: apex-v1-list-fee-models
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/feeModelsPerPageQuery'
        - $ref: '#/components/parameters/externalFeeModelIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeModelPage'
        '400':
          description: >
            * `WAPX0000`: a query parameter breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/fee-models/{externalFeeModelId}:
    get:
      tags:
        - Fee models
      summary: Get fee model [beta]
      description: >
        Get a fee model identified by an external fee model ID. Returns `404`
        with the code `WAPX0050` if no fee model has this external fee model ID.
      operationId: apex-v1-get-fee-model
      parameters:
        - $ref: '#/components/parameters/externalFeeModelIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeModel'
        '400':
          description: >
            * `WAPX0000`: the external fee model ID in the path breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0050`: no fee model has the external fee model ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    put:
      tags:
        - Fee models
      summary: Update fee model [beta]
      description: >
        Update a fee model identified by an external fee model ID. This
        operation has full-replacement semantics: every request must send the
        complete `model_description` and `fees`. Passing any other field,
        including `fee_model_id` or `external_fee_model_id`, returns `400` with
        the code `WAPX0000`. Returns `404` with the code `WAPX0050` if no fee
        model has this external fee model ID.
      operationId: apex-v1-update-fee-model
      parameters:
        - $ref: '#/components/parameters/externalFeeModelIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeeModelRequest'
            examples:
              fixed:
                summary: Update fixed fee value
                value:
                  model_description: Updated Fee Model
                  fees:
                    - description: Fee wdl
                      type: dom
                      id: dom_wdl
                      deduct_from_transaction_value: true
                      calculation_basis: PRINCIPAL_AMOUNT
                      calculation:
                        calculation_method: FIXED
                        value: 35
                      filters:
                        processing_codes:
                          - '02'
                          - '0040'
      responses:
        '200':
          description: Fee model updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeModel'
        '400':
          description: >
            * `WAPX0000`: the body or the external fee model ID in the path
            breaks the spec

            * `WAPX0020`: the Pismo platform rejected the fee model with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0050`: no fee model has the external fee model ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/FeeModelUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/hierarchies:
    post:
      tags:
        - Hierarchies
      summary: Create hierarchy [beta]
      description: >
        Create a hierarchy and its levels. The client chooses the
        `external_hierarchy_id` of the hierarchy and the
        `external_hierarchy_level_id` of each level, which must be unique within
        the organization and cannot be changed after the hierarchy is created.
        The Pismo platform generates the `hierarchy_id` and the
        `hierarchy_level_id` of each level, and responses return both IDs.


        This endpoint generates a [Corporate hierarchy
        created](https://developers.pismo.io/events/docs/corporate-hierarchy-creation-1)
        event.


        A hierarchy is typically used to organize
        [divisions](ref:apex-v1-create-division) along territorial lines:
        headquarters > countries > regions > branches, and so on. Each level has
        an `index`, `0` for the root level.


        Notes:


        * `levels` has 1 to 10 levels, with sequential `index` values starting
        at `0` and no repeats. Levels can't be added, removed or changed after
        the hierarchy is created.

        * Two levels can't have the same `external_hierarchy_level_id` (`400`,
        `WAPX0092`), and an `external_hierarchy_level_id` already used by
        another hierarchy fails with `409` and the code `WAPX0091`.

        * Creating with an `external_hierarchy_id` that's already in use creates
        nothing: the endpoint returns the response of the first creation with
        `200`, whatever the body. Use [Get hierarchy](ref:apex-v1-get-hierarchy)
        to read the hierarchy's current state.

        * If the Pismo platform doesn't confirm the creation in time, the
        request fails with `504` and the code `EAPX0030`. Retry with the same
        body after the `Retry-After` delay: the retry returns the hierarchy if
        Apex saved it, or creates it. If the Pismo platform created the
        hierarchy but didn't answer in time, the retry can create a second
        hierarchy, and the first one is left without an external ID.
      operationId: apex-v1-create-hierarchy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHierarchyRequest'
            examples:
              territorial:
                summary: Create a two-level hierarchy
                value:
                  external_hierarchy_id: PSM-HIERARCHY-01
                  name: Hierarchy One
                  levels:
                    - external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-00
                      index: 0
                      name: Central
                      description: Root level
                    - external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-01
                      index: 1
                      name: Region
                      description: Regional level
      responses:
        '200':
          description: >-
            A hierarchy with this `external_hierarchy_id` was already created.
            Returns the response of the first creation, whatever the request
            body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hierarchy'
        '201':
          description: Hierarchy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hierarchy'
              examples:
                success:
                  summary: Successful response
                  value:
                    external_hierarchy_id: PSM-HIERARCHY-01
                    hierarchy_id: 9bb95e15-c0e6-4c84-b644-350c76a83358
                    name: Hierarchy One
                    levels:
                      - external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-00
                        hierarchy_level_id: df48f983-c906-4bb3-83c7-ac2e18babb59
                        index: 0
                        name: Central
                        description: Root level
                      - external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-01
                        hierarchy_level_id: 7d574f66-ebd0-4b83-85a1-98ce7569e5c3
                        index: 1
                        name: Region
                        description: Regional level
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the hierarchy with a code
            Apex doesn't map yet, for example because no level has `index` `0`,
            two levels have the same `index`, or the `index` values aren't
            sequential

            * `WAPX0092`: two levels in the body have the same
            `external_hierarchy_level_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            * `WAPX0091`: a hierarchy level with one of the
            `external_hierarchy_level_id` values already belongs to another
            hierarchy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/HierarchyUnexpectedResponse'
        '504':
          $ref: '#/components/responses/CreationUnconfirmed'
    get:
      tags:
        - Hierarchies
      summary: List hierarchies [beta]
      description: >
        List the organization's hierarchies and their levels. Results are
        paginated with a cursor: pass the previous page's `pagination.cursor` as
        `cursor`. The last page has no `pagination.cursor`.


        Filter by `external_hierarchy_id` to get a one-item list, or an empty
        list if no hierarchy has this external hierarchy ID. With this filter,
        `limit` and `cursor` are ignored.


        Hierarchies and hierarchy levels created outside Apex are listed without
        their external IDs.
      operationId: apex-v1-list-hierarchies
      parameters:
        - $ref: '#/components/parameters/externalHierarchyIdQuery'
        - $ref: '#/components/parameters/corporateLimitQuery'
        - $ref: '#/components/parameters/corporateCursorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HierarchyPage'
        '400':
          description: >
            * `WAPX0000`: `external_hierarchy_id`, `limit` or `cursor` breaks
            the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet, for example because `cursor` is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/HierarchyUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/hierarchies/{externalHierarchyId}:
    get:
      tags:
        - Hierarchies
      summary: Get hierarchy [beta]
      description: >
        Get a hierarchy and its levels, identified by an external hierarchy ID.
        Returns `404` with the code `WAPX0080` if no hierarchy has this external
        hierarchy ID.
      operationId: apex-v1-get-hierarchy
      parameters:
        - $ref: '#/components/parameters/externalHierarchyIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hierarchy'
        '400':
          description: |
            * `WAPX0000`: the external hierarchy ID in the path breaks the spec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0080`: no hierarchy has the external hierarchy ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/HierarchyUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    patch:
      tags:
        - Hierarchies
      summary: Update hierarchy [beta]
      description: >
        Update the name of a hierarchy identified by an external hierarchy ID.
        Only `name` can change: passing any other field, including
        `external_hierarchy_id`, `hierarchy_id` or `levels`, returns `400` with
        the code `WAPX0000`. Returns `404` with the code `WAPX0080` if no
        hierarchy has this external hierarchy ID.


        Notes:


        * Levels can't be added, removed or changed after the hierarchy is
        created.

        * Sending the same update again succeeds.
      operationId: apex-v1-update-hierarchy
      parameters:
        - $ref: '#/components/parameters/externalHierarchyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHierarchyRequest'
            examples:
              rename:
                summary: Change the name
                value:
                  name: Hierarchy One 2026
      responses:
        '204':
          description: Hierarchy updated
        '400':
          description: >
            * `WAPX0000`: the external hierarchy ID in the path or the body
            breaks the spec, for example because the body has a field other than
            `name`

            * `WAPX0020`: the Pismo platform rejected the hierarchy with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0080`: no hierarchy has the external hierarchy ID in the path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/HierarchyUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/divisions:
    post:
      tags:
        - Divisions
      summary: Create division [beta]
      description: >
        Create a division. The client chooses the `division_code`, which
        identifies the division in every Apex division operation, so divisions
        have no separate external ID. The `division_code` must be unique within
        the organization and cannot be changed after the division is created.
        The Pismo platform generates the `division_id`, and responses return
        both.


        This endpoint generates a [Corporate division
        created](https://developers.pismo.io/events/docs/corporate-division-creation-2)
        event.


        The division belongs to the hierarchy identified by
        `external_hierarchy_id`, at the level identified by
        `external_hierarchy_level_id`, and its accounts can use the programs
        identified by `external_program_ids`. Its parent is the division
        identified by `parent_division_code`, which must be at a level of the
        same hierarchy with a lower index.


        Notes:


        * If a division with this `division_code` already exists, the request
        fails with `409` and the code `WAPX0140`. This includes retrying a
        request that already succeeded or timed out: use [Get
        division](ref:apex-v1-get-division) to read the division created.
      operationId: apex-v1-create-division
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDivisionRequest'
            examples:
              regional:
                summary: Create a regional division
                value:
                  division_code: PSM-DIVISION-01
                  external_hierarchy_id: PSM-HIERARCHY-01
                  external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-01
                  name: North America
                  parent_division_code: PSM-DIVISION-00
                  description: North American regional division
                  timezone: America/Los_Angeles
                  external_program_ids:
                    - PSM-PROGRAM-01
                    - PSM-PROGRAM-02
      responses:
        '201':
          description: Division created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Division'
              examples:
                success:
                  summary: Successful response
                  value:
                    division_code: PSM-DIVISION-01
                    division_id: 6f8a456a-8b1a-4022-a2f8-7612595330b5
                    external_hierarchy_id: PSM-HIERARCHY-01
                    hierarchy_id: 9bb95e15-c0e6-4c84-b644-350c76a83358
                    external_hierarchy_level_id: PSM-HIERARCHY-LEVEL-01
                    hierarchy_level_id: 7d574f66-ebd0-4b83-85a1-98ce7569e5c3
                    name: North America
                    parent_division_code: PSM-DIVISION-00
                    description: North American regional division
                    timezone: America/Los_Angeles
                    external_program_ids:
                      - PSM-PROGRAM-01
                      - PSM-PROGRAM-02
                    program_ids:
                      - 12345
                      - 12346
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the division with a code
            Apex doesn't map yet, such as a hierarchy level outside the
            hierarchy, a parent division outside the hierarchy or at a level
            without a lower index, a hierarchy of another organization, an
            unknown program, or an invalid `timezone` or `schema`

            * `WAPX0041`: no program has one of the external program IDs in
            `external_program_ids`

            * `WAPX0081`: no hierarchy has the `external_hierarchy_id` in the
            body

            * `WAPX0090`: no hierarchy level has the
            `external_hierarchy_level_id` in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            * `WAPX0141`: no division has the `parent_division_code` in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            * `WAPX0140`: a division with this `division_code` already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DivisionUnexpectedResponse'
        '504':
          description: >
            * `EAPX0020`: the Pismo platform didn't answer in time, so the
            division may have been created: a retry then fails with `409` and
            `WAPX0140`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Divisions
      summary: List divisions [beta]
      description: >
        List the divisions of a hierarchy, filtered by `external_hierarchy_id`,
        or of a hierarchy level, filtered by `external_hierarchy_level_id`. Send
        exactly one of the two, unless you filter by `division_code`. An
        external ID that no hierarchy or hierarchy level has returns an empty
        list.


        Results are paginated with a cursor: pass the previous page's
        `pagination.cursor` as `cursor`. The last page has no
        `pagination.cursor`.


        Filter by `division_code` to get a one-item list, or an empty list if
        the organization has no such division. With this filter,
        `external_hierarchy_id` and `external_hierarchy_level_id` are optional,
        and the division is listed only if it belongs to the hierarchy and
        hierarchy level sent. `limit` and `cursor` are ignored.


        Without the `division_code` filter, items don't include `timezone` and
        `schema`: use [Get division](ref:apex-v1-get-division) to read them.
        Hierarchies, hierarchy levels and programs created outside Apex are
        listed without their external IDs.
      operationId: apex-v1-list-divisions
      parameters:
        - $ref: '#/components/parameters/externalHierarchyIdQuery'
        - $ref: '#/components/parameters/externalHierarchyLevelIdQuery'
        - $ref: '#/components/parameters/divisionCodeQuery'
        - $ref: '#/components/parameters/corporateLimitQuery'
        - $ref: '#/components/parameters/corporateCursorQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DivisionPage'
        '400':
          description: >
            * `WAPX0000`: a query parameter breaks the spec

            * `WAPX0020`: the Pismo platform rejected the filters with a code
            Apex doesn't map yet, such as both or neither of
            `external_hierarchy_id` and `external_hierarchy_level_id` sent
            without `division_code`, or an invalid `cursor`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform didn't find the parent division of
            the division in `division_code` with a code Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DivisionUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/divisions/{divisionCode}:
    get:
      tags:
        - Divisions
      summary: Get division [beta]
      description: >
        Get a division identified by its division code. Returns `404` with the
        code `WAPX0010` if the organization has no such division.


        Hierarchies, hierarchy levels and programs created outside Apex are
        returned without their external IDs.
      operationId: apex-v1-get-division
      parameters:
        - $ref: '#/components/parameters/divisionCodePath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Division'
        '400':
          description: |
            * `WAPX0000`: the division code in the path breaks the spec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0010`: the organization has no division with the division
            code in the path

            * `WAPX0020`: the Pismo platform didn't find the division's parent
            division with a code Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DivisionUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    patch:
      tags:
        - Divisions
      summary: Update division [beta]
      description: >
        Update a division identified by its division code. Only the fields sent
        change. You can update only `external_hierarchy_id`,
        `external_hierarchy_level_id`, `name`, `parent_division_code`,
        `description`, `timezone`, `external_program_ids` and `schema`. Passing
        any other field, including `division_code` or `division_id`, returns
        `400`.


        On success, the Pismo platform generates a [Corporate division
        updated](https://developers.pismo.io/events/docs/corporate-division-change-2)
        event.


        Notes:


        * `external_program_ids` replaces the current programs, and an empty
        array removes them.

        * `null` clears `description` or `timezone`, and an empty `schema`
        (`{}`) clears the schema.

        * A division with child divisions can't move to another hierarchy, and
        its level must keep a lower index than its child divisions' levels.

        * Sending the same update again succeeds.
      operationId: apex-v1-update-division
      parameters:
        - $ref: '#/components/parameters/divisionCodePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDivisionRequest'
            examples:
              rename:
                summary: Change the name
                value:
                  name: North America 2026
      responses:
        '204':
          description: Division updated
        '400':
          description: >
            * `WAPX0000`: the division code in the path or the body breaks the
            spec, including a field that can't be updated

            * `WAPX0020`: the Pismo platform rejected the update with a code
            Apex doesn't map yet, such as a hierarchy level outside the
            hierarchy, a parent division outside the hierarchy or at a level
            without a lower index, a division with child divisions moved to
            another hierarchy, a level without a lower index than the child
            divisions' levels, a hierarchy of another organization, an unknown
            program, an invalid `timezone` or `schema`, or a `name` with only
            spaces

            * `WAPX0041`: no program has one of the external program IDs in
            `external_program_ids`

            * `WAPX0081`: no hierarchy has the `external_hierarchy_id` in the
            body

            * `WAPX0090`: no hierarchy level has the
            `external_hierarchy_level_id` in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0010`: the organization has no division with the division
            code in the path

            * `WAPX0141`: no division has the `parent_division_code` in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DivisionUnexpectedResponse'
        '504':
          description: >
            * `EAPX0020`: the Pismo platform didn't answer in time, so the
            update may have been applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apex/v1/interest-plans:
    post:
      tags:
        - Interest plans
      summary: Create interest plan [beta]
      description: >
        Create an interest plan with a client-defined
        `external_interest_plan_id`. The `external_interest_plan_id` must be
        unique within the organization and cannot be changed after the interest
        plan is created. The Pismo platform generates the `interest_plan_id`,
        and responses return both IDs.


        This endpoint generates an [Interest plan creation
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-plan-creation-success-1)
        event.


        Notes:


        * Creating with an `external_interest_plan_id` that's already in use
        creates nothing: the endpoint returns the response of the first creation
        with `200`, whatever the body. Use [Get interest
        plan](ref:apex-v1-get-interest-plan) to read the interest plan's current
        state.

        * If the Pismo platform doesn't confirm the creation in time, the
        request fails with `504` and the code `EAPX0030`. Retry with the same
        body after the `Retry-After` delay: the retry returns the interest plan
        if Apex saved it, or creates it. If the Pismo platform created the
        interest plan but didn't answer in time, the retry can create a second
        interest plan, and the first one is left without an external ID.


        An interest plan defines how the platform accrues and pays interest. Its
        first version takes effect on `start_date`. To change it, [update the
        interest plan](ref:apex-v1-update-interest-plan), which adds a version.
      operationId: apex-v1-create-interest-plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterestPlanRequest'
            examples:
              benchmark:
                summary: Create interest plan based on a benchmark
                value:
                  external_interest_plan_id: PSM-INTEREST-PLAN-01
                  description: Banking plan
                  currency_code: '840'
                  accrual_basis: ACTUAL_365
                  accrual_frequency: DAILY
                  capitalization_frequency: DAILY
                  interest_type: COMPOUND
                  start_date: '2026-12-01'
                  benchmark: FED
                  margin_rate: 1.2
                  margin: 0.05
                  tax_withholding:
                    withholding_moment: ACCRUAL
                    fee_processing_code: '001100'
                  interest_base_model: CLOSING_BALANCE
      responses:
        '200':
          description: >-
            An interest plan with this `external_interest_plan_id` was already
            created. Returns the response of the first creation, whatever the
            request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPlan'
        '201':
          description: Interest plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPlan'
              examples:
                success:
                  summary: Successful response
                  value:
                    interest_plan_id: 07d84f79-3027-47bd-b628-65528ccc8fb2
                    external_interest_plan_id: PSM-INTEREST-PLAN-01
                    description: Banking plan
                    currency_code: '840'
                    accrual_basis: ACTUAL_365
                    accrual_frequency: DAILY
                    capitalization_frequency: DAILY
                    interest_type: COMPOUND
                    operation_type: CREDIT
                    status: ACTIVE
                    start_date: '2026-12-01'
                    benchmark: FED
                    margin_rate: 1.2
                    margin: 0.05
                    tax_withholding:
                      withholding_moment: ACCRUAL
                      fee_processing_code: '001100'
                    division_id: DEFAULT_DIVISION
                    interest_base_model: CLOSING_BALANCE
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the interest plan with a
            code Apex doesn't map yet, for example because it breaks one of
            these rules:
              * `fixed_interest_rate` is required without a `benchmark`, and not allowed with one
              * `margin_rate` is required with a `benchmark`, and `margin_rate` and `margin` are not allowed without one
              * `accrual_basis` must be `BD_252` with the `DI` benchmark
              * `accrual_frequency` must be lower than or equal to `capitalization_frequency`
              * `interest_by_tiers` takes `days` only with `TERM` and `amount` only with `AMOUNT`, without duplicates, and its rates follow the `benchmark` rules above
              * `interest_thresholds` can't be empty, and each threshold needs its effective rate
              * `tax_withholding` with `ACCRUAL` needs `fee_processing_code` and no `tax_rules`, with `CAPITALIZATION` needs `tax_rules` and no `fee_processing_code`, and without `withholding_moment` takes neither
            * `WAPX0142`: no division has the `division_code` in the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform rejected the interest plan with a
            code Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/InterestPlanUnexpectedResponse'
        '504':
          $ref: '#/components/responses/CreationUnconfirmed'
    get:
      tags:
        - Interest plans
      summary: List interest plans [beta]
      description: >
        List the organization's interest plans. Results are paginated; use
        `page` and `per_page`.


        Every version of an interest plan is a separate item with its own
        `start_date`, so an interest plan with several versions is listed once
        per version. Interest plans created outside of the bank link workflow
        are listed without `external_interest_plan_id`.
      operationId: apex-v1-list-interest-plans
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/interestPlansPerPageQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPlanPage'
        '400':
          description: >
            * `WAPX0000`: `page` or `per_page` breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet, for example because `page` is above `10000`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/InterestPlanUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/interest-plans/{externalInterestPlanId}:
    get:
      tags:
        - Interest plans
      summary: Get interest plan [beta]
      description: >
        Get an interest plan identified by an external interest plan ID. An
        interest plan has one version per `start_date`, and the endpoint returns
        the version in effect today (UTC). Pass `version_date` to get the
        version in effect on another date, such as a version that starts in the
        future.
      operationId: apex-v1-get-interest-plan
      parameters:
        - $ref: '#/components/parameters/externalInterestPlanIdPath'
        - $ref: '#/components/parameters/versionDateQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPlan'
        '400':
          description: >
            * `WAPX0000`: the external interest plan ID in the path or
            `version_date` breaks the spec

            * `WAPX0020`: the Pismo platform rejected the request with a code
            Apex doesn't map yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0060`: no interest plan has the external interest plan ID in
            the path

            * `WAPX0062`: the interest plan has no version in effect on
            `version_date`, for example because its first version starts later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/InterestPlanUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    patch:
      tags:
        - Interest plans
      summary: Update interest plan [beta]
      description: >
        Update an interest plan identified by an external interest plan ID. The
        update creates a version of the interest plan that takes effect on
        `start_date`, which must be today (UTC) or later. The fields sent
        replace the ones of the version in effect today, and the fields not sent
        keep their values. The response is the new version.


        You can update only `description`, `fixed_interest_rate`, `margin_rate`,
        `margin`, `interest_by_tiers` and `interest_thresholds`, and must send
        at least one of them with `start_date`. Passing any other field,
        including `interest_plan_id`, `external_interest_plan_id` or
        `currency_code`, returns `400`.


        Notes:


        * `fixed_interest_rate` can change only on an interest plan without a
        `benchmark`, and `margin_rate` and `margin` only on one with a
        `benchmark`.

        * `interest_by_tiers` keeps its `type` and `tier_calculation`, and
        changes only the tiers sent, matched by `days` or `amount`.

        * If a version with this `start_date` already exists, the request fails
        with `409`. This includes retrying a request that already succeeded: use
        [Get interest plan](ref:apex-v1-get-interest-plan) with `version_date`
        to read the version created.

        * An interest plan whose first version starts in the future can't be
        updated before that date, and the request fails with `404`.
      operationId: apex-v1-update-interest-plan
      parameters:
        - $ref: '#/components/parameters/externalInterestPlanIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterestPlanRequest'
            examples:
              marginRate:
                summary: Change the margin rate from a date
                value:
                  start_date: '2027-01-01'
                  description: Banking plan 2027
                  margin_rate: 1.1
      responses:
        '200':
          description: Interest plan version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestPlan'
        '400':
          description: >
            * `WAPX0000`: the external interest plan ID in the path or the
            request body breaks the spec, for example because it has a field
            that can't be updated

            * `WAPX0020`: the Pismo platform rejected the version with a code
            Apex doesn't map yet, for example because:
              * `start_date` is before today
              * `fixed_interest_rate` on an interest plan with a `benchmark`, or `margin_rate` or `margin` on one without
              * `interest_by_tiers` with another `type` or `tier_calculation`, or a tier whose `days` or `amount` isn't in the interest plan
              * `interest_thresholds` is empty, or a threshold has no effective rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            * `WAPX0060`: no interest plan has the external interest plan ID in
            the path

            * `WAPX0062`: the interest plan has no version in effect today (UTC)
            because its first version starts later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            * `WAPX0063`: the interest plan already has a version with this
            `start_date`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/InterestPlanUnexpectedResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /apex/v1/deposit-products:
    post:
      tags:
        - Deposit products
      summary: Create deposit product [beta]
      description: >
        Create a deposit product with a client-defined `external_product_id`.
        The `external_product_id` must be unique within the organization and
        cannot be changed after the deposit product is created. The Pismo
        platform generates the `product_id`, and responses return both IDs.


        This endpoint generates a [Deposit product
        created](https://developers.pismo.io/events/docs/deposit-product-creation-1)
        event.


        A deposit product, such as a CD, requires keeping the funds in the
        account for an agreed period. It uses the [interest
        plan](ref:apex-v1-get-interest-plan) identified by
        `external_interest_plan_id`, and is created with the `CREATED` status.
        To activate it, [update it](ref:apex-v1-update-deposit-product) with the
        `ACTIVE` status.


        Notes:


        * Creating with an `external_product_id` that's already in use creates
        nothing: the endpoint returns the response of the first creation with
        `200`, whatever the body. Use [Get deposit
        product](ref:apex-v1-get-deposit-product) to read the deposit product's
        current state.

        * If the Pismo platform doesn't confirm the creation in time, the
        request fails with `504` and the code `EAPX0030`. Retry with the same
        body after the `Retry-After` delay: the retry returns the deposit
        product if Apex saved it, or creates it. If the Pismo platform created
        the deposit product but didn't answer in time, the retry can create a
        second deposit product, and the first one is left without an external
        ID.
      operationId: apex-v1-create-deposit-product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepositProductRequest'
            examples:
              fixedTerm:
                summary: Create a fixed-term deposit product
                value:
                  external_product_id: PSM-DEPOSIT-PRODUCT-01
                  external_interest_plan_id: PSM-INTEREST-PLAN-01
                  name: 12-month CD
                  term_type: FIXED
                  balance_type: VALUE_DATED_BALANCE
                  maturity_instructions:
                    principal: ROLLOVER
                    interest: PAY
                  processing_codes:
                    interest_processing_code: '009797'
                    detach_processing_code: '009696'
                  cool_off_period: 0
                  funding_duration: 12
                  accrue_during_grace_period: true
                  min_amount: 1000
                  max_amount: 5000
                  min_term: 265
                  max_term: 1025
                  penalties:
                    early_withdrawal_after_opening:
                      applicable_within_days: 30
                      penalty_interest_days: 90
                    grace_period:
                      duration_days: 7
                      penalty_interest_days: 30
                    withdrawal_fee:
                      type: PERCENTAGE
                      value: 0.015
                  notices:
                    - days_before_maturity: 30
                      description: 30-day advance notice
                  start_date: '2026-12-01'
                  end_date: '2027-12-31'
      responses:
        '200':
          description: >-
            Deposit product already created with this `external_product_id`.
            Returns the response of the first creation, whatever the body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositProduct'
        '201':
          description: Deposit product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositProduct'
              examples:
                success:
                  summary: Successful response
                  value:
                    product_id: 2c336e9d-d04f-4fd0-8f6e-25808f48d70c
                    external_product_id: PSM-DEPOSIT-PRODUCT-01
                    interest_plan_id: 07d84f79-3027-47bd-b628-65528ccc8fb2
                    external_interest_plan_id: PSM-INTEREST-PLAN-01
                    name: 12-month CD
                    status: CREATED
                    term_type: FIXED
                    accrual_model: BALANCE_BASIS
                    balance_type: VALUE_DATED_BALANCE
                    maturity_instructions:
                      principal: ROLLOVER
                      interest: PAY
                    processing_codes:
                      interest_processing_code: '009797'
                      detach_processing_code: '009696'
                    cool_off_period: 0
                    funding_duration: 12
                    accrue_during_grace_period: true
                    min_amount: 1000
                    max_amount: 5000
                    min_term: 265
                    max_term: 1025
                    penalties:
                      early_withdrawal_after_opening:
                        applicable_within_days: 30
                        penalty_interest_days: 90
                      grace_period:
                        duration_days: 7
                        penalty_interest_days: 30
                      withdrawal_fee:
                        type: PERCENTAGE
                        value: 0.015
                    notices:
                      - days_before_maturity: 30
                        description: 30-day advance notice
                    start_date: '2026-12-01'
                    end_date: '2027-12-31'
                    created_datetime: '2026-11-13T13:26:25+00:00'
        '400':
          description: >
            * `WAPX0000`: the body breaks the spec

            * `WAPX0020`: the Pismo platform rejected the deposit product with a
            code Apex doesn't map yet, like an `end_date` that isn't after today
            or a processing code that doesn't exist

            * `WAPX0061`: no interest plan has the `external_interest_plan_id`
            in the body

            * `WAPX0072`: `accrual_model` doesn't match the interest plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            * `WAPX0020`: the Pismo platform rejected the deposit product with a
            code Apex doesn't map yet, like an interest or penalty processing
            code whose balance configuration conflicts with the one the deposit
            product needs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalOrPlatformError'
        '502':
          $ref: '#/components/responses/DepositProductUnexpectedResponse'
        '504':
          $ref: '#/components/responses/CreationUnconfirmed'
    get:
      tags:
        - Deposit products
      summary: List deposit products [beta]
      description: >
        List the organization's deposit products, most recently created first.
        Only deposit products are listed: savings account products never are.


        Results are paginated with a cursor: pass the previous page's `last_id`
        as `after_id`. The last page has `next_page` set to `false` and no
        `last_id`.


        Filter by `external_product_id` to get a one-item list, or an empty list
        if no deposit product has this external product ID. With this filter,
        `name`, `after_id`, `per_page` and `order` are ignored.


        Deposit products created outside of the bank link workflow are listed
