          format: date-time
          description: The date and time when the calculation begins (RFC 3339).
          example: '2024-01-28T10:33:01.000Z'
        end_date_datetime:
          type: string
          format: date-time
          description: The date and time when the calculation ends (RFC 3339).
          example: '2024-01-30T10:33:01.000Z'
        balance_types_to_calculate:
          type: array
          items:
            type: string
            enum:
              - AVAILABLE
              - SAVINGS
              - HELD_FUNDS
          description: Balance types whose average balance was calculated.
          example:
            - AVAILABLE
            - SAVINGS
            - HELD_FUNDS
    GetInterestAccountResponse:
      title: Get interest account response
      type: object
      properties:
        benchmark:
          $ref: '#/components/schemas/InterestBenchmark'
        fixed_interest_rate:
          $ref: '#/components/schemas/InterestFixedInterestRate'
        margin_rate:
          $ref: '#/components/schemas/InterestMarginRate'
        margin:
