  /v2/creditors/{creditorId}:
    get:
      summary: Get creditor detail
      operationId: getCreditorById
      tags:
        - Creditor
      description: >-
        Retrieve a single creditor by its ID, scoped to the tenant, including
        the marketplaces it operates in. Returns `404` when the creditor does
        not exist for the tenant.
      parameters:
        - $ref: '#/components/parameters/CreditorIdPath'
      responses:
        '200':
          $ref: '#/components/responses/200GetCreditor'
        '400':
          $ref: '#/components/responses/400GetCreditorValidation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      summary: Update partially a creditor
      operationId: updateCreditor
      tags:
        - Creditor
      description: >
        Partially update a creditor scoped to the tenant.


        Only the fields sent in the request body are changed. Any absent field
        keeps its stored value. At least one field must be provided. An empty
        body returns `400`. `crediting_method` can only be set to `ACCOUNT`, and
        the creditor account is not changed by this endpoint.


        This endpoint generates a [Creditor
        updated](https://developers.pismo.io/events/docs/creditors-creditor-updated-1)
        event with the full creditor snapshot after the update, even when the
        values sent are equal to the stored ones. Use `GET
        /v2/creditors/{creditorId}` to read the updated creditor. Returns `404`
        when the creditor does not exist for the tenant.
      parameters:
        - $ref: '#/components/parameters/CreditorIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreditorRequest'
            examples:
              update-creditor-request:
                $ref: '#/components/examples/UpdateCreditorRequestExample'
      responses:
        '204':
          description: No content - creditor updated successfully
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
