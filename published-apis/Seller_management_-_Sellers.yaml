paths:
  /v1/settlements/actions/block:
    post:
      summary: Block merchants for settlement
      operationId: blockMerchantsForSettlement
      tags:
        - Settlement actions
      description: |
        Block merchants for settlement.

        Designates merchants that should be skipped in the settlement process.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementMerchantsPayload'
            examples:
              merchant-transactions-response-success:
                $ref: '#/components/examples/SettlementMerchantsPayloadExample'
      responses:
        '201':
          $ref: '#/components/responses/201Created'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/settlements/actions/unblock:
    post:
      summary: Unblock merchants for settlement
      operationId: unblockMerchantsForSettlement
      tags:
        - Settlement actions
      description: >
        Unblock merchants that were previously blocked using the [Block
        merchants for settlement](ref:blockmerchantsforsettlement) endpoint.
        Unblocked merchants are no longer skipped in the settlement process.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementMerchantsPayload'
            examples:
              merchant-transactions-response-success:
                $ref: '#/components/examples/SettlementMerchantsPayloadExample'
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/settlements/merchants/blocked:
    get:
      summary: Get blocked merchants
      operationId: getBlockedMerchants
      tags:
        - Settlement actions
      description: >
        Retrieve merchants that were previously blocked using the [Block
        merchants for settlement](ref:blockmerchantsforsettlement) endpoint.
      responses:
        '200':
          $ref: '#/components/responses/200Success'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/settlements/actions/run:
    post:
      summary: Run settlement
      operationId: runSettlement
      tags:
        - Settlement actions
      description: |
        Start the settlement process for a specified merchant.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSettlementPayload'
            examples:
              merchant-transactions-response-success:
                $ref: '#/components/examples/RunSettlementPayload'
      responses:
        '202':
          $ref: '#/components/responses/202Accepted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/merchants/{merchantId}/settlements/advancements:
    get:
      summary: List advancement requests settled
      operationId: getAdvancementsBySettlement
      tags:
        - Settlements
      description: >
        List advancement requests settled per merchant using a
        <strong>tracking_id</strong>.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/TrackingId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAdvancementRequestsResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/merchants:
    get:
      summary: List merchants
      operationId: listMerchants
      tags:
        - Merchants
      description: >
        Retrieve a paginated list of merchants for the org.


        Supports filtering by document number, name, status, and external ID,
        optional restriction to a marketplace via the `x-marketplace-id` header,
        and sorting/pagination. When `documentNumber` is provided, the `name`
        filter is ignored.
      parameters:
        - $ref: '#/components/parameters/MerchantMarketplaceIdHeader'
        - $ref: '#/components/parameters/MerchantDocumentNumberFilter'
        - $ref: '#/components/parameters/MerchantNameFilter'
        - $ref: '#/components/parameters/MerchantStatusFilter'
        - $ref: '#/components/parameters/MerchantExternalIdFilter'
        - $ref: '#/components/parameters/MerchantPage'
        - $ref: '#/components/parameters/MerchantPerPage'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/MerchantOrderBy'
      responses:
        '200':
          $ref: '#/components/responses/200ListMerchants'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      summary: Create merchant
      operationId: createMerchant
      tags:
        - Merchants
      description: >
        Create merchant. You use this endpoint to register a merchant (store) in
        a marketplace using the information the merchant provides.


        <b>Note:</b> Before you create merchants, you must create a Merchant
        program, using the [Create program based on
        template](ref:createprogrambasedontemplate) endpoint with `type` set to
        `MERCHANT`. If a program of type `MERCHANT` is not provided, the request
        returns an error.

        By default, when a merchant is created, the Pismo platform assigns it to
        the first existing program of type `MERCHANT` in the Org. However, you
        have the option of specifying a program by providing its ID in the
        `program_id` field. The program you specify in `program_id` must be of
        type `MERCHANT`.


        <b>Note:</b> When `marketplace_id` is provided in the body, the merchant
        is automatically linked to that marketplace after creation.


        For more information about merchants, refer to the <a
        href="https://developers.pismo.io/pismo-docs/docs/seller-management-overview"
        target="blank">Seller management overview</a> guide.<br>


        This endpoint generates a [Merchant
        created](https://developers.pismo.io/events/docs/merchants-merchant-created-1)
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
            examples:
              create-merchant-request:
                $ref: '#/components/examples/CreateMerchantRequestExample'
      responses:
        '201':
          $ref: '#/components/responses/201MerchantCreate'
        '400':
          $ref: '#/components/responses/400MerchantCreate'
        '404':
          $ref: '#/components/responses/404MerchantCreate'
        '409':
          $ref: '#/components/responses/409MerchantCreate'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/merchants/{merchantId}:
    get:
      summary: Get merchant by ID
      operationId: getMerchantById
      tags:
        - Merchants
      description: >
        Retrieve merchant information by its ID.


        Returns detailed information about a specific merchant including
        address, contact, business category, and creditor configuration.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          $ref: '#/components/responses/200GetMerchantById'
        '400':
          $ref: '#/components/responses/400GetMerchantById'
        '404':
          $ref: '#/components/responses/404GetMerchantById'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      summary: Update partially a merchant
      operationId: updateMerchant
      tags:
        - Merchants
      description: >
        Partially update a merchant scoped to the caller's org.


        All request fields are optional; any absent field preserves its current
        stored value. This endpoint generates a `merchant_updated` event.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantRequest'
            examples:
              update-merchant-request:
                $ref: '#/components/examples/UpdateMerchantRequestExample'
      responses:
        '204':
          description: No content - merchant updated successfully
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404GetMerchantById'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/merchants/{merchantId}/workflow/statuses:
    get:
      summary: Get merchant workflow status transitions
      operationId: getMerchantWorkflowStatuses
      tags:
        - Merchants
      description: >
        Retrieve the current workflow status of a merchant and the statuses it
        can transition to, based on the org's active merchant workflow
        configuration.


        The `available_transition_statuses` field lists the `status` values
        accepted by the [Update partially a merchant](ref:updatemerchant)
        endpoint for this merchant. When the current status has no configured
        transitions, `available_transition_statuses` is an empty array.


        Returns `404` when the merchant does not exist for the org or when the
        org has no active merchant workflow configuration.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          $ref: '#/components/responses/200GetMerchantWorkflowStatuses'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404GetMerchantWorkflowStatuses'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/merchants/workflow/statuses:
    get:
      summary: List merchant workflow statuses
      operationId: listMerchantWorkflowStatuses
      tags:
        - Merchants
      description: >
        Retrieve the catalog of merchant workflow statuses configured for the
        org.


        The catalog contains every distinct status in the org's active merchant
        workflow configuration, including the registration status and every
        status used in the configured transitions, sorted alphabetically.


        When the org has no active merchant workflow configuration, the endpoint
        returns **HTTP 200** with an empty `org_workflow_statuses` array (not
        404).
      responses:
        '200':
          $ref: '#/components/responses/200GetMerchantWorkflowStatusCatalog'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v3/marketplaces:
    post:
      summary: Create marketplace V3
      operationId: createMarketplace
      tags:
        - Marketplace
      description: >
        This endpoint creates a new marketplace.

        This endpoint generates a <a
        href="https://developers.pismo.io/events/docs/marketplace-marketplace-created-2">Marketplace
        created</a> event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketplaceRequest'
            examples:
              marketplace-request-success:
                $ref: '#/components/examples/CreateMarketplaceRequestExample'
      responses:
        '201':
          $ref: '#/components/responses/201MarketplaceCreate'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    get:
      summary: List marketplaces
      operationId: getMarketplaces
      tags:
        - Marketplace
      description: >
        Retrieve a paginated list of marketplaces with optional filtering and
        sorting capabilities.


        ## Filtering


        Filters are provided as individual query parameters. Multiple filters
        can be combined — each additional parameter further restricts the result
        set (AND logic).


        | Parameter | Field Filtered | Match Type | Case Sensitive |

        |---|---|---|---|

        | `documentNumber` | `document_number` | Exact | Yes |

        | `externalId` | `external_id` | Exact | Yes |

        | `brandName` | `brand_name` | Partial (LIKE) | No |

        | `marketplaceName` | `marketplace_name` | Partial (LIKE) | No |

        | `merchantId` | `merchant_id` | Exact | Yes |


        **Examples:**

        - `?documentNumber=12345678901234` — exact document number match

        - `?brandName=Acme` — brand name containing "Acme"

        - `?brandName=Acme&marketplaceName=Store` — brand name containing "Acme"
        AND marketplace name containing "Store"


        ## Sorting


        Use `order` and `orderBy` to control result ordering.

        Supported `orderBy` values: `marketplace_id`, `document_number`,
        `brand_name`, `marketplace_name`, `external_id`.

        Default sort: `marketplace_id ASC`.


        ## Empty Results


        Empty result sets return **HTTP 200** with an empty `items` array (not
        404).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/OrderBy'
        - $ref: '#/components/parameters/DocumentNumberFilter'
        - $ref: '#/components/parameters/ExternalIdFilter'
        - $ref: '#/components/parameters/BrandNameFilter'
        - $ref: '#/components/parameters/MarketplaceNameFilter'
        - $ref: '#/components/parameters/MerchantIdFilter'
      responses:
        '200':
          $ref: '#/components/responses/200GetMarketplaces'
        '400':
          $ref: '#/components/responses/400GetMarketplacesValidation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRequestResponse'
              examples:
                unauthorized:
                  summary: Unauthorized error
                  value:
                    code: ESMG0401
                    message: Unauthorized
                    details:
                      payload:
                        - field: Authorization
                          message: Invalid or missing authorization token
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v3/marketplaces/{marketplaceId}:
    get:
      summary: Get marketplace by ID
      operationId: getMarketplaceById
      tags:
        - Marketplace
      description: >
        Retrieve marketplace information by its ID.


        Returns detailed information about a specific marketplace including its
        configuration, contact details, and address information.
      parameters:
        - $ref: '#/components/parameters/MarketplaceId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceByIdResponse'
              examples:
                marketplace-details:
                  $ref: '#/components/examples/GetMarketplaceByIdExample'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/marketplaces/{marketplaceId}:
    patch:
      summary: Update marketplace
      operationId: updateMarketplace
