openapi: 3.1.0
info:
  title: Seller management - Sellers
  version: 1.0.0
  description: |
    Endpoints to handle the settlement process in Seller management
  contact:
    name: API Support
    url: https://developers.pismo.io/support
  license:
    name: Copyright Pismo
servers:
  - url: https://sandbox.pismolabs.io/sellers
    description: Sandbox API server for testing
tags:
  - name: Settlement actions
    description: Endpoints for settlement actions
  - name: Settlement configuration
    description: Endpoints for settlement configuration
  - name: Settlements
    description: Endpoints for settlements
  - name: Marketplace
    description: Endpoints for marketplace management
  - name: Marketplace merchants links
    description: Endpoints for managing marketplace relationships
  - name: Business categories
    description: Endpoints for business category management
  - name: Merchants
    description: Endpoints for merchant management
  - name: Creditor
    description: Endpoints for creditor management
components:
  parameters:
    MarketplaceId:
      in: path
      name: marketplaceId
      required: true
      description: Marketplace ID
      example: 1654
      schema:
        type: integer
        format: int64
        description: Marketplace ID
        minimum: 1
        maximum: 18446744073709552000
    MerchantId:
      in: path
      name: merchantId
      description: Merchant ID
      example: 24175
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 18446744073709552000
    TrackingId:
      in: query
      name: tracking_id
      description: Pismo-generated ID for tracking the settlement authorization
      required: true
      example: '9999'
      schema:
        type: string
        description: Tracking ID for the settlement authorization
    BranchId:
      in: query
      name: branchId
      description: Filter by merchant branch ID
      required: false
      example: 212121
      schema:
        type: integer
        format: int64
        minimum: 1
    HqId:
      in: query
      name: hqId
      description: Filter by merchant headquarters ID
      example: 8675409
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      in: query
      name: page
      description: Current page number
      required: false
      example: 12
      schema:
        type: integer
        format: int32
        minimum: 1
        example: 1
    PerPage:
      in: query
      name: perPage
      description: Number of items per page
      required: false
      example: 100
      schema:
        type: integer
        format: int32
        description: Number of items per page
        minimum: 1
    MerchantPage:
      in: query
      name: page
      description: Current page number (starts at 1)
      required: false
      example: 1
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    MerchantPerPage:
      in: query
      name: perPage
      description: Number of items per page
      required: false
      example: 25
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 25
    Subnet:
      in: query
      name: subnet
      description: >
        Filter by merchant subnet.

        Values are `individual`, `hq` (short for `Headquarters`), or `branch`.


        A merchant is:
          * `hq` if it has branch merchants.
          * `branch` if it is another merchant's branch.
          * `individual` if it isn't a branch nor headquarters.

        To create these relationships, use the [Link marketplace to
        merchants](https://developers.pismo.io/pismo-docs/reference/createmarketplacemerchantslink)
        endpoint.
      required: false
      example: hq
      schema:
        type: string
        enum:
          - individual
          - hq
          - branch
    DocumentNumberFilter:
      in: query
      name: documentNumber
      description: Filter by marketplace document number (exact match, case-sensitive)
      required: false
      example: '12345678901234'
      schema:
        type: string
        minLength: 1
        maxLength: 14
    ExternalIdFilter:
      in: query
      name: externalId
      description: Filter by external system identifier (exact match, case-sensitive)
      required: false
      example: EXT-123
      schema:
        type: string
        minLength: 1
        maxLength: 50
    BrandNameFilter:
      in: query
      name: brandName
      description: Filter by brand name (partial match, case-insensitive)
      required: false
      example: Acme
      schema:
        type: string
        minLength: 1
        maxLength: 50
    MarketplaceNameFilter:
      in: query
      name: marketplaceName
      description: Filter by marketplace name (partial match, case-insensitive)
      required: false
      example: Store
      schema:
        type: string
        minLength: 1
        maxLength: 100
    MerchantIdFilter:
      in: query
      name: merchantId
      description: >-
        Filter marketplaces by merchant ID to return marketplaces linked to that
        merchant
      required: false
      example: 54
      schema:
        type: integer
        format: int64
        minimum: 1
    Order:
      in: query
      name: order
      description: Sort order direction (case-insensitive)
      required: false
      example: asc
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    OrderBy:
      in: query
      name: orderBy
      description: |
        Field name to sort by
        - `marketplace_id`
        - `document_number`
        - `brand_name`
        - `marketplace_name`
        - `external_id`
      required: false
      example: brand_name
      schema:
        type: string
        maxLength: 50
    BusinessCategoryExternalCodePath:
      in: path
      name: externalCode
      required: true
      description: External code that identifies the business category in the client system
      example: MCC_5411
      schema:
        type: string
        minLength: 1
        maxLength: 45
    ExternalCodeQueryFilter:
      in: query
      name: externalCode
      description: Filter by external code (partial match, case-insensitive)
      required: false
      example: MCC_5411
      schema:
        type: string
        minLength: 1
        maxLength: 45
    CategoryQueryFilter:
      in: query
      name: category
      description: Filter by category name (partial match, case-insensitive)
      required: false
      example: Grocery
      schema:
        type: string
        minLength: 1
        maxLength: 150
    DescriptionQueryFilter:
      in: query
      name: description
      description: Filter by description (partial match, case-insensitive)
      required: false
      example: food products
      schema:
        type: string
        minLength: 1
        maxLength: 150
    BusinessCategoryOrderBy:
      in: query
      name: orderBy
      description: Field name to sort by
      required: false
      example: businessCategoryId
      schema:
        type: string
        enum:
          - businessCategoryId
          - externalCode
          - category
          - description
        default: businessCategoryId
    MerchantDocumentNumberFilter:
      in: query
      name: documentNumber
      description: >-
        Filter by merchant document number (exact match, case-sensitive). Takes
        precedence over the `name` filter.
      required: false
      example: '12345678901'
      schema:
        type: string
        minLength: 1
        maxLength: 50
    MerchantNameFilter:
      in: query
      name: name
      description: >-
        Filter by merchant name (partial match, case-insensitive). Ignored when
        `documentNumber` is provided.
      required: false
      example: Acme
      schema:
        type: string
        minLength: 1
        maxLength: 100
    MerchantStatusFilter:
      in: query
      name: status
      description: Filter by merchant status within the org (exact match)
      required: false
      example: APPROVED
      schema:
        type: string
        minLength: 1
        maxLength: 20
    MerchantExternalIdFilter:
      in: query
      name: externalId
      description: Filter by external system identifier (exact match, case-sensitive)
      required: false
      example: EXT-001
      schema:
        type: string
        minLength: 1
        maxLength: 50
    MerchantOrderBy:
      in: query
      name: orderBy
      description: |
        Field name to sort by
        - `id`
        - `name`
        - `merchant_name`
        - `document_number`
        - `municipal_registration`
        - `external_id`
        - `status`
        - `creditor_id`
      required: false
      example: id
      schema:
        type: string
        enum:
          - id
          - name
          - merchant_name
          - document_number
          - municipal_registration
          - external_id
          - status
          - creditor_id
        default: id
    MerchantMarketplaceIdHeader:
      in: header
      name: x-marketplace-id
      description: >-
        Optional marketplace ID to restrict the listing to merchants linked to
        that marketplace
      required: false
      example: 51148
      schema:
        type: integer
        format: int64
        minimum: 1
    CreditorNameFilter:
      in: query
      name: name
      description: Filter by creditor name (prefix match, case-insensitive)
      required: false
      example: Acme
      schema:
        type: string
        minLength: 1
        maxLength: 100
    CreditorMarketplaceFilter:
      in: query
      name: marketplaceId
      description: >-
        Filter creditors by marketplace to return only creditors that operate in
        that marketplace
      required: false
      example: 1654
      schema:
        type: integer
        format: int64
        minimum: 1
    CreditorOrderBy:
      in: query
      name: orderBy
      description: |
        Field name to sort by
        - `id`
        - `name`
      required: false
      example: name
      schema:
        type: string
        enum:
          - id
          - name
        default: name
    CreditorIdPath:
      in: path
      name: creditorId
      description: Creditor ID
      required: true
      example: 77
      schema:
        $ref: '#/components/schemas/CreditorId'
  schemas:
    AdditionalPhoneNumber:
      type: string
      description: >-
        Additional phone number. Format = E.164. Leading '+' followed by 7 to 15
        digits is **REQUIRED**. Do not use spaces, dashes or parentheses.
      pattern: ^\+[1-9]?[0-9]{7,14}$
      minLength: 8
      maxLength: 16
      example: '+5511888888888'
    BrandName:
      type: string
      description: >
        Marketplace brand name. A secondary name for the marketplace that is
        **not** the legal registered name
      minLength: 1
      maxLength: 50
      example: Acme
    City:
      type: string
      description: Name of the city or municipality
      minLength: 1
      maxLength: 60
      example: San Diego
    ComplementaryAddress:
      type: string
      description: >-
        Additional address details that help pinpoint the exact location, such
        as building, apartment, or floor
      example: Suite 2
      minLength: 1
      maxLength: 50
    Country:
      type: string
      description: >-
        Full name of the country according to international standards or local
        registry
      minLength: 1
      maxLength: 30
      example: United States
    CreateMarketplaceRequest:
      type: object
      description: Request payload for creating a new marketplace
      required:
        - brand_name
        - document_number
        - marketplace_name
      properties:
        brand_name:
          $ref: '#/components/schemas/BrandName'
        document_number:
          $ref: '#/components/schemas/DocumentNumber'
        marketplace_name:
          $ref: '#/components/schemas/MarketplaceName'
        registration:
          $ref: '#/components/schemas/Registration'
        registration2:
          $ref: '#/components/schemas/Registration2'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        address:
          type: object
          description: Marketplace address information
          properties:
            number:
              $ref: '#/components/schemas/Number'
            street:
              $ref: '#/components/schemas/Street'
            complementary_address:
              $ref: '#/components/schemas/ComplementaryAddress'
            neighborhood:
              $ref: '#/components/schemas/Neighborhood'
            zip_code:
              $ref: '#/components/schemas/ZipCode'
            city:
              $ref: '#/components/schemas/City'
            state:
              $ref: '#/components/schemas/State'
            country:
              $ref: '#/components/schemas/Country'
        contact:
          type: object
          description: Contact information
          properties:
            name:
              $ref: '#/components/schemas/Name'
            email:
              $ref: '#/components/schemas/Email'
            phone_number:
              $ref: '#/components/schemas/PhoneNumber'
            additional_phone_number:
              $ref: '#/components/schemas/AdditionalPhoneNumber'
    CreatedResponse:
      type: object
      properties:
        code:
          type: string
          description: Pismo internal code
        message:
          type: string
          description: Message
    ErrorRequestResponse:
      type: object
      description: Error payload returned by the API
      properties:
        code:
          type: string
          description: Pismo internal error code
        message:
          type: string
          description: Error message
        details:
          type: object
          description: If necessary, this field shows which fields failed validation
          properties:
            payload:
              type: array
              description: Array of fields with error
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Name of field with error
                  message:
                    type: string
                    description: Error message referring to the field
    CreateMerchantRequest:
      type: object
      description: Request payload for creating a merchant.
      required:
        - document_number
        - name
        - email
        - creditor
      properties:
        document_number:
          type: string
          description: Government document code, such as a government-issued tax ID
          minLength: 1
          maxLength: 14
          example: '81106922000180'
        name:
          type: string
          description: Merchant legal name
          minLength: 1
          maxLength: 100
          example: Rideshare
        email:
          type: string
          format: email
          description: Merchant contact email address
          maxLength: 255
          example: rideshare@example.com
        brand_name:
          type: string
          description: Secondary trade name for the merchant
          minLength: 1
          maxLength: 50
          example: Brand Name
        municipal_registration:
          type: string
          description: Official company registration with the local municipality
          minLength: 1
          maxLength: 15
          example: 419.122.620.099
        external_id:
          type: string
          description: External system identifier. Should be unique across the merchants.
          minLength: 1
          maxLength: 50
          example: EXT-001
        external_code:
          type: string
          description: >-
            Business-category external code. Resolved to a business category ID;
            not stored on the merchant.
          minLength: 1
          maxLength: 45
          example: CAT-001
        program_id:
          type: integer
          format: int64
          description: >-
            Program ID of type MERCHANT. If omitted, the first program of type
            MERCHANT in the org is assigned; if none exists, the request returns
            an error.
          example: 42
        address:
          type: string
          description: Street address
          minLength: 1
          maxLength: 80
          example: Main Street
        number:
          type: integer
          format: int32
          description: Address number
          example: 1000
        complementary_address:
          type: string
          description: Additional address details (building, suite, floor)
          minLength: 1
          maxLength: 50
          example: Suite 302
        neighborhood:
          type: string
          description: Neighborhood or district
          minLength: 1
          maxLength: 50
          example: Bela Vista
        zip_code:
          type: string
          description: Postal code
          minLength: 1
          maxLength: 9
          example: '94105'
        city:
          type: string
          description: City or municipality name
          minLength: 1
          maxLength: 60
          example: San Francisco
        city_code:
          type: string
          description: City code
          minLength: 1
          maxLength: 50
          example: '415'
        state:
          type: string
          description: State or province code
          minLength: 1
          maxLength: 2
          example: CA
        country:
          type: string
          description: Country name or code
          minLength: 1
          maxLength: 30
          example: US
        contact:
          type: string
          description: Contact person name
          minLength: 1
          maxLength: 50
          example: Alex Miller
        phone_number:
          type: string
          description: Phone number in E.164 format
          maxLength: 25
          example: '+14155551234'
        additional_phone_number:
          type: string
          description: Additional phone number in E.164 format
          maxLength: 25
          example: '+14155555678'
        marketplace_id:
          type: integer
          format: int64
          description: ID of the marketplace to link the merchant to after creation.
          example: 51148
        creditor:
          $ref: '#/components/schemas/CreateMerchantCreditorRequest'
    CreateMerchantCreditorRequest:
      type: object
      description: Merchant creditor
      properties:
        id:
          type: integer
          format: int64
          description: Creditor ID
          example: 865
        name:
          type: string
          description: Creditor name
          maxLength: 100
          example: Herman Bank
        crediting_method:
          type: string
          description: Creditor crediting method. Only `ACCOUNT` is currently supported.
          enum:
            - ACCOUNT
          example: ACCOUNT
        advancement_fee:
          type: number
          description: >-
            Advancement fee. Falls back to program parameters, then a hardcoded
            default.
          example: 0.0125
        discount_rate:
          type: number
          description: >-
            Discount rate. Falls back to program parameters, then a hardcoded
            default.
          example: 0.0099
        maximum_advancement_percentage:
          type: number
          description: >-
            Maximum advancement percentage. Falls back to program parameters,
            then a hardcoded default.
          example: 0.8
    UpdateCreditorRequest:
      type: object
      description: >-
        Partial update of a creditor. All fields are optional and keep their
        stored value when absent, but at least one field must be provided.
      minProperties: 1
      properties:
        advancement_fee:
          type: number
          format: double
          description: >-
            Advancement fee rate. Must be greater than or equal to `0`, with at
            most 4 decimal places.
          minimum: 0
          example: 0.0125
        crediting_method:
          type: string
          enum:
            - ACCOUNT
          description: Method used to credit the creditor. Only `ACCOUNT` is accepted.
          example: ACCOUNT
        discount_rate:
          type: number
          format: double
          description: >-
            Discount rate. Must be greater than or equal to `0`, with at most 4
            decimal places.
          minimum: 0
          example: 0.0099
        maximum_advancement_percentage:
          type: number
          format: double
          description: >-
            Maximum percentage of receivables that can be advanced. Must be
            greater than or equal to `0`, with at most 4 decimal places.
          minimum: 0
          example: 0.8
        name:
          type: string
          description: Name of the creditor. If provided, the value must not be empty.
          minLength: 1
          maxLength: 100
          example: Blue and Gold Bank
    UpdateMarketplaceRequest:
      type: object
      description: Update marketplace information
      properties:
        marketplace_name:
          $ref: '#/components/schemas/MarketplaceName'
        brand_name:
          $ref: '#/components/schemas/BrandName'
        document_number:
          $ref: '#/components/schemas/DocumentNumber'
        registration:
          $ref: '#/components/schemas/Registration'
        registration2:
          $ref: '#/components/schemas/Registration2'
        external_id:
          $ref: '#/components/schemas/ExternalId'
        address:
          type: object
          properties:
            number:
              $ref: '#/components/schemas/Number'
            street:
              $ref: '#/components/schemas/Street'
            complementary_address:
              $ref: '#/components/schemas/ComplementaryAddress'
            neighborhood:
              $ref: '#/components/schemas/Neighborhood'
            zip_code:
              $ref: '#/components/schemas/ZipCode'
            city:
              $ref: '#/components/schemas/City'
            state:
              $ref: '#/components/schemas/State'
            country:
              $ref: '#/components/schemas/Country'
        contact:
          type: object
          properties:
            name:
              $ref: '#/components/schemas/Name'
            email:
              $ref: '#/components/schemas/Email'
            phone_number:
              $ref: '#/components/schemas/PhoneNumber'
            additional_phone_number:
              $ref: '#/components/schemas/AdditionalPhoneNumber'
    CreateMarketplaceResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/MarketplaceId'
    DocumentNumber:
      type: string
      description: >-
        Marketplace document number. This is the government document code, such
        as a government-issued tax ID
      minLength: 1
      maxLength: 14
      example: '20166135000139'
    Email:
      type: string
      description: >-
        Marketplace contact email address. Its format must be a valid email
        address
      minLength: 1
      maxLength: 255
      example: email@email.com
    ExternalId:
      type: string
      description: Marketplace ID used on client's system
      minLength: 1
      maxLength: 50
      example: '1123'
    GetBlockedMerchantsResponse:
      type: array
      items:
        type: object
        properties:
          marketplace_id:
            $ref: '#/components/schemas/MarketplaceId'
          merchant_ids:
            $ref: '#/components/schemas/MerchantIds'
    GetMarketplaceByIdResponse:
      description: >-
        Marketplace details returned by the endpoint that gets a marketplace by
        ID
      properties:
        id:
          $ref: '#/components/schemas/MarketplaceId'
        document_number:
          type: string
          description: Marketplace document number
          example: '12345678901234'
        brand_name:
          type: string
          description: Marketplace brand name
          example: Tech Store Brasil
        marketplace_name:
          type: string
          description: Marketplace name
          example: TechStore Marketplace
        registration:
          type: string
          description: Official company registration with the local municipality
          minLength: 1
          maxLength: 15
        registration2:
          type: string
          description: >-
            Complementary registration number issued by local authorities. In
            certain countries, businesses may be required to hold multiple
            municipal registrations at national, state, or regional levels.
          minLength: 1
          maxLength: 15
        external_id:
          type: string
          description: Marketplace external identifier
          example: EXT-MP-001
        address:
          type: object
          description: Marketplace address information
          properties:
            street:
              type: string
              description: Street address
              example: Rua das Flores, 123
            number:
              type: integer
              format: int32
              description: Address number
              example: 123
            neighborhood:
              type: string
              description: Field intended for entering the neighborhood name
              maximum: 50
            zip_code:
              type: string
              description: ZIP/postal code
              example: 01234-567
            city:
              type: string
              description: City name
              example: São Paulo
            state:
              type: string
              description: State/province
              example: SP
            country:
              type: string
              description: Country name
              example: Brasil
        contact:
          type: object
          description: Contact information
          properties:
            name:
              type: string
              description: Contact person name
              example: João Silva
            email:
              type: string
              format: email
              description: Contact email
              example: joao.silva@techstore.com
            phone_number:
              type: string
              description: Primary phone number in E.164 format
              example: '+5511999999999'
            additional_phone_number:
              type: string
              description: Secondary phone number in E.164 format
              example: '+5511888888888'
    MerchantAddress:
      type: object
      description: Merchant address information
      properties:
        street:
          type:
            - string
            - 'null'
          description: Street name
          example: Main Street
        number:
          type:
            - integer
            - 'null'
          format: int32
          description: Address number
          example: 1000
        complementary_address:
          type:
            - string
            - 'null'
          description: Additional address details
          example: Suite 201
        neighborhood:
          type:
            - string
            - 'null'
          description: Neighborhood name
          example: Centro
        zip_code:
          type:
            - string
            - 'null'
          description: Postal code
          example: '94105'
        city:
          type:
            - string
            - 'null'
          description: City name
          example: San Francisco
        state:
          type:
            - string
            - 'null'
          description: State abbreviation (2 characters)
          example: CA
        country:
          type:
            - string
            - 'null'
          description: Country name
          example: US
    MerchantContact:
      type: object
      description: Merchant contact information
      properties:
        name:
          type:
            - string
            - 'null'
          description: Merchant contact name
          example: Alex Miller
        email:
          type:
            - string
          description: Merchant contact email address
          example: alexmiller@example.com
        phone_number:
          type:
            - string
            - 'null'
          description: Primary phone number (area code concatenated with number)
          example: '4155551234'
        additional_phone_number:
          type:
            - string
            - 'null'
          description: Secondary phone number (area code concatenated with number)
          example: '4155555678'
    MerchantBusinessCategory:
      type: object
      description: >-
        Business category assigned to the merchant. Null at the parent key when
        no category is assigned.
      required:
        - category
        - description
        - external_code
      properties:
        category:
          type: string
          description: Business category name
          example: RETAIL
        description:
          type: string
          description: Business category description
          example: Retail stores
        external_code:
          type: string
          description: External code for the business category
          example: '5411'
    CreditorAccount:
      type: object
      description: >-
        Pismo internal account. Always returned as an object even when id is
        null
      properties:
        id:
          type:
            - integer
            - 'null'
          format: int64
          description: Pismo internal account id
          example: 12345
    Creditor:
      type: object
      description: Creditor configuration for the merchant
      required:
        - id
        - name
        - crediting_method
        - account
        - advancement_fee
        - discount_rate
        - maximum_advancement_percentage
      properties:
        id:
          type: integer
          format: int64
          description: Internal creditor ID
          example: 865
        name:
          type: string
          description: Creditor name
          example: Herman Bank
        crediting_method:
          type: string
          description: Method used for crediting funds
          example: ACCOUNT
        account:
          $ref: '#/components/schemas/CreditorAccount'
        advancement_fee:
          type: number
          format: double
          description: Fixed advancement fee rate. Returns 0 when not passed.
          example: 3
        discount_rate:
          type: number
          format: double
          description: >-
            Merchant discount rate applied to advancement operations. Returns 0
            when not passed.
          example: 0.025
        maximum_advancement_percentage:
          type: number
          format: double
          description: >-
            Maximum percentage of eligible balance that can be advanced. Returns
            0 when not passed.
          example: 80
    MerchantResponse:
