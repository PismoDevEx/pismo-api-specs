      description: >
        Retrieve a paginated list of creditors, optionally filtered by name
        and/or marketplace.


        ## Filtering


        | Parameter | Field Filtered | Match Type | Case Sensitive |

        |---|---|---|---|

        | `name` | `name` | Prefix | No |

        | `marketplaceId` | `marketplaceId` | Operates in marketplace | N/A |


        ## Sorting


        Use `order` and `orderBy` to control result ordering.

        Supported `orderBy` values: `id`, `name`.

        Default sort: `name ASC`.


        ## Empty Results


        Empty result sets return **HTTP 200** with an empty `items` array (not
        404).
      parameters:
        - $ref: '#/components/parameters/Page'
