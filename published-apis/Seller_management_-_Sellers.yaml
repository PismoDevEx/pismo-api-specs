          description: Secondary municipal registration number
          example: '12345'
        brand_name:
          type:
            - string
            - 'null'
          description: Merchant brand name
          example: Brand Name
        name:
          type:
            - string
          description: Legal registered name of the merchant
          example: Rideshare
        external_id:
          type:
            - string
            - 'null'
          description: Identifier used in the client's external system
          example: ext-001
        status:
          type:
            - string
          description: Merchant status within the org
          example: APPROVED
        program_id:
          type: integer
          format: int64
          description: Program ID associated with the merchant
          example: 10
