              marketplace-request-success:
                $ref: '#/components/examples/UpdateMarketplaceRequestExample'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMarketplaceByIdResponse'
              examples:
                marketplace-details:
                  $ref: '#/components/examples/GetMarketplaceByIdExample'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
