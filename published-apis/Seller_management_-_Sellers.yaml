    UpdateMerchantRequest:
      type: object
      description: >-
        Partial update of a merchant. All fields are optional and preserve their
        current stored value when absent.
      properties:
        document_number:
          type: string
          description: >-
            Government-issued document number (e.g., CPF/CNPJ). Must be
            non-empty when provided.
          minLength: 1
          maxLength: 14
          example: '12345678901'
        brand_name:
          type: string
          description: Merchant brand name
          maxLength: 50
          example: Brand Name
        name:
          type: string
          description: >-
            Legal registered name of the merchant. Must be non-empty when
            provided.
          minLength: 1
          maxLength: 100
          example: Rideshare
        external_id:
          type: string
          description: >-
            Identifier used in the client's external system. Must be unique per
            org, excluding the merchant being updated.
          maxLength: 50
          example: ext-001
        municipal_registration:
          type: string
          description: Secondary municipal registration number
          maxLength: 15
          example: '12345'
        address:
          type: object
          description: Merchant address information
          properties:
            street:
              type: string
              description: Street name
              maxLength: 80
              example: Main Street
            number:
              type: integer
              format: int32
              description: Address number
              example: 1000
            complementary_address:
              type: string
              description: Additional address details
              maxLength: 50
              example: Suite 201
            neighborhood:
              type: string
              description: Neighborhood name
              maxLength: 50
              example: Centro
            zip_code:
              type: string
              description: Postal code
              maxLength: 9
              example: '94105'
            city:
              type: string
              description: City name
              maxLength: 60
              example: San Francisco
            state:
              type: string
              description: State abbreviation (2 characters)
              maxLength: 2
              example: CA
            country:
              type: string
              description: Country code
              maxLength: 30
              example: US
        contact:
          type: object
          description: Merchant contact information
          properties:
            name:
              type: string
              description: Merchant contact name
              maxLength: 50
              example: Alex Miller
            email:
              type: string
              format: email
              description: Merchant contact email address. Must be non-empty when provided.
              minLength: 1
              maxLength: 255
              example: alexmiller@example.com
            phone_number:
              type: string
              description: Primary phone number (area code concatenated with number)
              maxLength: 25
              example: '4155551234'
            additional_phone_number:
              type: string
              description: Secondary phone number (area code concatenated with number)
              maxLength: 25
              example: '4155555678'
        business_category:
          type: object
          description: >-
            Business category assignment. Resolved by `external_code`, scoped to
            the org; returns `400` when not found.
          properties:
            external_code:
              type: string
              description: >-
                External code for the business category. Must be non-empty when
                provided.
              minLength: 1
              maxLength: 50
              example: '5411'
