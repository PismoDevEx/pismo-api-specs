  /v1/payments/bacs/directcredit/release/{id}:
    post:
      summary: Release BACS inbound transaction [beta]
      description: >
        Move a suspended transaction amount from additional funds to available
        balance and mark the transaction as settled.


        **Suspense transaction flow**


        You can use the suspense transaction flow to manage incoming BACS
        transactions that have been temporarily placed on hold due to suspected
        fraud pending a decision from the client's anti-fraud (AF) provider.


        **Supported scenarios:**

          * A incoming (cash-in) BACS transaction is received.

          * Client' s anti-fraud provider returns "hold" instead of approve or reject.

          * Pismo places the transaction amount into additional funds (unavailable balance) so the beneficiary cannot use the funds until a final decision is made.

          * The client later calls Pismo's release or [cancel](ref:post-cancel-bacs-1) endpoints to finalize the transaction.

        This endpoint generates a [BACS direct credit inbound payment
        processed](https://developers.pismo.io/events/docs/bacs-direct-credit-in-status-change-1)
        event with status `SETTLED`.
