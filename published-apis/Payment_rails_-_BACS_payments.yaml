  /v1/payments/bacs/directdebit/mandates/{id}/cancel:
    post:
      summary: Cancel BACS mandate [beta]
      description: >
        Cancel a BACS direct debit mandate.


        Cancel of an existing mandate, applied asynchronously through the BACS
        scheme.


        **Notes:**

          * The cancel is persisted with `status` = `CANCEL_PENDING` under the payer account, and enqueued for the asynchronous submission worker, which submits it to Form3 through the PSP gateway.

          * Allowed only when the mandate is in `SUBMITTED` or `CONFIRMED`; any other state is rejected with a **409 Conflict** (`EBACS0103`).

          * `version` is a Form3 optimistic-concurrency passthrough that must equal the stored version; a mismatch is rejected with a **409 Conflict** (`EBACS0104`). This call does not increment it.

          * The optional `status_reason` records why the mandate is being cancelled; it is persisted on the mandate and forwarded on the generated event.

          * This endpoint moves the mandate to `status` = `CANCEL_PENDING` and generates a [BACS mandate status changed](https://developers.pismo.io/events/docs/bacs-mandate-status-change-1) event. Subsequent status transitions generate further events (for example `CANCELLED`, `FAILED`).
      operationId: post-cancel-mandate
      tags:
        - BACS direct debit
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/mandateIdPath'
      requestBody:
        description: Cancel mandate request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mandate.CancelRequest'
        required: true
      responses:
        '202':
          description: Cancel intent accepted and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.CancelResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0004:
                  summary: Validation Error
                  value:
                    code: EBACS0004
                    message: Validation error
                EBACS0016:
                  summary: Unmarshal Error
                  value:
                    code: EBACS0016
                    message: Unmarshal error
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0002:
                  summary: Missing Tenant Header
                  value:
                    code: EBACS0002
                    message: 'Missing required header: ''x-tenant'''
                EBACS0085:
                  summary: Missing Account Id
                  value:
                    code: EBACS0085
                    message: Missing required account-id
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0102:
                  summary: Mandate Not Found
                  value:
                    code: EBACS0102
                    message: Mandate not found
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0103:
                  summary: Mandate Invalid State
                  value:
                    code: EBACS0103
                    message: >-
                      Mandate cannot perform the requested operation in its
                      current status
                EBACS0104:
                  summary: Mandate Version Conflict
                  value:
                    code: EBACS0104
                    message: Mandate version does not match the current version
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0003:
                  summary: Internal Error
