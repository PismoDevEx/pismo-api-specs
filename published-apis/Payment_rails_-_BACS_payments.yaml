  /v1/payments/bacs/directdebit/mandates/{id}:
    patch:
      summary: Amend BACS mandate [beta]
      description: >
        Amend a BACS direct debit mandate.


        Registers a change to a mandate's debtor and/or beneficiary details,
        applied asynchronously through the BACS scheme.


        **Notes:**

          * The amend is persisted with `status` = `AMEND_PENDING`, and enqueued for the asynchronous submission worker, which submits it to Form3 through the PSP gateway.

          * Allowed only when the mandate is in `CREATED`, `SUBMITTED`, or `CONFIRMED`; any other state is rejected with a **409 Conflict** (`EBACS0103`).

          * `version` is a Form3 optimistic-concurrency passthrough that must equal the stored version; a mismatch is rejected with a **409 Conflict** (`EBACS0104`). This call does not increment this field.

          * This endpoint moves the mandate to `status` = `AMEND_PENDING` and generates a [BACS mandate status changed](https://developers.pismo.io/events/docs/bacs-mandate-status-change-1) event. Subsequent status transitions generate further events (for example `AMENDED`, `FAILED`).
      operationId: patch-amend-mandate
      tags:
        - BACS direct debit
      parameters:
        - $ref: '#/components/parameters/authHeader'
        - $ref: '#/components/parameters/mandateIdPath'
      requestBody:
        description: Amend mandate request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mandate.AmendRequest'
        required: true
      responses:
        '202':
          description: Amend intent accepted and enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mandate.AmendResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0004:
                  summary: Validation Error
                  value:
                    code: EBACS0004
                    message: Validation error
                EBACS0016:
                  summary: Unmarshal Error
                  value:
                    code: EBACS0016
                    message: Unmarshal error
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customer.Error'
              examples:
                EBACS0002:
                  summary: Missing Tenant Header
