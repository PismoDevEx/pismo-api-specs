openapi: 3.1.0
info:
  title: Banking - Interest operations
  version: 1.0.0
  description: API to handle interest bearing account operations
  contact:
    name: API Support
    url: https://developers.pismolabs.io/pismo-docs/docs/support
  license:
    name: Copyright Pismo
servers:
  - url: https://sandbox.pismolabs.io/interest-engine
    description: Sandbox API server for integration
tags:
  - name: Interest engine
    description: Endpoints for handling interest bearing account operations
components:
  parameters:
    Authorization:
      name: authorization
      in: header
      description: Authorization
      required: true
      example: Bearer <access-token>
      schema:
        type: string
    ContentType:
      name: content-type
      in: header
      description: Content type
      required: true
      example: application/json
      schema:
        type: string
  schemas:
    AccountId:
      type: string
      format: number
      description: Account ID. Must be between 1 and 64.
      example: '15001'
    BalanceAmount:
      type: number
      format: double
      minimum: 0
      description: Balance amount. Must be equal to or greater than zero.
      example: 23.95
    BalanceId:
      type: string
      format: UUID
      maxLength: 36
      description: >
        Unique identifier for the balance, generated by the client. Must be a
        valid UUID. Alphabetical characters are accepted in either case on
        input, but are converted to lowercase in the response.
      example: 3f1c2b7a-9d4e-4a6b-8c21-5e7f9a0b1c2d
    DepositAmount:
      type: number
      format: double
      exclusiveMinimum: 0
      description: Amount to be deposited
      example: 550.35
    DivisionCode:
      type: string
      minLength: 1
      maxLength: 36
      description: >-
        Optional division code. When provided, must be between 1 and 36
        characters.
      example: DIV-001
    DivisionId:
      type: string
      maxLength: 64
      description: >-
        Division ID. When not provided, defaults to `DEFAULT_DIVISION`
        internally.
      example: '123'
    ErrorResponse:
      type: object
      description: >
        Standard error payload generated by the global exception handler.

        `message` is a single string for most errors and an array of strings
        when multiple bean-validation or request-binding errors occur in the
        same request.
      additionalProperties: false
      required:
        - message
      properties:
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      example:
        message: interest account not found
    ExternalAccountCancellationId:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        External ID managed and used by requester to track the account
        cancellation request
      example: 07d84f793027
    ExternalAccountId:
      type: string
      maxLength: 60
      description: External account ID managed by the requester
      example: '4141'
    ForecastDate:
      type: string
      format: date
      description: >-
        Date to calculate the forecast for. Must be equal to or later than the
        current date (UTC). Format = YYYY-MM-DD.
      example: '2026-11-17'
    ForecastId:
      type: string
      format: UUID
      maxLength: 36
      description: >
        Client-generated forecast UUID in the hyphenated 36-character format
        (8-4-4-4-12). A UUID without hyphens returns a `400` error. Do not reuse
        the `forecast_id` of a previous request. Letters are accepted in either
        case and returned in lowercase.
      example: 8d0c4a3e-2f71-4b9a-9e5d-6c1f0b7a2e94
    InterestAccountCancellationRequest:
      title: InterestAccountCancellationRequest
      type: object
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_cancellation_id:
          $ref: '#/components/schemas/ExternalAccountCancellationId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - account_id
        - external_account_cancellation_id
    InterestAccountCancellationResponse:
      title: InterestAccountCancellationResponse
      type: object
      properties:
        external_account_cancellation_id:
          $ref: '#/components/schemas/ExternalAccountCancellationId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - external_account_cancellation_id
    InterestBalanceRequest:
      title: InterestBalanceRequest
      type: object
      required:
        - balance_id
        - account_id
        - interest_plan_id
        - balance
        - start_cycle_date
        - value_date
        - maturity_date
      properties:
        balance_id:
          $ref: '#/components/schemas/BalanceId'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        division_code:
          $ref: '#/components/schemas/DivisionCode'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        balance:
          $ref: '#/components/schemas/BalanceAmount'
        start_cycle_date:
          $ref: '#/components/schemas/StartCycleDate'
        value_date:
          $ref: '#/components/schemas/ValueDate'
        maturity_date:
          $ref: '#/components/schemas/MaturityDate'
        trigger_reason:
          $ref: '#/components/schemas/TriggerReason'
      example:
        balance_id: 3f1c2b7a-9d4e-4a6b-8c21-5e7f9a0b1c2d
        division_id: '123'
        division_code: DIV-001
        account_id: '4040'
        external_account_id: '4141'
        interest_plan_id: df3f3e3e-62d3-4323-902e-6ae6cc210f49
        balance: 23.95
        start_cycle_date: '2025-07-17'
        value_date: '2025-07-17'
        maturity_date: '2026-05-27'
        trigger_reason: CYCLE_CLOSING
    InterestBalanceResponse:
      title: InterestBalanceResponse
      type: object
      properties:
        program_id:
          $ref: '#/components/schemas/ProgramId'
        balance_id:
          $ref: '#/components/schemas/BalanceId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - program_id
        - balance_id
      example:
        program_id: '0105'
        balance_id: 3f1c2b7a-9d4e-4a6b-8c21-5e7f9a0b1c2d
        external_account_id: '4141'
    InterestDepositRequest:
      title: InterestDepositRequest
      type: object
      required:
        - tracking_id
        - account_id
        - interest_plan_id
        - amount
        - value_date
        - maturity_date
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        amount:
          $ref: '#/components/schemas/DepositAmount'
        value_date:
          $ref: '#/components/schemas/ValueDate'
        maturity_date:
          $ref: '#/components/schemas/MaturityDate'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        division_code:
          $ref: '#/components/schemas/DivisionCode'
        metadata:
          $ref: '#/components/schemas/Metadata'
      example:
        tracking_id: 41dee***************************9789
        account_id: '123000'
        external_account_id: '4141'
        interest_plan_id: 51dee***************************9786
        amount: 5365.5
        value_date: '2024-01-15'
        maturity_date: '2025-01-15'
        division_id: '123'
        division_code: DIV-001
    InterestDepositResponse:
      title: InterestDepositResponse
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
      example:
        tracking_id: 41dee***************************9789
        external_account_id: '4141'
    InterestForecastRequest:
      title: InterestForecastRequest
      type: object
      required:
        - forecast_id
        - account_id
        - interest_plan_id
        - forecast_date
      properties:
        forecast_id:
          $ref: '#/components/schemas/ForecastId'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        forecast_date:
          $ref: '#/components/schemas/ForecastDate'
      example:
        forecast_id: 8d0c4a3e-2f71-4b9a-9e5d-6c1f0b7a2e94
        division_id: '123'
        account_id: '4040'
        external_account_id: '4141'
        interest_plan_id: df3f3e3e-62d3-4323-902e-6ae6cc210f49
        forecast_date: '2026-11-17'
    InterestForecastResponse:
      title: InterestForecastResponse
      type: object
      description: >-
        Echo of the forecast request, plus `org_id` and `program_id`, which are
        not passed in the request body. It does not contain forecast values.
        Optional fields are returned only when passed in the request.
      required:
        - forecast_id
        - org_id
        - program_id
        - account_id
        - interest_plan_id
        - forecast_date
      properties:
        forecast_id:
          $ref: '#/components/schemas/ForecastId'
        org_id:
          $ref: '#/components/schemas/OrgId'
        program_id:
          $ref: '#/components/schemas/ProgramId'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        forecast_date:
          $ref: '#/components/schemas/ForecastDate'
      example:
        forecast_id: 8d0c4a3e-2f71-4b9a-9e5d-6c1f0b7a2e94
        org_id: '1'
        program_id: '0105'
        division_id: '123'
        account_id: '4040'
        external_account_id: '4141'
        interest_plan_id: df3f3e3e-62d3-4323-902e-6ae6cc210f49
        forecast_date: '2026-11-17'
    InterestPlanId:
      type: string
      format: UUID
      minLength: 36
      maxLength: 36
      description: >
        Interest plan ID generated during the plan's creation. Must be an
        alphanumeric UUID with the alphabetical characters in lowercase.
      example: 07d84f79-3027-47bd-b628-65528ccc8fb2
    InterestWithdrawalRequest:
      title: InterestWithdrawalRequest
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        amount:
          $ref: '#/components/schemas/DepositAmount'
        withdrawal_date:
          $ref: '#/components/schemas/WithdrawalDate'
        metadata:
          $ref: '#/components/schemas/Metadata'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
        - account_id
        - amount
        - withdrawal_date
      example:
        tracking_id: 41dee125-0876-4505-80cd-947cb6049789
        account_id: '123000'
        amount: 5365.5
        withdrawal_date: '2024-01-15'
    InterestWithdrawalResponse:
      title: InterestWithdrawalResponse
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
    MaturityDate:
      type: string
      format: date
      description: Deposit maturity date. Format = YYYY-MM-DD.
      example: '2024-04-20'
    Metadata:
      type: object
      additionalProperties: true
      description: >-
        Free-form key-value metadata. The serialized JSON must not exceed 4096
        bytes.
      example:
        key: value
    OrgId:
      type: string
      description: >-
        Organization ID, parsed from your access token. You don't pass it in the
        request body, but it is returned in the response.
      example: '1'
    ProgramId:
      type: string
      description: Program ID
      example: '0105'
    StartCycleDate:
      type: string
      format: date
      description: Start of the interest cycle. Format = YYYY-MM-DD.
      example: '2025-07-17'
    TriggerReason:
      type: string
      enum:
        - CYCLE_CLOSING
        - RETROACTIVE_CYCLE_CLOSING
      default: CYCLE_CLOSING
      description: >
        Reason that triggers the balance registration. Default is
        `CYCLE_CLOSING`.


        `RETROACTIVE_CYCLE_CLOSING` requires `value_date` to be before the
        current day and not more than 365 days before the current day.
        Otherwise, the request is rejected with a `400` error.
      example: CYCLE_CLOSING
    TrackingId:
      type: string
      format: UUID
      minLength: 36
      maxLength: 36
      description: >-
        Tracking ID for the operation to ensure idempotence. Must be an
        alphanumeric UUID with the alphabetical characters in lowercase.
      example: 07d84f79-3027-47bd-b628-65528ccc8fb2
    ValueDate:
      type: string
      format: date
      description: Deposit date. Format = YYYY-MM-DD.
      example: '2024-04-15'
    WithdrawalDate:
      type: string
      format: date
      description: Deposit date. Format = YYYY-MM-DD.
      example: '2024-04-15'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    400BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: Bean validation or binding errors
              value:
                message:
                  - fixed_interest_rate must be informed
                  - margin_rate must be positive
            requestBody:
              summary: invalid or missing request value
              value:
                message: >-
                  Failed to process your request. Validate the fields in your
                  request.
            tenantHeader:
              summary: Tenant header missing or malformed
              value:
                message: x-tenant header is missing or malformed
            invalidBalanceId:
              summary: balance_id is not a valid UUID
              value:
                message: balance_id must be a valid UUID
            invalidTriggerReason:
              summary: trigger_reason has an unsupported value
              value:
                message: >-
                  trigger_reason value accepted: [CYCLE_CLOSING,
                  RETROACTIVE_CYCLE_CLOSING]
            retroactiveRequiresPastValueDate:
              summary: >-
                RETROACTIVE_CYCLE_CLOSING requested with a value_date that is
                not in the past
              value:
                message: >-
                  value_date must be in the past for RETROACTIVE_CYCLE_CLOSING
                  trigger_reason.
            tenantHeaderNotPresent:
              summary: x-tenant header is not present
              value:
                message: 400 BAD_REQUEST "Required header 'x-tenant' is not present."
            programIdHeaderMissing:
              summary: Neither the x-program-id nor the program-id header is present
              value:
                message: x-program-id or program-id must be provided
            programIdHeadersMismatch:
              summary: x-program-id and program-id headers have different values
              value:
                message: x-program-id and program-id must have the same value
            forecastRequiredFieldsNotInformed:
              summary: Forecast request body without the required fields
              value:
                message:
                  - forecast_id must be informed.
                  - account_id must be informed.
                  - interest_plan_id must be informed.
                  - forecast_date must be informed.
            forecastDateBeforeToday:
              summary: forecast_date is before the current date (UTC)
              value:
                message:
                  - forecast_date must be equal or greater than today.
            invalidForecastDate:
              summary: forecast_date is not a valid YYYY-MM-DD date
              value:
                message: forecast_date is not valid
            invalidForecastId:
              summary: forecast_id is not a valid UUID
              value:
                message: forecast_id must be a valid UUID
            accountIdNotInformed:
              summary: account_id is missing or blank
              value:
                message:
                  - account_id must be informed.
            externalAccountIdTooLong:
              summary: external_account_id is longer than 60 characters
              value:
                message:
                  - ' external_account_id maximum size accepted [60]'
            invalidInterestPlanId:
              summary: interest_plan_id is not a valid UUID
              value:
                message:
                  - interest_plan_id must be a valid UUID
    401Unauthorized:
      description: Unauthorized access
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: You cannot access this resource
    404NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            interestAccountNotFound:
              summary: Interest account not found
              value:
                message: interest account not found
            interestPlanNotFound:
              summary: Interest plan not found
              value:
                message: Interest plan not found
            benchmarkNotFound:
              summary: Benchmark not found
              value:
                message: benchmark not found
    500InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Failed to process your request
security:
  - BearerAuth: []
paths:
  /v1/interest/balance:
    post:
      summary: Create balance
      description: >
        Register a balance for an interest-bearing account using a previously
        configured interest plan to determine applicable interest rates.


        This endpoint generates an [Interest balance
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-balance-success-1)
        event when the balance is created successfully.

        This endpoint generates an [Interest balance
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-balance-failure-1)
        event when balance operation fails.


        The event payload includes: `program_id`, `balance_id`, `account_id`,
        `interest_plan_id`, `balance`, `start_cycle_date`, `value_date`,
        `maturity_date`, and `trigger_reason`. The optional field
        `external_account_id` is included in the event only when present in the
        request. The division fields `division_id` and `division_code` are
        included in the event only when a non-default division is provided. They
        are omitted when `division_id` is `DEFAULT_DIVISION` or the value is
        `null`.


        The optional field `external_account_id` is only returned in the
        response when present in the request.


        The optional field `trigger_reason` indicates why the balance
        registration is being triggered. When omitted or `null`, it defaults to
        `CYCLE_CLOSING`. `RETROACTIVE_CYCLE_CLOSING` is only valid when
        `value_date` is before the current date. Otherwise, the request is
        rejected with a `400` error.


        `balance_id` must be a valid UUID. Alphabetical characters are accepted
        in either case on input, but are converted to lowercase in the response.
      tags:
        - Interest engine
      operationId: post-v1-interest-balance
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestBalanceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestBalanceResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/deposit:
    post:
      summary: Deposit money
      description: >
        Deposit amount into the specified account using a previously configured
        interest plan to calculate applicable interest rates.


        This endpoint generates the following events.

        - [Interest deposit
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-deposit-success-1)
        when deposit operation succeeds

        - [Interest deposit
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-deposit-failure-1)
        when deposit operation fails


        The following events are applicable only to Brazil and are generated
        instead of the two events above when this endpoint is requested by a B3
        (Brasil, Bolsa, Balcão) organization.

        - [Interest registration
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-registration-success-1)
        when deposit operation succeeds

        - [Interest registration
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-registration-failure-1)
        when deposit operation fails


        The optional field `external_account_id` is only returned in the
        response and included in the events when present in the request.


        The division fields `division_id` and `division_code` are included in
        the events only when a non-default division is provided. They are
        omitted when `division_id` is `DEFAULT_DIVISION` or the value is null.


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-deposit
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestDepositRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestDepositResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/withdrawal:
    post:
      summary: Withdraw money
      description: >
        Withdraw amount from an account.


        This endpoint generates the following events.

        - [Interest withdrawal
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-withdrawal-success-1)
        when withdrawal operation succeeds

        - [Interest withdrawal
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-withdrawal-failure-1)
        when withdrawal operation fails


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-withdrawal
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestWithdrawalResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/account/cancellation:
    post:
      summary: Cancel account
      description: >
        Cancel all operations for the specified account, and withdraw the
        remaining balance.


        This endpoint generates the following events.

        - [Interest account cancellation
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-account-cancellation-success-1)
        when account cancellation operation succeeds

        - [Interest account cancellation
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-account-cancellation-failure-1)
        when account cancellation fails


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-account-cancellation
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestAccountCancellationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAccountCancellationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/forecast:
    post:
      summary: Create interest forecast [Beta]
      description: >
        Request a forecast of the gross interest and the gross balance that an
        interest-bearing account is expected to have on `forecast_date`.


        The forecast is asynchronous. The `200` response only confirms receipt
        of the request and does not contain forecast values. A failure event
        reports any problem with the interest plan or account.


        The following events deliver endpoint results:

        - [Interest forecast
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-forecast-success-1)
        when the forecast is calculated

        - [Interest forecast
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-forecast-failure-1)
        when the forecast cannot be calculated


        If a request repeats a `forecast_id`, the endpoint still returns `200`,
        and an Interest forecast failed event reports the message `The provided
        forecast_id has already been used.`


        In rare cases, such as a retry after a temporary failure, you can
        receive the same event more than once. All events for a request carry
        its `forecast_id`, so you can use it to recognize and ignore a repeated
        event.
