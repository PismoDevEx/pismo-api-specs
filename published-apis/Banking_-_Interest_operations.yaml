openapi: 3.1.0
info:
  title: Banking - Interest operations
  version: 1.0.0
  description: API to handle interest bearing account operations
  contact:
    name: API Support
    url: https://developers.pismolabs.io/pismo-docs/docs/support
  license:
    name: Copyright Pismo
servers:
  - url: https://sandbox.pismolabs.io/interest-engine
    description: Sandbox API server for integration
tags:
  - name: Interest engine
    description: Endpoints for handling interest bearing account operations
components:
  parameters:
    Authorization:
      name: authorization
      in: header
      description: Authorization
      required: true
      example: Bearer <access-token>
      schema:
        type: string
    ContentType:
      name: content-type
      in: header
      description: Content type
      required: true
      example: application/json
      schema:
        type: string
  schemas:
    AccountId:
      type: string
      format: number
      description: Account ID. Must be between 1 and 64.
      example: '15001'
    BalanceAmount:
      type: number
      format: double
      minimum: 0
      description: Balance amount. Must be equal to or greater than zero.
      example: 23.95
    BalanceId:
      type: string
      maxLength: 64
      description: >-
        Unique identifier for the balance, generated by the client. The value
        must be a valid UUID.
      example: uuid-generated-client-id
    DepositAmount:
      type: number
      format: double
      exclusiveMinimum: 0
      description: Amount to be deposited
      example: 550.35
    DivisionId:
      type: string
      maxLength: 64
      description: >-
        Division ID. When not provided, defaults to `DEFAULT_DIVISION`
        internally.
      example: '123'
    ErrorResponse:
      type: object
      description: >
        Standard error payload generated by the global exception handler.

        `message` is a single string for most errors and an array of strings
        when multiple bean-validation or request-binding errors occur in the
        same request.
      additionalProperties: false
      required:
        - message
      properties:
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      example:
        message: interest account not found
    ExternalAccountCancellationId:
      type: string
      minLength: 1
      maxLength: 64
      description: >-
        External ID managed and used by requester to track the account
        cancellation request
      example: 07d84f793027
    ExternalAccountId:
      type: string
      maxLength: 60
      description: External account ID managed by the requester
      example: '4141'
    InterestAccountCancellationRequest:
      title: InterestAccountCancellationRequest
      type: object
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_cancellation_id:
          $ref: '#/components/schemas/ExternalAccountCancellationId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - account_id
        - external_account_cancellation_id
    InterestAccountCancellationResponse:
      title: InterestAccountCancellationResponse
      type: object
      properties:
        external_account_cancellation_id:
          $ref: '#/components/schemas/ExternalAccountCancellationId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - external_account_cancellation_id
    InterestBalanceRequest:
      title: InterestBalanceRequest
      type: object
      required:
        - balance_id
        - account_id
        - interest_plan_id
        - balance
        - start_cycle_date
        - value_date
        - maturity_date
      properties:
        balance_id:
          $ref: '#/components/schemas/BalanceId'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        balance:
          $ref: '#/components/schemas/BalanceAmount'
        start_cycle_date:
          $ref: '#/components/schemas/StartCycleDate'
        value_date:
          $ref: '#/components/schemas/ValueDate'
        maturity_date:
          $ref: '#/components/schemas/MaturityDate'
      example:
        balance_id: uuid-generated-client-id
        division_id: '123'
        account_id: '4040'
        external_account_id: '4141'
        interest_plan_id: df3f3e3e-62d3-4323-902e-6ae6cc210f49
        balance: 23.95
        start_cycle_date: '2025-07-17'
        value_date: '2025-07-17'
        maturity_date: '2026-05-27'
    InterestBalanceResponse:
      title: InterestBalanceResponse
      type: object
      properties:
        program_id:
          $ref: '#/components/schemas/ProgramId'
        balance_id:
          $ref: '#/components/schemas/BalanceId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - program_id
        - balance_id
      example:
        program_id: '0105'
        balance_id: uuid-generated-client-id
        external_account_id: '4141'
    InterestDepositRequest:
      title: InterestDepositRequest
      type: object
      required:
        - tracking_id
        - account_id
        - interest_plan_id
        - amount
        - value_date
        - maturity_date
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
        interest_plan_id:
          $ref: '#/components/schemas/InterestPlanId'
        amount:
          $ref: '#/components/schemas/DepositAmount'
        value_date:
          $ref: '#/components/schemas/ValueDate'
        maturity_date:
          $ref: '#/components/schemas/MaturityDate'
        division_id:
          $ref: '#/components/schemas/DivisionId'
        metadata:
          $ref: '#/components/schemas/Metadata'
      example:
        tracking_id: 41dee***************************9789
        account_id: '123000'
        external_account_id: '4141'
        interest_plan_id: 51dee***************************9786
        amount: 5365.5
        value_date: '2024-01-15'
        maturity_date: '2025-01-15'
        division_id: '123'
    InterestDepositResponse:
      title: InterestDepositResponse
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
      example:
        tracking_id: 41dee***************************9789
        external_account_id: '4141'
    InterestPlanId:
      type: string
      format: UUID
      minLength: 36
      maxLength: 36
      description: >
        Interest plan ID generated during the plan's creation. Must be an
        alphanumeric UUID with the alphabetical characters in lowercase.
      example: 07d84f79-3027-47bd-b628-65528ccc8fb2
    InterestWithdrawalRequest:
      title: InterestWithdrawalRequest
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        amount:
          $ref: '#/components/schemas/DepositAmount'
        withdrawal_date:
          $ref: '#/components/schemas/WithdrawalDate'
        metadata:
          $ref: '#/components/schemas/Metadata'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
        - account_id
        - amount
        - withdrawal_date
      example:
        tracking_id: 41dee125-0876-4505-80cd-947cb6049789
        account_id: '123000'
        amount: 5365.5
        withdrawal_date: '2024-01-15'
    InterestWithdrawalResponse:
      title: InterestWithdrawalResponse
      type: object
      properties:
        tracking_id:
          $ref: '#/components/schemas/TrackingId'
        external_account_id:
          $ref: '#/components/schemas/ExternalAccountId'
      required:
        - tracking_id
    MaturityDate:
      type: string
      format: date
      description: Deposit maturity date. Format = YYYY-MM-DD.
      example: '2024-04-20'
    Metadata:
      type: object
      additionalProperties: true
      description: >-
        Free-form key-value metadata. The serialized JSON must not exceed 4096
        bytes.
      example:
        key: value
    ProgramId:
      type: string
      description: Program ID
      example: '0105'
    StartCycleDate:
      type: string
      format: date
      description: Start of the interest cycle. Format = YYYY-MM-DD.
      example: '2025-07-17'
    TrackingId:
      type: string
      format: UUID
      minLength: 36
      maxLength: 36
      description: >-
        Tracking ID for the operation to ensure idempotence. Must be an
        alphanumeric UUID with the alphabetical characters in lowercase.
      example: 07d84f79-3027-47bd-b628-65528ccc8fb2
    ValueDate:
      type: string
      format: date
      description: Deposit date. Format = YYYY-MM-DD.
      example: '2024-04-15'
    WithdrawalDate:
      type: string
      format: date
      description: Deposit date. Format = YYYY-MM-DD.
      example: '2024-04-15'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    400BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: Bean validation or binding errors
              value:
                message:
                  - fixed_interest_rate must be informed
                  - margin_rate must be positive
            requestBody:
              summary: invalid or missing request value
              value:
                message: >-
                  Failed to process your request. Validate the fields in your
                  request.
            tenantHeader:
              summary: Tenant header missing or malformed
              value:
                message: x-tenant header is missing or malformed
    401Unauthorized:
      description: Unauthorized access
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
                example: You cannot access this resource
    404NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            interestAccountNotFound:
              summary: Interest account not found
              value:
                message: interest account not found
            interestPlanNotFound:
              summary: Interest plan not found
              value:
                message: Interest plan not found
            benchmarkNotFound:
              summary: Benchmark not found
              value:
                message: benchmark not found
    500InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Failed to process your request
security:
  - BearerAuth: []
paths:
  /v1/interest/balance:
    post:
      summary: Create balance
      description: >
        Register a balance for an interest-bearing account using a previously
        configured interest plan to determine applicable interest rates.


        This endpoint generates the Interest balance succeeded event when the
        balance is created successfully.


        The event payload includes: `program_id`, `balance_id`, `account_id`,
        `interest_plan_id`, `balance`, `start_cycle_date`, `value_date`, and
        `maturity_date`. Optional fields `division_id` and `external_account_id`
        are included in the event only when present in the request.


        The optional field `external_account_id` is only returned in the
        response when present in the request.
      tags:
        - Interest engine
      operationId: post-v1-interest-balance
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestBalanceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestBalanceResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/deposit:
    post:
      summary: Deposit money
      description: >
        Deposit amount into the specified account using a previously configured
        interest plan to calculate applicable interest rates.


        This endpoint generates the following events.

        - [Interest deposit
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-deposit-success-1)
        when deposit operation succeeds

        - [Interest deposit
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-deposit-failure-1)
        when deposit operation fails


        The following events are applicable only to Brazil and are generated
        instead of the two events above when this endpoint is requested by a B3
        (Brasil, Bolsa, Balcão) organization.

        - [Interest registration
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-registration-success-1)
        when deposit operation succeeds

        - [Interest registration
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-registration-failure-1)
        when deposit operation fails


        The optional field `external_account_id` is only returned in the
        response and included in the events when present in the request.


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-deposit
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestDepositRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestDepositResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/withdrawal:
    post:
      summary: Withdraw money
      description: >
        Withdraw amount from an account.


        This endpoint generates the following events.

        - [Interest withdrawal
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-withdrawal-success-1)
        when withdrawal operation succeeds

        - [Interest withdrawal
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-withdrawal-failure-1)
        when withdrawal operation fails


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-withdrawal
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestWithdrawalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestWithdrawalResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v1/interest/account/cancellation:
    post:
      summary: Cancel account
      description: >
        Cancel all operations for the specified account, and withdraw the
        remaining balance.


        This endpoint generates the following events.

        - [Interest account cancellation
        succeeded](https://developers.pismo.io/events/docs/interest-engine-interest-account-cancellation-success-1)
        when account cancellation operation succeeds

        - [Interest account cancellation
        failed](https://developers.pismo.io/events/docs/interest-engine-interest-account-cancellation-failure-1)
        when account cancellation fails


        For more information, refer to the [Interest-bearing
        accounts](doc:interest-bearing-accounts) guide.
      tags:
        - Interest engine
      operationId: post-v1-interest-account-cancellation
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        description: Requested body of authorization
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestAccountCancellationRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAccountCancellationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
